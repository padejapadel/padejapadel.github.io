<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cambridge vs Essex — Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800;900&family=Saira:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    /* Padeja palette */
    --navy:#0D1B2A; --panel:#12243a; --panel2:#0f1e30; --line:rgba(255,255,255,.09);
    --ink:#eaf2ff; --dim:#8ea6c4; --dim2:#5a7a99;
    --teal:#00D4AA; --sky:#00A8FF; --coral:#FF6B6B; --gold:#FFD54A;
    /* team accents: Essex (team A / left) = sky, Cambridge (team B / right) = coral */
    --a:#00A8FF; --b:#FF6B6B; --live:#FF6B6B;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(1500px 760px at 15% -12%,#16304d,var(--navy)) fixed;
    color:var(--ink);
    font-family:'Hanken Grotesk',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow:hidden}
  .stage{height:100vh;display:flex;flex-direction:column;padding:2.2vh 2vw 1.4vh;gap:1.4vh}

  /* ---------- header ---------- */
  .hdr{display:flex;align-items:center;gap:1.2vw}
  .hdr .title{font-family:'Saira';font-weight:900;font-size:3.6vh;letter-spacing:.01em;line-height:1}
  .hdr .meta{color:var(--dim);font-weight:800;font-size:1.5vh;letter-spacing:.16em;text-transform:uppercase;margin-top:.7vh}
  .hdr .spacer{flex:1}
  .live{display:flex;align-items:center;gap:.6vw;background:rgba(255,107,107,.16);border:1px solid rgba(255,107,107,.45);
    color:#fff;font-family:'Saira';font-weight:900;font-size:1.8vh;letter-spacing:.16em;padding:.6vh 1.1vw;border-radius:999px}
  .live .dot{width:1.1vh;height:1.1vh;border-radius:50%;background:var(--live);box-shadow:0 0 0 0 var(--live);animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,107,107,.6)}70%{box-shadow:0 0 0 1.4vh rgba(255,107,107,0)}100%{box-shadow:0 0 0 0 rgba(255,107,107,0)}}

  /* ---------- scoreboard ---------- */
  .board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:1.2vw;
    background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
    border-radius:2vh;padding:2vh 2vw;box-shadow:0 2vh 5vh rgba(0,0,0,.35)}
  .team{display:flex;align-items:center;gap:1.3vw;min-width:0}
  .team.b{flex-direction:row-reverse;text-align:right}
  .crest{height:12.5vh;width:14vh;object-fit:contain;background:#fff;border-radius:1.6vh;padding:1vh;
    box-shadow:0 1vh 2.4vh rgba(0,0,0,.4);flex:none}
  .tblock{min-width:0}
  .team .nm{font-family:'Saira';font-weight:900;font-size:4.4vh;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .team.a .nm{color:var(--a)} .team.b .nm{color:var(--b)}
  .team .sub{color:var(--dim);font-weight:800;font-size:1.4vh;letter-spacing:.12em;text-transform:uppercase;margin-top:.6vh}
  .team .pts{font-family:'Saira';font-weight:900;font-size:11vh;line-height:.8;font-variant-numeric:tabular-nums;
    min-width:12vh;text-align:center;border-radius:1.6vh;padding:.5vh 1vh;flex:none}
  .team.a .pts{background:linear-gradient(180deg,var(--a),#0088d6);color:#04121d}
  .team.b .pts{background:linear-gradient(180deg,var(--b),#e2504f);color:#2a0a0a}
  .team.dim{opacity:.62}
  .mid{text-align:center;padding:0 .5vw}
  .mid .vs{font-family:'Saira';font-weight:900;font-size:2.2vh;letter-spacing:.14em;
    background:linear-gradient(90deg,var(--teal),var(--sky));-webkit-background-clip:text;background-clip:text;color:transparent}
  .mid .target{color:var(--dim);font-size:1.45vh;font-weight:800;text-transform:uppercase;letter-spacing:.12em;margin-top:.7vh;white-space:nowrap}
  .mid .pips{display:flex;gap:.5vh;justify-content:center;margin-top:1vh}
  .mid .pip{width:1.3vh;height:1.3vh;border-radius:50%;background:var(--line);border:1px solid rgba(255,255,255,.14)}
  .mid .pip.a{background:var(--a)} .mid .pip.b{background:var(--b)}
  .mid .won{color:var(--gold);font-family:'Saira';font-weight:900;font-size:2vh;margin-top:1vh;letter-spacing:.04em;min-height:2vh}

  /* ---------- matches grid ---------- */
  .grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:1.1vh 1.4vw}
  .m{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:1.5vh;
    padding:1.1vh 1.2vw;display:flex;flex-direction:column;gap:.7vh;min-height:0}
  .m .mh{display:flex;align-items:center;gap:.8vw}
  .m .brk{font-family:'Saira';font-weight:800;font-size:1.85vh;letter-spacing:.01em}
  .m .brk .dotc{display:inline-block;width:.9vh;height:.9vh;border-radius:50%;background:var(--teal);margin-right:.7vw;vertical-align:middle}
  .m .sp{flex:1}
  .m .ct{color:var(--dim);font-weight:800;font-size:1.4vh;letter-spacing:.05em;white-space:nowrap}
  .m .row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:1vw;padding:.55vh .8vw;border-radius:1vh;border:1px solid transparent}
  .m .row.a{background:rgba(0,168,255,.10);border-color:rgba(0,168,255,.14)}
  .m .row.b{background:rgba(255,107,107,.10);border-color:rgba(255,107,107,.14)}
  .m .row.win.a{background:linear-gradient(90deg,var(--a),#0088d6);border-color:transparent}
  .m .row.win.a .who,.m .row.win.a .sc b,.m .row.win.a .tick{color:#04121d}
  .m .row.win.b{background:linear-gradient(90deg,var(--b),#e2504f);border-color:transparent}
  .m .row.win.b .who,.m .row.win.b .sc b,.m .row.win.b .tick{color:#2a0a0a}
  .m .who{font-weight:800;font-size:1.95vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .m .sc{display:flex;gap:.7vw;align-items:center}
  .m .sc b{font-family:'Saira';font-weight:900;font-size:2.1vh;font-variant-numeric:tabular-nums;min-width:1.6vh;text-align:center}
  .m .tick{font-weight:900;font-size:1.8vh;color:transparent;width:1.6vh;text-align:center}
  .waiting{color:var(--dim2);font-size:1.6vh;font-weight:700}

  /* ---------- footer ---------- */
  .foot{display:flex;align-items:center;justify-content:center;gap:2vw;height:5.6vh}
  .foot img.powered{height:4.6vh;width:auto;display:block;opacity:.95}
  .off{position:fixed;bottom:1vh;right:1.2vw;color:var(--dim2);font-size:1.2vh;font-weight:700}
</style>
</head>

  };
  function crestFor(name){
    var n=(name||"").toLowerCase();
    if(n.indexOf("cambridge")>-1) return CREST.cambridge;
    if(n.indexOf("essex")>-1)     return CREST.essex;
    return "";
  }
  function setCrest(id, src){
    var el=document.getElementById(id);
    if(src){ el.src=src; el.style.display=""; } else { el.style.display="none"; }
  }

  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];}); }
  function pairName(p1,p2){ p1=(p1||"").trim(); p2=(p2||"").trim(); if(p1&&p2) return p1+" & "+p2; return p1||p2||""; }
  function winnerOf(fx){
    var aw=0,bw=0;
    (fx.sets||[]).forEach(function(s){ var a=parseInt(s.a,10),b=parseInt(s.b,10); if(isNaN(a)||isNaN(b))return; if(a>b)aw++; else if(b>a)bw++; });
    if(aw>=2)return"a"; if(bw>=2)return"b"; return"";
  }
  function setsHtml(fx, side){
    var out="";
    (fx.sets||[]).forEach(function(s){
      var a=s.a, b=s.b; if((a===""||a==null)&&(b===""||b==null)) return;
      out += '<b>'+esc(side==="a"? (a===""?"–":a) : (b===""?"–":b))+'</b>';
    });
    return out || '<span class="waiting" style="font-size:1.5vh">—</span>';
  }
  function pipsHtml(a,b){
    var out="";
    for(var i=0;i<WIN_TARGET;i++) out+='<span class="pip'+(i<a?" a":"")+'"></span>';
    out+='<span style="width:1vw"></span>';
    for(var j=0;j<WIN_TARGET;j++) out+='<span class="pip'+(j<b?" b":"")+'"></span>';
    return out;
  }

  function render(d){
    var A=d.teamA||"Cambridge", B=d.teamB||"Essex";
    document.getElementById("title").textContent = d.title||"Cambridge vs Essex";
    var meta=[]; if(d.subtitle)meta.push(d.subtitle); if(d.venue)meta.push(d.venue);
    if(d.date){ try{ var dt=new Date(d.date+"T00:00:00"); if(!isNaN(dt)) meta.push(dt.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})); }catch(e){} }
    document.getElementById("meta").textContent = meta.join(" · ");
    document.getElementById("nmA").textContent=A; document.getElementById("nmB").textContent=B;
    setCrest("crestA", crestFor(A)); setCrest("crestB", crestFor(B));

    var fx=d.fixtures||[], a=0,b=0;
    fx.forEach(function(f){ var w=winnerOf(f); if(w==="a")a++; else if(w==="b")b++; });
    document.getElementById("ptsA").textContent=a; document.getElementById("ptsB").textContent=b;
    document.getElementById("pips").innerHTML=pipsHtml(a,b);

    // dim the trailing side; announce the winner if someone hits the target or all matches are done
    var tA=document.getElementById("teamA"), tB=document.getElementById("teamB");
    tA.classList.toggle("dim", a<b); tB.classList.toggle("dim", b<a);
    var won=document.getElementById("won");
    var done = fx.length && fx.every(function(f){ return winnerOf(f)!==""; });
    if(a>=WIN_TARGET || (done && a>b)) won.textContent = "🏆 "+A+" win the day";
    else if(b>=WIN_TARGET || (done && b>a)) won.textContent = "🏆 "+B+" win the day";
    else if(done && a===b) won.textContent = "Match drawn";
    else won.textContent="";

    var html="";
    fx.forEach(function(f,i){
      var w=winnerOf(f);
      var ct=[]; if(f.court)ct.push("Court "+esc(f.court)); if(f.time)ct.push(esc(f.time));
      html += '<div class="m">'
        + '<div class="mh"><div class="brk"><span class="dotc"></span>'+esc(f.bracket||("Match "+(i+1)))+'</div><div class="sp"></div><div class="ct">'+ct.join(" · ")+'</div></div>'
        + '<div class="row a'+(w==="a"?" win a":"")+'"><div class="who">'+(esc(pairName(f.a1,f.a2))||('<span class="waiting">'+esc(A)+' pair TBC</span>'))+'</div><div class="sc">'+setsHtml(f,"a")+'<span class="tick">'+(w==="a"?"✓":"")+'</span></div></div>'
        + '<div class="row b'+(w==="b"?" win b":"")+'"><div class="who">'+(esc(pairName(f.b1,f.b2))||('<span class="waiting">'+esc(B)+' pair TBC</span>'))+'</div><div class="sc">'+setsHtml(f,"b")+'<span class="tick">'+(w==="b"?"✓":"")+'</span></div></div>'
        + '</div>';
    });
    document.getElementById("grid").innerHTML = html;
  }

  function poll(){
    fetch(SUPA+"/rest/v1/county_state?id=eq."+encodeURIComponent(EVENT_ID)+"&select=data",
      { headers:{ apikey:ANON, Authorization:"Bearer "+ANON } })
      .then(function(r){ return r.json(); })
      .then(function(rows){ var d=rows&&rows[0]&&rows[0].data; if(d) render(d); document.getElementById("off").textContent=""; })
      .catch(function(){ document.getElementById("off").textContent="reconnecting…"; });
  }

  // Keep a wall-mounted TV awake without reloading.
  (function keepAwake(){
    var lock=null;
    function acq(){ if(!("wakeLock" in navigator)||document.visibilityState!=="visible")return;
      navigator.wakeLock.request("screen").then(function(l){ lock=l; l.addEventListener("release",function(){lock=null;}); }).catch(function(){}); }
    document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible"&&!lock)acq(); });
    setInterval(function(){ if(!lock)acq(); },30000); acq();
  })();

  poll();
  setInterval(poll, 8000);
})();
</script>
