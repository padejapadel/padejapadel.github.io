<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Data Defenders</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --sky-top: #0b3a8c;
      --sky-bottom: #3fa3e8;
      --yellow: #ffd21f;
      --navy: #0a1f44;
      --window-bar: #10284f;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--sky-bottom);
      font-family: "Inter", system-ui, sans-serif;
      color: #fff;
    }

    /* ---------- Section 1: the video ---------- */
    .hero {
      display: flex;
      justify-content: center;
      background: #000;
    }
    /* Full 1152x960 size, shrinks to fit on smaller screens */
    .hero video {
      display: block;
      width: 1152px;
      max-width: 100%;
      height: auto;
    }

    /* ---------- Section 2: the map window ---------- */
    .map-section {
      background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
      padding: 64px 16px 80px;
    }
    .map-section h2 {
      font-family: "Luckiest Guy", "Impact", sans-serif;
      font-weight: 400;
      font-size: clamp(32px, 6vw, 56px);
      letter-spacing: 1px;
      line-height: 1;
      text-align: center;
      color: var(--yellow);
      text-shadow: 3px 3px 0 var(--navy), -1px -1px 0 var(--navy), 1px -1px 0 var(--navy), -1px 1px 0 var(--navy);
      margin: 0 0 12px;
    }
    .map-section p.intro {
      text-align: center;
      max-width: 640px;
      margin: 0 auto 36px;
      font-size: 17px;
      line-height: 1.5;
      opacity: .92;
    }

    /* The "window" frame around the map */
    .window {
      max-width: 1371px;          /* the map's own width */
      margin: 0 auto;
      border: 4px solid var(--navy);
      border-radius: 14px;
      overflow: hidden;
      background: var(--navy);
      box-shadow: 8px 8px 0 var(--navy), 0 24px 60px rgba(0,0,0,.35);
    }
    .window-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: var(--window-bar);
      border-bottom: 3px solid var(--yellow);
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot.red { background: #ff5f57; }
    .dot.amber { background: #febc2e; }
    .dot.green { background: #28c840; }
    .window-title {
      margin-left: 10px;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: .5px;
      color: #cfe0ff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .window img {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>

  <!-- Section 1: video (loops forever) -->
  <section class="hero">
    <video src="data-defenders.mp4" poster="data-defenders-poster.jpg"
           width="1152" height="960" autoplay muted loop playsinline></video>
  </section>

  <!-- Section 2: animated map in a window -->
  <section class="map-section">
    <!-- Change the heading and text below to whatever you like -->
    <h2>Around the World</h2>
    <p class="intro">Wherever the data goes, the Data Defenders go too.</p>

    <div class="window">
      <div class="window-bar">
        <span class="dot red"></span>
        <span class="dot amber"></span>
        <span class="dot green"></span>
        <span class="window-title">mission-map.live</span>
      </div>
      <img src="travel-map.gif" width="1371" height="685"
           alt="Animated map showing routes between the UK, the US, Spain and Austria">
    </div>
  </section>

</body>
</html>
