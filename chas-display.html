<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chas Berger — Live</title>
<style>
  :root{--bg:#0A1624;--panel:#132133;--line:#22344d;--brand:#3BC8F5;--green:#35D6A4;--gold:#F5B83D;--sec:#8AA4C0;--white:#fff;--win:#35D6A4;--loss:#F56040}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:radial-gradient(1200px 700px at 20% -10%,#12263f 0%,var(--bg) 60%);color:var(--white);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;overflow:hidden}
  .wrap{height:100vh;display:flex;flex-direction:column;padding:1.4vh 1.6vw}
  header{display:flex;align-items:center;gap:1.2vw;flex:0 0 auto;padding-bottom:1.2vh;border-bottom:1px solid var(--line)}
  header img.padeja{height:4.2vh;border-radius:0.8vh;display:block}
  .cbchip{background:#fff;border-radius:1vh;padding:.55vh 1vw;display:flex;align-items:center;height:5.6vh;flex:0 0 auto}
  .cbchip img{height:100%;display:block}
  .ttl{flex:1;min-width:0}
  .ttl h1{font-size:2.5vh;letter-spacing:.5px;line-height:1.05}
  .ttl .sub{font-size:1.35vh;color:var(--sec);margin-top:.4vh;font-weight:600}
  .code{font-size:1.3vh;color:var(--sec);text-align:right;line-height:1.4}
  .code b{color:var(--gold);font-size:2.1vh;letter-spacing:2px;display:block}
  main{flex:1;display:grid;grid-template-columns:1.32fr 1fr;gap:1.2vw;min-height:0;padding-top:1.2vh}
  .groups{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1vh 1vw;min-height:0}
  .grp{background:var(--panel);border:1px solid var(--line);border-radius:1.1vh;padding:.9vh 1vw;display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .grp h2{font-size:1.5vh;color:var(--gold);letter-spacing:1px;margin-bottom:.5vh;flex:0 0 auto}
  table{width:100%;border-collapse:collapse;font-size:1.32vh}
  th{color:var(--sec);text-transform:uppercase;font-size:.98vh;text-align:center;padding:.35vh .3vh;font-weight:800}
  th.tm{text-align:left}
  td{padding:.42vh .3vh;text-align:center;border-top:1px solid #1b2942;white-space:nowrap}
  td.tm{text-align:left;font-weight:600;line-height:1.05;padding-top:.5vh;padding-bottom:.5vh}
  td.tm .p1{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  td.tm .p2{display:block;font-weight:500;color:var(--sec);font-size:1.02vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  td.pts{font-weight:900;color:var(--green)}
  td.qp,th.qp{text-align:center;width:5.2vh}
  td.qp{font-weight:800;color:var(--brand)}
  tr.q td.qp{color:var(--gold)}
  tr.q td{background:rgba(245,184,61,.12)}
  tr.q td.rk{color:var(--gold);font-weight:900}
  .rk{color:var(--sec);width:2.2vh}
  .ko{background:var(--panel);border:1px solid var(--line);border-radius:1.1vh;padding:1vh 1vw;display:flex;flex-direction:column;min-height:0}
  .ko h2{font-size:1.6vh;color:var(--brand);letter-spacing:1px;margin-bottom:1vh;flex:0 0 auto}
  .bracket{flex:1;display:grid;grid-template-columns:1fr 1fr .8fr;gap:.8vw;align-items:center;min-height:0}
  .col{display:flex;flex-direction:column;justify-content:space-around;height:100%;gap:1vh}
  .col .lbl{font-size:1vh;color:var(--sec);text-transform:uppercase;letter-spacing:1.5px;text-align:center;margin-bottom:.4vh;font-weight:800}
  .tie{background:#0e1a2b;border:1px solid var(--line);border-radius:1vh;overflow:hidden}
  .tie.final{border-color:var(--gold);box-shadow:0 0 0 1px rgba(245,184,61,.4)}
  .side{display:flex;align-items:center;gap:.6vw;padding:.7vh .8vw;font-size:1.3vh}
  .side+.side{border-top:1px solid var(--line)}
  .side .nm{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.15}
  .side .nm small{display:block;font-weight:500;color:var(--sec);font-size:1.02vh}
  .side .sc{font-size:1.7vh;font-weight:900;min-width:2.4vh;text-align:center}
  .side.w{background:rgba(53,214,164,.14)}
  .side.w .nm{color:var(--green)}
  .side.w .sc{color:var(--green)}
  .side.pending .nm{color:var(--sec);font-weight:600;font-style:italic}
  .champ{margin-top:1vh;text-align:center;flex:0 0 auto}
  .champ .lbl{font-size:1vh;color:var(--sec);letter-spacing:2px;text-transform:uppercase}
  .champ .name{font-size:2.1vh;font-weight:900;color:var(--gold);margin-top:.3vh;min-height:2.1vh}
  footer{flex:0 0 auto;text-align:center;color:var(--sec);font-size:1.1vh;padding-top:.8vh;border-top:1px solid var(--line);margin-top:.6vh}
  .dot{display:inline-block;width:.8vh;height:.8vh;border-radius:50%;background:var(--green);margin-right:.5vh;animation:p 2s infinite}
  @keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
  /* rotating right-panel (knockout <-> group fixtures) */
  .panel{flex:1;display:flex;flex-direction:column;min-height:0}
  .kohead{display:flex;align-items:center;gap:.8vw;margin-bottom:1vh;flex:0 0 auto}
  .kohead h2{margin:0}
  .rot{margin-left:auto;display:flex;gap:.5vh}
  .rot span{width:.9vh;height:.9vh;border-radius:50%;background:var(--line);transition:background .3s}
  .rot span.on{background:var(--brand)}
  .fx{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1vh 1vw;min-height:0}
  .fxg{background:#0e1a2b;border:1px solid var(--line);border-radius:1vh;padding:.6vh .7vw;display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .fxg h3{font-size:1.35vh;color:var(--gold);letter-spacing:.5px;margin-bottom:.35vh;flex:0 0 auto;display:flex;align-items:baseline;gap:.5vw}
  .fxg h3 small{color:var(--sec);font-size:.95vh;font-weight:600;letter-spacing:.3px}
  .fxt{width:100%;border-collapse:collapse;font-size:1.22vh;table-layout:fixed}
  .fxt th{color:var(--sec);text-transform:uppercase;font-size:.82vh;font-weight:800;padding:.2vh .25vh;text-align:left;letter-spacing:.4px}
  .fxt th.cc,.fxt th.sc{text-align:center}
  .fxt th.p2{text-align:right}
  .fxt td{padding:.3vh .18vh;border-top:1px solid #17263c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fxt td.ft{color:var(--sec);width:2.9vh;font-variant-numeric:tabular-nums;font-weight:600}
  .fxt td.cc{color:var(--brand);width:1.6vh;text-align:center;font-weight:800}
  .fxt td.fp{font-weight:600;line-height:1.05}
  .fxt td.fp .cd{color:var(--gold);font-weight:800;font-size:1vh;font-variant-numeric:tabular-nums;margin-right:.35vw}
  .fxt td.fp.r{text-align:right}
  .fxt td.sc{width:2.9vh;text-align:center;font-weight:900;color:#4a5f7d;font-variant-numeric:tabular-nums}
  .fxt tr.done td.sc{color:var(--white)}
  .fxt td.fp.win{color:var(--win)}
  .fxt tr.live td{background:rgba(59,200,245,.10)}
</style>
</head>

    for(const m of pending){ const h=m.home_team_id,a=m.away_team_id; const sh=str[h]||avg,sa=str[a]||avg; const ph=sh/(sh+sa);
      const r=Math.random(), pd=0.10;
      if(r<pd){ pts[h]+=1; pts[a]+=1; }
      else { const hw=(r-pd)/(1-pd)<ph; const mg=1+Math.floor(Math.random()*5);
        if(hw){ pts[h]+=2; dif[h]+=mg; dif[a]-=mg; } else { pts[a]+=2; dif[a]+=mg; dif[h]-=mg; } } }
    const order=ids.slice().sort((x,y)=>(pts[y]-pts[x])||(dif[y]-dif[x])||(base[y].gf-base[x].gf)||String(base[x].name).localeCompare(String(base[y].name)));
    q[order[0]]++; if(order[1]) q[order[1]]++;
  }
  const out={}; ids.forEach(id=>out[id]=N?q[id]/N:0); return out;
}

async function load(){
  const {data,error}=await sb.rpc("get_host_display",{p_code:CODE});
  if(error||!data){ $("foot").textContent="Waiting for data… ("+CODE+")"; return; }
  const teams=data.teams||[], leagues=data.leagues||[], matches=data.matches||[];
  let pairs=[]; try{ const pr=await sb.rpc("get_event_pairs",{p_code:CODE}); pairs=(pr&&pr.data)||[]; }catch(e){ pairs=[]; }
  const nameById={}; pairs.forEach(pr=>nameById[pr.team_id]={n1:pr.team_name,n2:pr.player2_name});
  const pairCell=t=>{ const nm=nameById[t.id]; const n1=(nm?nm.n1:t.team_name)||""; const n2=(nm?nm.n2:t.player2_name)||"";
    return `<span class="p1">${esc(n1)}</span>`+(n2?`<span class="p2">${esc(n2)}</span>`:""); };
  const byId={}; teams.forEach(t=>byId[t.id]=t);
  const letterOf={}; leagues.forEach(l=>letterOf[l.id]=l.league_letter);
  const groupsT={A:[],B:[],C:[],D:[]}; let koLeagueId=null;
  leagues.forEach(l=>{ if(l.league_letter==='K'||String(l.name||'').toLowerCase()==='knockout') koLeagueId=l.id; });
  teams.forEach(t=>{ const L=letterOf[t.league_id]; if(groupsT[L]) groupsT[L].push(t); });

  const gLeagueId={}; leagues.forEach(l=>{ if(['A','B','C','D'].includes(l.league_letter)) gLeagueId[l.league_letter]=l.id; });

  // group tables (with a live "chance of reaching the knockout" projection)
  let gh="";
  for(const g of ["A","B","C","D"]){
    const ranked=rankTeams(groupsT[g]||[]);
    const q=qualProbs(ranked, matches.filter(m=>m.league_id===gLeagueId[g]));
    let rows="";
    ranked.forEach((t,i)=>{
      const qp=q[t.id]; const qtxt=(qp==null)?"":(qp>=0.995?"✓":(qp<=0.005?"—":Math.round(qp*100)+"%"));
      rows+=`<tr class="${i<2?'q':''}"><td class="rk">${i+1}</td><td class="tm">${pairCell(t)}</td>`
        +`<td>${num(t.played)}</td><td>${num(t.won)}</td><td>${(num(t.diff)>0?'+':'')+num(t.diff)}</td>`
        +`<td class="pts">${num(t.league_points)}</td><td class="qp">${qtxt}</td></tr>`;
    });
    if(!ranked.length) rows=`<tr><td colspan="7" style="color:var(--sec);padding:1vh">No pairs</td></tr>`;
    gh+=`<div class="grp"><h2>GROUP ${g}</h2><table>
      <thead><tr><th class="rk"></th><th class="tm">Pair</th><th>P</th><th>W</th><th>+/−</th><th>Pts</th><th class="qp">Q%</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  }
  $("groups").innerHTML=gh;

  // qualifiers
  const Q={};
  for(const g of ["A","B","C","D"]){ const r=rankTeams(groupsT[g]||[]); Q[g+"1"]=r[0]||null; Q[g+"2"]=r[1]||null; }

  // knockout (own table, via get_knockout by code)
  let ko=[]; try{ const kr=await sb.rpc("get_knockout",{p_code:CODE}); ko=(kr&&kr.data)||[]; }catch(e){ ko=[]; }
  const byOrd={}; ko.forEach(m=>byOrd[m.ord]=m);
  const isDone=m=>m&&m.status==='completed'&&m.home_score!=null&&m.away_score!=null;
  const koWin=m=>{ if(!isDone(m))return null; return num(m.home_score)>num(m.away_score)?m.home_name:(num(m.away_score)>num(m.home_score)?m.away_name:null); };
  const qName=k=>{ const t=Q[k]; if(!t) return null; const nm=nameById[t.id]; return nm?(nm.n1+(nm.n2?" & "+nm.n2:"")):pairName(t); };
  const seedPh=k=>"Group "+k[0]+" "+(k[1]==="1"?"winner":"runner-up");

  // slot: prefer the seeded knockout row; else show predicted names (provisional)
  const slot=(ord, predH, predA)=>{
    const m=byOrd[ord];
    if(m){ const w=koWin(m);
      return {hN:m.home_name, aN:m.away_name, hS:(m.home_score!=null?num(m.home_score):null), aS:(m.away_score!=null?num(m.away_score):null),
              hW:!!w&&w===m.home_name, aW:!!w&&w===m.away_name, live:true};
    }
    return {hN:predH, aN:predA, hS:null, aS:null, hW:false, aW:false, live:false};
  };
  const qfPred=[["A1","D2"],["B1","C2"],["C1","B2"],["D1","A2"]];
  const qfSlots=qfPred.map(([h,a],i)=>slot(i+1, qName(h)||seedPh(h), qName(a)||seedPh(a)));
  const qfWinN=[1,2,3,4].map(o=>koWin(byOrd[o]));
  const sfSlots=[[0,1],[2,3]].map(([i,j],s)=>slot(5+s, qfWinN[i]||("Winner QF"+(i+1)), qfWinN[j]||("Winner QF"+(j+1))));
  const sfWinN=[5,6].map(o=>koWin(byOrd[o]));
  const finalSlot=slot(7, sfWinN[0]||"Winner SF1", sfWinN[1]||"Winner SF2");
  const champN=koWin(byOrd[7]);

  const sideS=(name,score,win,prov)=>`<div class="side ${prov?'pending':''} ${win?'w':''}"><span class="nm">${esc(name||'TBC')}</span><span class="sc">${score!=null?score:''}</span></div>`;
  const tieS=(o,cls)=>`<div class="tie ${cls||''}">${sideS(o.hN,o.hS,o.hW,!o.live)}${sideS(o.aN,o.aS,o.aW,!o.live)}</div>`;
  const qfCol=`<div class="col"><div class="lbl">Quarter-finals · 2:50</div>`+qfSlots.map(o=>tieS(o,"")).join("")+`</div>`;
  const sfCol=`<div class="col"><div class="lbl">Semi-finals · 3:10</div>`+sfSlots.map(o=>tieS(o,"")).join("")+`</div>`;
  const fCol=`<div class="col"><div class="lbl">Final · 3:30</div>${tieS(finalSlot,"final")}</div>`;
  $("bracket").innerHTML=qfCol+sfCol+fCol;
  $("champ").textContent=champN||"—";

  // group fixtures & results (rotates in opposite the knockout) ----------------
  const codeOf=id=>{ const nm=nameById[id]; const t=byId[id]||{}; return CODE_P1[(nm?nm.n1:t.team_name)||""]||null; };
  const fpCell=(id,right)=>{ const nm=nameById[id]||{}; const t=byId[id]||{}; const n1=(nm.n1||t.team_name||"");
    const n2=(nm.n2||t.player2_name||""); const first=String(n1).split(/\s+/)[0]||n1; const code=CODE_P1[n1]||"";
    const cd=code?`<b class="cd">${code}</b>`:""; const body=`${cd} ${esc(first)}`;
    return `<td class="fp${right?' r':''}" title="${esc(n1+(n2?' & '+n2:''))}">${body}</td>`; };
  let fxh="";
  for(const g of ["A","B","C","D"]){
    const gid=gLeagueId[g];
    let ms=(matches||[]).filter(m=>m.league_id===gid && m.home_team_id && m.away_team_id).map(m=>{
      const key=[codeOf(m.home_team_id),codeOf(m.away_team_id)].sort().join("-"); const s=SCHED[key]||{};
      return {m, t:s.t||"", c:s.c||0, k:s.t?tmin(s.t):99999};
    });
    ms.sort((a,b)=> a.k-b.k || a.c-b.c);
    const done=ms.filter(x=>x.m.status==='completed'||x.m.status==='finished').length;
    let rows="";
    ms.forEach(({m,t,c})=>{
      const fin=(m.status==='completed'||m.status==='finished')&&m.home_score!=null&&m.away_score!=null;
      const hs=num(m.home_score), as=num(m.away_score);
      const hw=fin&&hs>as, aw=fin&&as>hs;
      rows+=`<tr class="${fin?'done':''}">`
        +`<td class="ft">${esc(t||'—')}</td><td class="cc">${c||'·'}</td>`
        +fpCell(m.home_team_id,false).replace('class="fp"',`class="fp${hw?' win':''}"`)
        +`<td class="sc">${fin?`${hs}–${as}`:'v'}</td>`
        +fpCell(m.away_team_id,true).replace('class="fp r"',`class="fp r${aw?' win':''}"`)
        +`</tr>`;
    });
    if(!ms.length) rows=`<tr><td colspan="5" style="color:var(--sec);padding:.8vh">No fixtures</td></tr>`;
    fxh+=`<div class="fxg"><h3>GROUP ${g} <small>${done}/${ms.length} played</small></h3>`
      +`<table class="fxt"><thead><tr><th>Time</th><th class="cc">Ct</th><th>Pair</th><th class="sc"></th><th class="p2">Pair</th></tr></thead>`
      +`<tbody>${rows}</tbody></table></div>`;
  }
  $("fx").innerHTML=fxh;

  const played=matches.filter(m=>m.status==='completed'||m.status==='finished').length;
  $("foot").textContent=`Group matches ${played}/60 played · Q% = live chance of reaching the knockout · updates live · display code ${CODE}`;
  $("codeLbl").textContent=CODE;
}
// rotate the right column between the knockout bracket and the group fixtures
let VIEW=0;
function showView(v){
  VIEW=v;
  $("koPanel").style.display = v===0?"flex":"none";
  $("fxPanel").style.display = v===1?"flex":"none";
  $("koTitle").textContent   = v===0?"KNOCKOUT":"GROUP FIXTURES & RESULTS";
  $("rot0").className = v===0?"on":"";
  $("rot1").className = v===1?"on":"";
}
showView(0);
setInterval(()=>showView(VIEW?0:1), 12000);

load();
setInterval(load, 15000);
</script>
