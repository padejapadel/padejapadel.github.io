<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chas Berger — Live</title>
<style>
  :root{--bg:#0A1624;--panel:#132133;--line:#22344d;--brand:#3BC8F5;--green:#35D6A4;--gold:#F5B83D;--sec:#8AA4C0;--white:#fff;--win:#35D6A4;--loss:#F56040}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:radial-gradient(1200px 700px at 20% -10%,#12263f 0%,var(--bg) 60%);color:var(--white);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;overflow:hidden}
  .wrap{height:100vh;display:flex;flex-direction:column;padding:1.4vh 1.6vw}
  header{display:flex;align-items:center;gap:1.2vw;flex:0 0 auto;padding-bottom:1.2vh;border-bottom:1px solid var(--line);position:relative}
  header img.padeja{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:6.2vh;display:block}
  .cbchip{background:#fff;border-radius:1vh;padding:.55vh 1vw;display:flex;align-items:center;height:5.6vh;flex:0 0 auto}
  .cbchip img{height:100%;display:block}
  .ttl{flex:1;min-width:0}
  .ttl h1{font-size:2.5vh;letter-spacing:.5px;line-height:1.05}
  .ttl .sub{font-size:1.35vh;color:var(--sec);margin-top:.4vh;font-weight:600}
  .code{font-size:1.3vh;color:var(--sec);text-align:right;line-height:1.4}
  .code b{color:var(--gold);font-size:2.1vh;letter-spacing:2px;display:block}
  main{flex:1;display:grid;grid-template-columns:1.32fr 1fr;gap:1.2vw;min-height:0;padding-top:1.2vh}
  .groups{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1vh 1vw;min-height:0}
  .grp{background:var(--panel);border:1px solid var(--line);border-radius:1.1vh;padding:.9vh 1vw;display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .grp h2{font-size:1.5vh;color:var(--gold);letter-spacing:1px;margin-bottom:.5vh;flex:0 0 auto}
  table{width:100%;border-collapse:collapse;font-size:1.32vh}
  th{color:var(--sec);text-transform:uppercase;font-size:.98vh;text-align:center;padding:.35vh .3vh;font-weight:800}
  th.tm{text-align:left}
  td{padding:.42vh .3vh;text-align:center;border-top:1px solid #1b2942;white-space:nowrap}
  td.tm{text-align:left;font-weight:600;line-height:1.05;padding-top:.5vh;padding-bottom:.5vh}
  td.tm .p1{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  td.tm .p2{display:block;font-weight:500;color:var(--sec);font-size:1.02vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  td.pts{font-weight:900;color:var(--green)}
  td.qp,th.qp{text-align:center;width:5.2vh}
  td.qp{font-weight:800;color:var(--brand)}
  tr.q td.qp{color:var(--gold)}
  tr.q td{background:rgba(245,184,61,.12)}
  tr.q td.rk{color:var(--gold);font-weight:900}
  .rk{color:var(--sec);width:2.2vh}
  .ko{background:var(--panel);border:1px solid var(--line);border-radius:1.1vh;padding:1vh 1vw;display:flex;flex-direction:column;min-height:0}
  .ko h2{font-size:1.6vh;color:var(--brand);letter-spacing:1px;margin-bottom:1vh;flex:0 0 auto}
  .bracket{flex:1;display:grid;grid-template-columns:1fr 1fr .8fr;gap:.8vw;align-items:center;min-height:0}
  .col{display:flex;flex-direction:column;justify-content:space-around;height:100%;gap:1vh}
  .col .lbl{font-size:1vh;color:var(--sec);text-transform:uppercase;letter-spacing:1.5px;text-align:center;margin-bottom:.4vh;font-weight:800}
  .tie{background:#0e1a2b;border:1px solid var(--line);border-radius:1vh;overflow:hidden}
  .tie.final{border-color:var(--gold);box-shadow:0 0 0 1px rgba(245,184,61,.4)}
  .side{display:flex;align-items:center;gap:.6vw;padding:.7vh .8vw;font-size:1.3vh}
  .side+.side{border-top:1px solid var(--line)}
  .side .nm{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.15}
  .side .nm small{display:block;font-weight:500;color:var(--sec);font-size:1.02vh}
  .side .sc{font-size:1.7vh;font-weight:900;min-width:2.4vh;text-align:center}
  .side.w{background:rgba(53,214,164,.14)}
  .side.w .nm{color:var(--green)}
  .side.w .sc{color:var(--green)}
  .side.pending .nm{color:var(--sec);font-weight:600;font-style:italic}
  .champ{margin-top:1vh;text-align:center;flex:0 0 auto}
  .champ .lbl{font-size:1vh;color:var(--sec);letter-spacing:2px;text-transform:uppercase}
  .champ .name{font-size:2.1vh;font-weight:900;color:var(--gold);margin-top:.3vh;min-height:2.1vh}
  footer{flex:0 0 auto;overflow:hidden;white-space:nowrap;border-top:1px solid var(--line);margin-top:.6vh;padding:0}
  .tickmove{display:inline-block;white-space:nowrap;padding:.9vh 0;animation:tickscroll linear infinite;will-change:transform}
  @keyframes tickscroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .tk{font-size:1.6vh;color:var(--white);font-weight:600}
  .tk .tl{color:var(--gold);text-transform:uppercase;letter-spacing:.6px;font-size:1.25vh;font-weight:800;margin-right:.55vw}
  .tk .tv{color:var(--brand);font-weight:800}
  .sepd{color:var(--sec);margin:0 1.6vw;opacity:.55}
  .dot{display:inline-block;width:.8vh;height:.8vh;border-radius:50%;background:var(--green);margin-right:.5vh;animation:p 2s infinite}
  @keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
  /* rotating right-panel (knockout <-> group fixtures) */
  .panel{flex:1;display:flex;flex-direction:column;min-height:0}
  .kohead{display:flex;align-items:center;gap:.8vw;margin-bottom:1vh;flex:0 0 auto}
  .kohead h2{margin:0}
  .rot{margin-left:auto;display:flex;gap:.5vh}
  .rot span{width:.9vh;height:.9vh;border-radius:50%;background:var(--line);transition:background .3s}
  .rot span.on{background:var(--brand)}
  .fx{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .sub2{font-size:1.2vh;color:var(--sec);font-weight:700;letter-spacing:.3px;margin-left:.6vw}
  .fxone{width:100%;border-collapse:collapse;font-size:1.62vh;table-layout:fixed}
  .fxone th{color:var(--sec);text-transform:uppercase;font-size:1.05vh;font-weight:800;letter-spacing:.6px;text-align:left;padding:.5vh .5vw;border-bottom:1px solid var(--line)}
  .fxone th.cc,.fxone th.sc{text-align:center}
  .fxone th.p2{text-align:right}
  .fxone td{padding:.66vh .35vw;border-top:1px solid #17263c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fxone td.ft{color:var(--sec);width:9%;font-variant-numeric:tabular-nums;font-weight:700}
  .fxone td.cc{color:var(--brand);width:6%;text-align:center;font-weight:800}
  .fxone td.fp{font-weight:700}
  .fxone td.fp.l{width:36%}
  .fxone td.fp.r{width:36%;text-align:right}
  .fxone td.fp .cd{color:var(--gold);font-weight:800;font-size:1.25vh;font-variant-numeric:tabular-nums;margin-right:.5vw}
  .fxone td.fp small{color:var(--sec);font-weight:500}
  .fxone td.sc{width:13%;text-align:center;font-weight:900;color:#5a7093;font-variant-numeric:tabular-nums}
  .fxone tr.done td.sc{color:#fff}
  .fxone td.fp.win{color:var(--win)}
  .fxone td.fp.win small{color:rgba(53,214,164,.75)}
  .fxone tr.done td{background:rgba(255,255,255,.02)}
</style>
</head>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://odrckirnjavfptlfygbo.supabase.co";
const SUPABASE_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9kcmNraXJuamF2ZnB0bGZ5Z2JvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1MzY3MzQsImV4cCI6MjA5NTExMjczNH0.rjoAQhEaTw6Sp-nGrQmYYvLdVKD7ewrKwG1PmMbyYgo";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON);
const CODE=(new URLSearchParams(location.search).get("code")||"CHASBG").toUpperCase();
const $=id=>document.getElementById(id);
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// --- Fixed timetable from the printed Order of Play (time + court per match) ---
// team_name (player 1) -> pair code, so a live match can find its court & time.
const CODE_P1={
 "Frankie S":"A1","Megan Paul":"A2","Steve Baldwin":"A3","Harrison Andrews":"A4","Ben Trueman":"A5","Jim Rex":"A6",
 "Luke Culling":"B1","Stanley Richardson":"B2","Danny Brotherton":"B3","Craig O'Donavan":"B4","Olly Brotherton":"B5","Sam Defries":"B6",
 "Ash Rex":"C1","Adam Williams":"C2","Simon Lie":"C3","Ross Brotherton":"C4","Josh Grantham":"C5","Sam Laskowski":"C6",
 "Zach Holden":"D1","Ryan Brotherton":"D2","Andy Godden":"D3","Adam Anderson":"D4","Greg Williams":"D5","Brad Smith":"D6"
};
// [time, court, codeA, codeB] — order-independent (keyed by sorted codes).
const OOP=[
 ["11:30",1,"A3","A4"],["11:30",3,"A2","A5"],["11:30",4,"A1","A6"],["12:10",1,"A1","A5"],["12:10",3,"A6","A4"],["12:10",6,"A2","A3"],
 ["12:50",1,"A6","A2"],["12:50",4,"A5","A3"],["12:50",5,"A1","A4"],["1:30",3,"A1","A3"],["1:30",4,"A4","A2"],["1:30",5,"A5","A6"],
 ["2:10",1,"A3","A6"],["2:10",2,"A1","A2"],["2:10",6,"A4","A5"],
 ["11:30",2,"B3","B4"],["11:30",5,"B1","B6"],["11:30",6,"B2","B5"],["12:30",1,"B1","B5"],["12:30",4,"B6","B4"],["12:30",5,"B2","B3"],
 ["1:10",1,"B1","B4"],["1:10",2,"B6","B2"],["1:10",4,"B5","B3"],["1:30",1,"B4","B2"],["1:30",2,"B5","B6"],["1:30",6,"B1","B3"],
 ["2:30",2,"B1","B2"],["2:30",3,"B4","B5"],["2:30",6,"B3","B6"],
 ["11:50",1,"C2","C5"],["11:50",3,"C3","C4"],["11:50",6,"C1","C6"],["12:10",2,"C6","C4"],["12:10",4,"C2","C3"],["12:10",5,"C1","C5"],
 ["1:10",3,"C6","C2"],["1:10",5,"C1","C4"],["1:10",6,"C5","C3"],["1:50",2,"C1","C3"],["1:50",3,"C5","C6"],["1:50",6,"C4","C2"],
 ["2:10",3,"C1","C2"],["2:10",4,"C4","C5"],["2:10",5,"C3","C6"],
 ["11:50",2,"D3","D4"],["11:50",4,"D1","D6"],["11:50",5,"D2","D5"],["12:30",2,"D1","D5"],["12:30",3,"D2","D3"],["12:30",6,"D6","D4"],
 ["12:50",2,"D6","D2"],["12:50",3,"D1","D4"],["12:50",6,"D5","D3"],["1:50",1,"D5","D6"],["1:50",4,"D4","D2"],["1:50",5,"D1","D3"],
 ["2:30",1,"D1","D2"],["2:30",4,"D3","D6"],["2:30",5,"D4","D5"]
];
const SCHED={}; OOP.forEach(([t,c,x,y])=>{ SCHED[[x,y].sort().join("-")]={t,c}; });
function tmin(t){ if(!t) return 99999; const p=String(t).split(":"); let h=+p[0]; const m=+p[1]||0; if(h<=2) h+=12; return h*60+m; }
let FXH={}, FXM={};   // per-group fixtures HTML + played counts (built each load)
const GVIEW=["A","B","C","D"];  // rotation slides 1..4 map to these groups

function pairName(t){ if(!t) return ""; return t.player2_name? `${t.team_name} & ${t.player2_name}` : t.team_name; }
function rankTeams(list){
  return list.slice().sort((a,b)=>
    (b.league_points||0)-(a.league_points||0) ||
    (num(b.diff)-num(a.diff)) ||
    (num(b.points_for)-num(a.points_for)) ||
    String(a.team_name||"").localeCompare(String(b.team_name||"")));
}
function num(x){ x=Number(x); return isNaN(x)?0:x; }
// Live chance each pair finishes top-2 (qualifies): Monte-Carlo the remaining
// group games, weighting each pair's win chance by its games-for-per-match form.
function qualProbs(teamsG, matchesG){
  const ids=(teamsG||[]).map(t=>t.id); if(ids.length<2) return {};
  const base={}; teamsG.forEach(t=>base[t.id]={pts:num(t.league_points),dif:num(t.diff),gf:num(t.points_for),name:t.team_name||""});
  let totGF=0,totP=0; teamsG.forEach(t=>{totGF+=num(t.points_for);totP+=num(t.played);});
  const avg=totP>0?totGF/totP:6, K=3, str={};
  teamsG.forEach(t=>{ str[t.id]=(num(t.points_for)+K*avg)/(num(t.played)+K); });
  const pending=(matchesG||[]).filter(m=>m.home_team_id&&m.away_team_id&&!(m.status==='completed'||m.status==='finished'));
  const N=pending.length?3000:1;
  const q={}; ids.forEach(id=>q[id]=0);
  for(let s=0;s<N;s++){
    const pts={},dif={}; ids.forEach(id=>{pts[id]=base[id].pts;dif[id]=base[id].dif;});
    for(const m of pending){ const h=m.home_team_id,a=m.away_team_id; const sh=str[h]||avg,sa=str[a]||avg; const ph=sh/(sh+sa);
      const r=Math.random(), pd=0.10;
      if(r<pd){ pts[h]+=1; pts[a]+=1; }
      else { const hw=(r-pd)/(1-pd)<ph; const mg=1+Math.floor(Math.random()*5);
        if(hw){ pts[h]+=2; dif[h]+=mg; dif[a]-=mg; } else { pts[a]+=2; dif[a]+=mg; dif[h]-=mg; } } }
    const order=ids.slice().sort((x,y)=>(pts[y]-pts[x])||(dif[y]-dif[x])||(base[y].gf-base[x].gf)||String(base[x].name).localeCompare(String(base[y].name)));
    q[order[0]]++; if(order[1]) q[order[1]]++;
  }
  const out={}; ids.forEach(id=>out[id]=N?q[id]/N:0); return out;
}

// ---- bottom stats ticker -------------------------------------------------
function tkLabel(id, ctx){
  const nm=ctx.nameById[id]; const t=ctx.byId[id]||{};
  const n1=(nm?nm.n1:t.team_name)||""; const n2=(nm?nm.n2:t.player2_name)||"";
  return n1+(n2?" & "+n2:"");
}
function buildTickerFacts(ctx){
  const {teams,matches,groupsT,qAll,codeOf,played}=ctx;
  const facts=[];
  const fact=(label,val)=>`<span class="tk"><b class="tl">${label}</b>${val}</span>`;
  const done=matches.filter(m=>(m.status==='completed'||m.status==='finished')&&m.home_score!=null&&m.away_score!=null);

  facts.push(fact("Live", `<span class="tv">${played}</span> of 60 group matches played`));

  if(!done.length){
    facts.push(fact("Coming up", "first matches at 11:30 — follow the standings live"));
    return facts;
  }

  // strongest pair overall
  const strong=teams.slice().filter(t=>num(t.played)>0).sort((a,b)=>
    (num(b.league_points)-num(a.league_points))||(num(b.diff)-num(a.diff))||(num(b.points_for)-num(a.points_for)))[0];
  if(strong) facts.push(fact("Strongest pair", `${esc(tkLabel(strong.id,ctx))} — <span class="tv">${num(strong.won)}W</span>, ${(num(strong.diff)>0?'+':'')+num(strong.diff)} games`));

  // longest current win streak (order a pair's matches by scheduled time)
  let bestStreak=0, streakId=null;
  teams.forEach(t=>{
    const ms=done.filter(m=>m.home_team_id===t.id||m.away_team_id===t.id).map(m=>{
      const key=[codeOf(m.home_team_id),codeOf(m.away_team_id)].sort().join("-"); const s=SCHED[key]||{};
      const hs=num(m.home_score),as=num(m.away_score);
      return {k:s.t?tmin(s.t):99999, won:(m.home_team_id===t.id)?(hs>as):(as>hs)};
    }).sort((a,b)=>a.k-b.k);
    let st=0; for(let i=ms.length-1;i>=0;i--){ if(ms[i].won) st++; else break; }
    if(st>bestStreak){ bestStreak=st; streakId=t.id; }
  });
  if(bestStreak>=2) facts.push(fact("On a roll", `${esc(tkLabel(streakId,ctx))} — <span class="tv">${bestStreak} wins in a row</span>`));

  // most likely to reach the knockout (highest live Q%)
  let topQ=-1, topQId=null;
  Object.keys(qAll).forEach(id=>{ if(qAll[id]>topQ){ topQ=qAll[id]; topQId=id; } });
  if(topQId!=null){ const pct=topQ>=0.995?"✓ through":Math.round(topQ*100)+"%";
    facts.push(fact("Most likely to qualify", `${esc(tkLabel(topQId,ctx))} — <span class="tv">${pct}</span>`)); }

  // biggest win (largest margin)
  let bw=null,bwm=-1;
  done.forEach(m=>{ const mg=Math.abs(num(m.home_score)-num(m.away_score)); if(mg>bwm){ bwm=mg; bw=m; } });
  if(bw&&bwm>0){ const hs=num(bw.home_score),as=num(bw.away_score);
    const w=hs>as?bw.home_team_id:bw.away_team_id, l=hs>as?bw.away_team_id:bw.home_team_id;
    facts.push(fact("Biggest win", `${esc(tkLabel(w,ctx))} beat ${esc(tkLabel(l,ctx))} <span class="tv">${Math.max(hs,as)}–${Math.min(hs,as)}</span>`)); }

  // most games won
  const mgw=teams.slice().filter(t=>num(t.played)>0).sort((a,b)=>num(b.points_for)-num(a.points_for))[0];
  if(mgw) facts.push(fact("Most games won", `${esc(tkLabel(mgw.id,ctx))} — <span class="tv">${num(mgw.points_for)}</span>`));

  // unbeaten pairs
  const unb=teams.filter(t=>num(t.played)>0&&num(t.lost)===0);
  if(unb.length) facts.push(fact("Still unbeaten", unb.length<=3 ? unb.map(t=>esc(tkLabel(t.id,ctx))).join(" · ") : `<span class="tv">${unb.length}</span> pairs`));

  // group leaders
  for(const g of ["A","B","C","D"]){ const r=rankTeams(groupsT[g]||[]); if(r[0]&&num(r[0].played)>0) facts.push(fact("Group "+g, esc(tkLabel(r[0].id,ctx))+" lead")); }

  return facts;
}
function renderTicker(facts){
  const el=$("tick"); if(!el) return;
  const sep=`<span class="sepd">◆</span>`;
  const one=facts.join(sep);
  if(el.getAttribute("data-sig")===one) return;   // unchanged → let it keep scrolling (no jump)
  el.setAttribute("data-sig",one);
  el.innerHTML=one+sep+one;                        // duplicated for a seamless −50% loop
  const chars=one.replace(/<[^>]*>/g,"").length;
  el.style.animationDuration=Math.max(30, Math.round(chars*0.22))+"s";
}

async function load(){
  const {data,error}=await sb.rpc("get_host_display",{p_code:CODE});
  if(error||!data){ $("tick").innerHTML='<span class="tk">Waiting for data… ('+esc(CODE)+')</span>'; return; }
  const teams=data.teams||[], leagues=data.leagues||[], matches=data.matches||[];
  let pairs=[]; try{ const pr=await sb.rpc("get_event_pairs",{p_code:CODE}); pairs=(pr&&pr.data)||[]; }catch(e){ pairs=[]; }
  const nameById={}; pairs.forEach(pr=>nameById[pr.team_id]={n1:pr.team_name,n2:pr.player2_name});
  const pairCell=t=>{ const nm=nameById[t.id]; const n1=(nm?nm.n1:t.team_name)||""; const n2=(nm?nm.n2:t.player2_name)||"";
    return `<span class="p1">${esc(n1)}</span>`+(n2?`<span class="p2">${esc(n2)}</span>`:""); };
  const byId={}; teams.forEach(t=>byId[t.id]=t);
  const letterOf={}; leagues.forEach(l=>letterOf[l.id]=l.league_letter);
  const groupsT={A:[],B:[],C:[],D:[]}; let koLeagueId=null;
  leagues.forEach(l=>{ if(l.league_letter==='K'||String(l.name||'').toLowerCase()==='knockout') koLeagueId=l.id; });
  teams.forEach(t=>{ const L=letterOf[t.league_id]; if(groupsT[L]) groupsT[L].push(t); });

  const gLeagueId={}; leagues.forEach(l=>{ if(['A','B','C','D'].includes(l.league_letter)) gLeagueId[l.league_letter]=l.id; });

  // group tables (with a live "chance of reaching the knockout" projection)
  const qAll={};
  let gh="";
  for(const g of ["A","B","C","D"]){
    const ranked=rankTeams(groupsT[g]||[]);
    const q=qualProbs(ranked, matches.filter(m=>m.league_id===gLeagueId[g]));
    Object.assign(qAll,q);
    let rows="";
    ranked.forEach((t,i)=>{
      const qp=q[t.id]; const qtxt=(qp==null)?"":(qp>=0.995?"✓":(qp<=0.005?"—":Math.round(qp*100)+"%"));
      rows+=`<tr class="${i<2?'q':''}"><td class="rk">${i+1}</td><td class="tm">${pairCell(t)}</td>`
        +`<td>${num(t.played)}</td><td>${num(t.won)}</td><td>${(num(t.diff)>0?'+':'')+num(t.diff)}</td>`
        +`<td class="pts">${num(t.league_points)}</td><td class="qp">${qtxt}</td></tr>`;
    });
    if(!ranked.length) rows=`<tr><td colspan="7" style="color:var(--sec);padding:1vh">No pairs</td></tr>`;
    gh+=`<div class="grp"><h2>GROUP ${g}</h2><table>
      <thead><tr><th class="rk"></th><th class="tm">Pair</th><th>P</th><th>W</th><th>+/−</th><th>Pts</th><th class="qp">Q%</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  }
  $("groups").innerHTML=gh;

  // qualifiers
  const Q={};
  for(const g of ["A","B","C","D"]){ const r=rankTeams(groupsT[g]||[]); Q[g+"1"]=r[0]||null; Q[g+"2"]=r[1]||null; }

  // knockout (own table, via get_knockout by code)
  let ko=[]; try{ const kr=await sb.rpc("get_knockout",{p_code:CODE}); ko=(kr&&kr.data)||[]; }catch(e){ ko=[]; }
  const byOrd={}; ko.forEach(m=>byOrd[m.ord]=m);
  const isDone=m=>m&&m.status==='completed'&&m.home_score!=null&&m.away_score!=null;
  const koWin=m=>{ if(!isDone(m))return null; return num(m.home_score)>num(m.away_score)?m.home_name:(num(m.away_score)>num(m.home_score)?m.away_name:null); };
  const qName=k=>{ const t=Q[k]; if(!t) return null; const nm=nameById[t.id]; return nm?(nm.n1+(nm.n2?" & "+nm.n2:"")):pairName(t); };
  const seedPh=k=>"Group "+k[0]+" "+(k[1]==="1"?"winner":"runner-up");

  // slot: prefer the seeded knockout row; else show predicted names (provisional)
  const slot=(ord, predH, predA)=>{
    const m=byOrd[ord];
    if(m){ const w=koWin(m);
      return {hN:m.home_name, aN:m.away_name, hS:(m.home_score!=null?num(m.home_score):null), aS:(m.away_score!=null?num(m.away_score):null),
              hW:!!w&&w===m.home_name, aW:!!w&&w===m.away_name, live:true};
    }
    return {hN:predH, aN:predA, hS:null, aS:null, hW:false, aW:false, live:false};
  };
  const qfPred=[["A1","D2"],["B1","C2"],["C1","B2"],["D1","A2"]];
  const qfSlots=qfPred.map(([h,a],i)=>slot(i+1, qName(h)||seedPh(h), qName(a)||seedPh(a)));
  const qfWinN=[1,2,3,4].map(o=>koWin(byOrd[o]));
  const sfSlots=[[0,1],[2,3]].map(([i,j],s)=>slot(5+s, qfWinN[i]||("Winner QF"+(i+1)), qfWinN[j]||("Winner QF"+(j+1))));
  const sfWinN=[5,6].map(o=>koWin(byOrd[o]));
  const finalSlot=slot(7, sfWinN[0]||"Winner SF1", sfWinN[1]||"Winner SF2");
  const champN=koWin(byOrd[7]);

  const sideS=(name,score,win,prov)=>`<div class="side ${prov?'pending':''} ${win?'w':''}"><span class="nm">${esc(name||'TBC')}</span><span class="sc">${score!=null?score:''}</span></div>`;
  const tieS=(o,cls)=>`<div class="tie ${cls||''}">${sideS(o.hN,o.hS,o.hW,!o.live)}${sideS(o.aN,o.aS,o.aW,!o.live)}</div>`;
  const qfCol=`<div class="col"><div class="lbl">Quarter-finals · 2:50</div>`+qfSlots.map(o=>tieS(o,"")).join("")+`</div>`;
  const sfCol=`<div class="col"><div class="lbl">Semi-finals · 3:10</div>`+sfSlots.map(o=>tieS(o,"")).join("")+`</div>`;
  const fCol=`<div class="col"><div class="lbl">Final · 3:30</div>${tieS(finalSlot,"final")}</div>`;
  $("bracket").innerHTML=qfCol+sfCol+fCol;
  $("champ").textContent=champN||"—";

  // group fixtures & results — one group per rotating slide (full column) ------
  const codeOf=id=>{ const nm=nameById[id]; const t=byId[id]||{}; return CODE_P1[(nm?nm.n1:t.team_name)||""]||null; };
  const fpFull=(id,right,win)=>{ const nm=nameById[id]||{}; const t=byId[id]||{}; const n1=(nm.n1||t.team_name||"");
    const n2=(nm.n2||t.player2_name||""); const code=CODE_P1[n1]||""; const cd=code?`<b class="cd">${code}</b>`:"";
    const names=`${esc(n1)}${n2?` <small>&amp; ${esc(n2)}</small>`:""}`;
    return `<td class="fp ${right?'r':'l'}${win?' win':''}" title="${esc(n1+(n2?' & '+n2:''))}">${cd} ${names}</td>`; };
  FXH={}; FXM={};
  for(const g of ["A","B","C","D"]){
    const gid=gLeagueId[g];
    let ms=(matches||[]).filter(m=>m.league_id===gid && m.home_team_id && m.away_team_id).map(m=>{
      const key=[codeOf(m.home_team_id),codeOf(m.away_team_id)].sort().join("-"); const s=SCHED[key]||{};
      return {m, t:s.t||"", c:s.c||0, k:s.t?tmin(s.t):99999};
    });
    ms.sort((a,b)=> a.k-b.k || a.c-b.c);
    const done=ms.filter(x=>x.m.status==='completed'||x.m.status==='finished').length;
    let rows="";
    ms.forEach(({m,t,c})=>{
      const fin=(m.status==='completed'||m.status==='finished')&&m.home_score!=null&&m.away_score!=null;
      const hs=num(m.home_score), as=num(m.away_score); const hw=fin&&hs>as, aw=fin&&as>hs;
      rows+=`<tr class="${fin?'done':''}">`
        +`<td class="ft">${esc(t||'—')}</td><td class="cc">${c||'·'}</td>`
        +fpFull(m.home_team_id,false,hw)
        +`<td class="sc">${fin?`${hs}–${as}`:'v'}</td>`
        +fpFull(m.away_team_id,true,aw)
        +`</tr>`;
    });
    if(!ms.length) rows=`<tr><td colspan="5" style="color:var(--sec);padding:1.5vh">No fixtures yet</td></tr>`;
    FXH[g]=`<table class="fxone"><colgroup><col style="width:10%"><col style="width:5%"><col style="width:36%"><col style="width:8%"><col style="width:41%"></colgroup><thead><tr><th>Time</th><th class="cc">Ct</th><th>Pair 1</th><th class="sc">Score</th><th class="p2">Pair 2</th></tr></thead><tbody>${rows}</tbody></table>`;
    FXM[g]={done, total:ms.length};
  }
  if(VIEW>=1) showView(VIEW);  // refresh the group currently on screen with live scores

  const played=matches.filter(m=>m.status==='completed'||m.status==='finished').length;
  renderTicker(buildTickerFacts({teams,matches,nameById,byId,groupsT,gLeagueId,qAll,codeOf,played}));
  $("codeLbl").textContent=CODE;
}
// rotate the right column: knockout (0), then each group's fixtures (1-4)
let VIEW=0, rotT=null;
const DWELL=[14000,11000,11000,11000,11000];   // ms per slide (knockout dwells a touch longer)
function showView(v){
  VIEW=v;
  const isKo = v===0;
  $("koPanel").style.display = isKo?"flex":"none";
  $("fxPanel").style.display = isKo?"none":"flex";
  if(isKo){ $("koTitle").textContent="KNOCKOUT"; }
  else {
    const g=GVIEW[v-1], m=FXM[g]||{done:0,total:0};
    $("koTitle").innerHTML=`GROUP ${g} · FIXTURES <span class="sub2">${m.done}/${m.total} played</span>`;
    $("fx").innerHTML = FXH[g] || `<div style="color:var(--sec);padding:2vh">Loading…</div>`;
  }
  for(let i=0;i<5;i++){ const el=$("rot"+i); if(el) el.className=(i===v?"on":""); }
}
function rotStep(){ showView((VIEW+1)%5); rotT=setTimeout(rotStep, DWELL[VIEW]); }
showView(0);
rotT=setTimeout(rotStep, DWELL[0]);

load();
setInterval(load, 15000);
</script>
