<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrustPadel · Live Board</title>
<style>
  :root{
    --bg:#07131f; --bg2:#0c1e30; --panel:#0f2438; --panel2:#12293f;
    --line:#1d3b56; --ink:#eaf4ff; --mut:#9fc0dc; --mut2:#6f93b3;
    --gold:#ffcf4d; --teal:#37e0c0; --green:#39d98a; --amber:#ffb03a; --red:#ff6b6b;
    --shadow:0 4px 22px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(1200px 700px at 78% -8%, #12324e 0%, var(--bg) 60%) fixed, var(--bg);
    color:var(--ink); font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;
  }
  .wrap{height:100vh; display:flex; flex-direction:column; padding:1.4vh 1.4vw; gap:1.2vh}
  /* ---- header ---- */
  header{display:flex; align-items:center; gap:1.2vw; flex:0 0 auto}
  .brand{display:flex; align-items:center; gap:.7vw}
  .dot{width:1.5vh;height:1.5vh;border-radius:50%;background:var(--teal);box-shadow:0 0 14px var(--teal);animation:pulse 2.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  h1{font-size:3.1vh; margin:0; letter-spacing:.3px; font-weight:800}
  h1 .sub{color:var(--gold)}
  .meta{margin-left:auto; text-align:right; line-height:1.15}
  .phase{font-size:2.5vh; font-weight:800; color:var(--gold)}
  .venue{font-size:1.7vh; color:var(--mut)}
  .refresh{font-size:1.35vh; color:var(--mut2); margin-top:.2vh}
  /* ---- main grid ---- */
  main{flex:1 1 auto; display:grid; grid-template-columns:1.05fr .95fr; gap:1.2vw; min-height:0}
  .col{display:flex; flex-direction:column; gap:1.1vh; min-height:0}
  .card{background:linear-gradient(180deg,var(--panel) 0%,var(--panel2) 100%); border:1px solid var(--line);
        border-radius:14px; box-shadow:var(--shadow); padding:1.1vh 1vw; min-height:0; display:flex; flex-direction:column}
  .card h2{margin:0 0 .8vh; font-size:2vh; font-weight:800; letter-spacing:.4px; display:flex; align-items:center; gap:.5vw}
  .card h2 .tag{margin-left:auto; font-size:1.3vh; font-weight:700; color:var(--mut2); text-transform:uppercase; letter-spacing:1px}
  .grow{flex:1 1 auto; min-height:0; overflow:hidden}
  /* ---- leaderboard ---- */
  .lb{flex:1 1 auto; display:grid; grid-template-columns:1fr 1fr; gap:.2vw 1vw; align-content:start; min-height:0}
  table.board{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums}
  table.board th{font-size:1.15vh; color:var(--mut2); text-transform:uppercase; letter-spacing:.6px; text-align:left; padding:.2vh .3vw; font-weight:700}
  table.board th.n,table.board td.n{text-align:right}
  table.board td{padding:.28vh .3vw; font-size:1.62vh; border-bottom:1px solid rgba(29,59,86,.5)}
  .rk{width:2.2vw; color:var(--mut); font-weight:800; text-align:right}
  .nm{font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:10.5vw}
  tr.q .nm{color:#fff}
  tr.q .rk{color:var(--gold)}
  tr.cut td{border-bottom:.4vh solid var(--gold) !important}
  .rat{display:inline-block; min-width:2.6vw; text-align:center; font-size:1.25vh; font-weight:800; padding:.15vh .35vw; border-radius:6px;
       background:rgba(55,224,192,.13); color:var(--teal); border:1px solid rgba(55,224,192,.3)}
  .won{font-weight:800; color:var(--ink)}
  .net{color:var(--mut); font-size:1.4vh}
  /* probability bar in leaderboard */
  .pcell{width:5.6vw}
  .pbar{position:relative; height:1.7vh; background:rgba(255,255,255,.06); border-radius:5px; overflow:hidden}
  .pbar > i{position:absolute; left:0; top:0; bottom:0; border-radius:5px}
  .pbar > b{position:absolute; right:.35vw; top:50%; transform:translateY(-50%); font-style:normal; font-size:1.2vh; font-weight:800; color:#04121d}
  .locked{font-size:1.1vh; color:var(--gold); border:1px solid rgba(255,207,77,.4); border-radius:5px; padding:0 .3vw; margin-left:.3vw}
  /* ---- courts ---- */
  .courts{display:grid; grid-template-columns:1fr 1fr; gap:.7vh .8vw; flex:1 1 auto; align-content:start; overflow:hidden}
  .court{background:var(--bg2); border:1px solid var(--line); border-radius:11px; padding:.7vh .7vw}
  .court .ct{font-size:1.2vh; color:var(--gold); font-weight:800; text-transform:uppercase; letter-spacing:.8px; margin-bottom:.4vh}
  .court .side{display:flex; justify-content:space-between; align-items:center; font-size:1.62vh; font-weight:700; gap:.5vw}
  .court .side.win{color:var(--teal)}
  .court .sc{font-weight:900; font-size:2vh; min-width:2.2vw; text-align:right}
  .court .vs{font-size:1.2vh; color:var(--mut2); text-align:center; margin:.15vh 0}
  .court.done{border-color:rgba(55,224,192,.35)}
  .court .pend{font-size:1.2vh; color:var(--mut2)}
  /* ---- next up (pre-drawn round) ---- */
  #nextCard h2{margin:0 0 .6vh}
  .nextgrid{display:flex; flex-direction:column; gap:.4vh}
  .nextrow{display:flex; align-items:center; gap:.7vw; background:var(--bg2); border:1px solid var(--line);
           border-radius:8px; padding:.42vh .7vw; font-size:1.5vh}
  .nextrow .nc{color:var(--gold); font-weight:800; font-size:1.15vh; text-transform:uppercase; letter-spacing:.5px; min-width:4.4vw; flex:0 0 auto}
  .nextrow .np{font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1 1 0; min-width:0}
  .nextrow .np.r{text-align:right}
  .nextrow .nv{color:var(--mut2); font-size:1.15vh; flex:0 0 auto}
  /* ---- odds / bubble ---- */
  .odds{display:flex; flex-direction:column; gap:.42vh; flex:1 1 auto; overflow:hidden}
  .orow{display:grid; grid-template-columns:2.2vw 9.5vw 1fr 1fr; gap:.6vw; align-items:center}
  .orow .onm{font-weight:700; font-size:1.55vh; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .orow .orank{color:var(--mut); font-weight:800; text-align:right; font-size:1.4vh}
  .oheadrow{grid-template-columns:2.2vw 9.5vw 1fr 1fr; display:grid; gap:.6vw; font-size:1.15vh; color:var(--mut2); text-transform:uppercase; letter-spacing:.6px; font-weight:700}
  .mini{position:relative; height:1.9vh; background:rgba(255,255,255,.06); border-radius:5px; overflow:hidden}
  .mini > i{position:absolute; left:0; top:0; bottom:0; border-radius:5px}
  .mini > b{position:absolute; right:.4vw; top:50%; transform:translateY(-50%); font-style:normal; font-size:1.25vh; font-weight:800; color:#04121d}
  /* ---- bracket ---- */
  .bracket{display:flex; flex-direction:column; gap:1vh; flex:1 1 auto; overflow:auto}
  .bstage{margin-bottom:.4vh}
  .bstage .st{font-size:1.4vh; color:var(--gold); font-weight:800; text-transform:uppercase; letter-spacing:1px; margin-bottom:.5vh}
  .bmatch{background:var(--bg2); border:1px solid var(--line); border-radius:10px; padding:.55vh .7vw; margin-bottom:.5vh; display:flex; align-items:center; gap:.6vw}
  .bmatch .bp{flex:1; font-size:1.6vh; font-weight:700}
  .bmatch .bp.r{text-align:right}
  .bmatch .bp.w{color:var(--gold); font-weight:900}
  .bmatch .bsc{font-weight:900; font-size:1.7vh; color:var(--ink)}
  .bmatch .bv{color:var(--mut2); font-size:1.3vh}
  .champ{background:linear-gradient(180deg,rgba(255,207,77,.16),rgba(255,207,77,.05)); border:1px solid var(--gold); border-radius:12px; padding:1.2vh; text-align:center; margin-top:auto}
  .champ .t{font-size:1.5vh; color:var(--gold); text-transform:uppercase; letter-spacing:1.5px; font-weight:800}
  .champ .n{font-size:3vh; font-weight:900; margin-top:.4vh}
  .empty{color:var(--mut2); font-size:1.7vh; padding:1vh .3vw}
  .legend{display:flex; gap:1vw; font-size:1.2vh; color:var(--mut); align-items:center; flex-wrap:wrap}
  .legend span{display:inline-flex; align-items:center; gap:.35vw}
  .swatch{width:1.1vh;height:1.1vh;border-radius:3px;display:inline-block}
  #err{position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); background:#12293f; border:1px solid var(--red); color:var(--ink);
       padding:2vh 3vw; border-radius:12px; font-size:2vh; max-width:70vw; text-align:center; display:none}
  #err b{color:var(--red)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <span class="dot"></span>
      <h1>Trust<span class="sub">Padel</span> <span style="color:var(--mut);font-weight:600;font-size:2.2vh">· Challenging MND</span></h1>
    </div>
    <div class="meta">
      <div class="phase" id="phaseLbl">—</div>
      <div class="venue">Brentwood Padel Club</div>
      <div class="refresh" id="refreshLbl">connecting…</div>
    </div>
  </header>

  <main>
    <!-- LEFT column -->
    <div class="col">
      <div class="card grow" style="flex:1 1 auto">
        <h2 id="lbTitle">Leaderboard <span class="tag" id="lbTag">games won</span></h2>
        <div class="lb" id="lbBody"></div>
        <div class="legend" style="margin-top:.6vh">
          <span><i class="swatch" style="background:var(--gold)"></i> top 16 qualify</span>
          <span><i class="swatch" style="background:var(--green)"></i> safe</span>
          <span><i class="swatch" style="background:var(--amber)"></i> on the bubble</span>
          <span><i class="swatch" style="background:#3a5a7a"></i> chasing</span>
          <span style="margin-left:auto" id="ratLegend"></span>
        </div>
      </div>
    </div>

    <!-- RIGHT column -->
    <div class="col">
      <div class="card" style="flex:1 1 46%">
        <h2 id="fxTitle">This round <span class="tag" id="fxTag"></span></h2>
        <div class="courts" id="fxBody"></div>
        <div class="bracket" id="brBody" style="display:none"></div>
      </div>
      <div class="card" id="nextCard" style="flex:0 0 auto;display:none">
        <h2 id="nextTitle">Next up <span class="tag" id="nextTag"></span></h2>
        <div class="nextgrid" id="nextBody"></div>
      </div>
      <div class="card" style="flex:1 1 54%">
        <h2 id="oddsTitle">Race for the knockout <span class="tag">top 8 · top 16</span></h2>
        <div class="oheadrow" id="oddsHead" style="display:none"><span></span><span></span><span style="text-align:center">TOP&nbsp;8</span><span style="text-align:center">TOP&nbsp;16</span></div>
        <div class="odds" id="oddsBody"></div>
      </div>
    </div>
  </main>
</div>
<div id="err"></div>

<script>
/* ---------------- config ---------------- */
const SUPABASE_URL  = "https://odrckirnjavfptlfygbo.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9kcmNraXJuamF2ZnB0bGZ5Z2JvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1MzY3MzQsImV4cCI6MjA5NTExMjczNH0.rjoAQhEaTw6Sp-nGrQmYYvLdVKD7ewrKwG1PmMbyYgo";
const SHARE_CODE    = "E866EA";
const REFRESH_MS    = 15000;
const MATCHES_EACH  = 6;      // every player plays 6 pool matches
const SIMS          = 3000;   // Monte-Carlo trials
const RATING_DIV    = 6.0;    // logistic divisor on team-rating gap (higher = ratings matter less / more luck)

/* player ratings (from the tournament sheet), keyed by exact name */
const RATINGS = {
  "Jason Gibson":3.5,"Peter Worthington":3.83,"Blake Gibson":3.7,"Left Xyppas":3.7,
  "Peter Watson":3.7,"Stuart Loader":3.9,"Paul Spillman":3.7,"Dave Bassett":3.76,
  "Malcolm Clarke":3.95,"Jonathan Brooker":3.9,"Jamie Dann":3.85,"Dan O'Connell":3.7,
  "Ben Williams":3.65,"Leo Hately":4.0,"Julian Dunbar":4.2,"Jerry Arnull":4.5,
  "Brad Porter":3.75,"Steve Cunnew":4.8,"Adam Dulwich":3.5,"Lee Rowswell":4.3,
  "Matthew Birkett":4.3,"Jennie Armstrong":3.6,"Charlotte Birkett":3.9,"Elliot Reed":3.5,
  "James O'halloran":4.5,"Mandy Baker":3.75,"Stephen Ackerman":4.2,"Kellie Want":3.8,
  "Tony Courtney":3.72,"Kimberly Millham":3.8,"Natalie Spencley":3.7,"Jon Spenceley":3.9,
  "Dave Embling":3.8,"George Palient":3.5,"Laura Foreman":3.8,"Neil Hamill":2.8,
  "Jon Arnold":4.0,"Antonios Xyppas":4.5,"Bradley Carlyon":4.0,"Deborah Goldman":2.75,
  "Julie Woodbridge":2.75,"Matthew Ellis":4.25,"Vikki Ellis":3.9,"Neil Reynolds":3.0,
  "Martin Tyrell":3.7,"Tom Haskins":3.75,"Luke Jewitt":3.75,"Christiana Bourne":3.75
};

/* ---------------- helpers ---------------- */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ratingOf(name){ return RATINGS[name] != null ? RATINGS[name] : 3.7; }
function pctColor(p){ return p>=85?'var(--green)': p>=40?'var(--amber)': p>=12?'#5b83a8':'#3a5a7a'; }

async function loadData(){
  const r = await fetch(SUPABASE_URL + "/rest/v1/rpc/get_host_display", {
    method:"POST",
    headers:{ "apikey":SUPABASE_ANON, "Authorization":"Bearer "+SUPABASE_ANON,
              "Content-Type":"application/json", "Accept":"application/json" },
    body: JSON.stringify({ p_code: SHARE_CODE })
  });
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}

/* ---------------- Monte-Carlo qualification odds ----------------
   Each player finishes on MATCHES_EACH pool matches. For every match still
   to play we draw a random partner + two random opponents from the field
   (that is the americano format), turn the team-rating gap into an expected
   share of the match's games via a logistic, and sample games won with
   binomial noise. Repeat SIMS times and count top-8 / top-16 finishes.       */
function computeOdds(players){
  const N = players.length;
  if(!N) return;
  const rat = players.map(p=>ratingOf(p.name));
  const played = players.map(p=>p.played||0);
  const base   = players.map(p=>p.games_won||0);
  const rem    = players.map(p=>Math.max(0, MATCHES_EACH - (p.played||0)));

  // games per match, calibrated from actual results so far (else a sensible 6)
  let sumGames=0, sumPlayed=0;
  players.forEach(p=>{ sumGames += (p.games_won||0)+(p.games_lost||0); sumPlayed += (p.played||0); });
  const G = sumPlayed>0 ? Math.max(3, Math.round(sumGames/sumPlayed)) : 6;

  const top8 = new Array(N).fill(0), top16 = new Array(N).fill(0);
  const total = new Float64Array(N);
  const anyRemaining = rem.some(x=>x>0);
  const trials = anyRemaining ? SIMS : 1;   // nothing left to play -> deterministic

  for(let s=0;s<trials;s++){
    for(let i=0;i<N;i++){
      let g = base[i];
      for(let m=0;m<rem[i];m++){
        const partner = rat[(Math.random()*N)|0];
        const o1 = rat[(Math.random()*N)|0], o2 = rat[(Math.random()*N)|0];
        const gap = (rat[i]+partner) - (o1+o2);
        const share = 1/(1+Math.pow(10, -gap/RATING_DIV));
        // binomial(G, share)
        let w=0; for(let k=0;k<G;k++){ if(Math.random()<share) w++; }
        g += w;
      }
      // tiny jitter breaks exact ties without bias
      total[i] = g + Math.random()*1e-3;
    }
    // rank this trial
    const order = Array.from({length:N},(_,i)=>i).sort((a,b)=>total[b]-total[a]);
    for(let pos=0;pos<N;pos++){
      const i = order[pos];
      if(pos<8) top8[i]++;
      if(pos<16) top16[i]++;
    }
  }
  players.forEach((p,i)=>{ p._t8 = Math.round(100*top8[i]/trials); p._t16 = Math.round(100*top16[i]/trials); p._rat = rat[i]; });
}

/* ---------------- rendering ---------------- */
function renderLeaderboard(players){
  const half = Math.ceil(players.length/2);
  const cols = [players.slice(0,half), players.slice(half)];
  const th = `<tr><th class="n">#</th><th>Player</th><th class="n">Rtg</th><th class="n">Won</th><th class="n">+/−</th><th>Top&nbsp;16</th></tr>`;
  const rowHtml = (p, gi) => {
    const cut = (gi===15) ? ' cut' : '';
    const q = p.qualified ? ' q' : '';
    const pc = pctColor(p._t16);
    return `<tr class="${q}${cut}">`
      + `<td class="rk">${p.rk||gi+1}</td>`
      + `<td class="nm" title="${esc(p.name)}">${esc(p.name)}${(p.name==='Blake Gibson'||p.name==='Left Xyppas')?'<span class="locked">L</span>':''}</td>`
      + `<td class="n"><span class="rat">${(p._rat||ratingOf(p.name)).toFixed(2)}</span></td>`
      + `<td class="n won">${p.games_won||0}</td>`
      + `<td class="n net">${(p.net||0)>0?'+':''}${p.net||0}</td>`
      + `<td class="pcell"><div class="pbar"><i style="width:${p._t16}%;background:${pc}"></i><b style="color:${p._t16>=90?'#04121d':'#cfe3f5'};${p._t16<20?'left:.35vw;right:auto':''}">${p._t16}%</b></div></td>`
      + `</tr>`;
  };
  const table = (list, offset) => `<table class="board"><thead>${th}</thead><tbody>`
      + list.map((p,i)=>rowHtml(p, offset+i)).join('') + `</tbody></table>`;
  $("lbBody").innerHTML = table(cols[0],0) + table(cols[1],half);
}

function renderCourts(matches, byId){
  if(!matches.length){ $("fxBody").innerHTML = `<div class="empty">Waiting for the round to start in the host console…</div>`; return; }
  const nm = id => esc((byId[id]||{}).name||'?');
  $("fxBody").innerHTML = matches.slice().sort((a,b)=>(a.court||0)-(b.court||0)).map(m=>{
    const done = m.status==='completed';
    const aw = done && (m.score_a>m.score_b), bw = done && (m.score_b>m.score_a);
    return `<div class="court ${done?'done':''}">`
      + `<div class="ct">Court ${m.court||'-'}</div>`
      + `<div class="side ${aw?'win':''}"><span>${nm(m.a1_id)} &amp; ${nm(m.a2_id)}</span><span class="sc">${done?m.score_a:''}</span></div>`
      + `<div class="vs">${done?'':'vs'}</div>`
      + `<div class="side ${bw?'win':''}"><span>${nm(m.b1_id)} &amp; ${nm(m.b2_id)}</span><span class="sc">${done?m.score_b:''}</span></div>`
      + `</div>`;
  }).join('');
}

function renderNextUp(tp, byId){
  const card = $("nextCard");
  const nm = tp.next_matches || [];
  if(!nm.length){ card.style.display = 'none'; return; }
  const nmName = id => esc((byId[id]||{}).name || '?');
  $("nextTitle").innerHTML = `Next up <span class="tag">Round ${tp.next_round||''} · your court &amp; partners</span>`;
  $("nextBody").innerHTML = nm.slice().sort((a,b)=>(a.court||0)-(b.court||0)).map(m=>
      `<div class="nextrow"><span class="nc">Court ${m.court||'-'}</span>`
    + `<span class="np">${nmName(m.a1_id)} &amp; ${nmName(m.a2_id)}</span>`
    + `<span class="nv">v</span>`
    + `<span class="np r">${nmName(m.b1_id)} &amp; ${nmName(m.b2_id)}</span></div>`).join('');
  card.style.display = 'flex';
}

function renderBubble(players){
  $("oddsHead").style.display = 'grid';
  // the drama: everyone still in genuine contention for a top-16 spot,
  // plus the players fighting for the top-8 half. Show ranks ~4..22.
  const lo = 3, hi = Math.min(players.length, 19);
  const bubble = players.slice(lo, hi);
  const bar = (v, kind) => {
    const c = kind==='8' ? (v>=60?'var(--gold)':v>=25?'var(--amber)':'#4d719a') : pctColor(v);
    return `<div class="mini"><i style="width:${v}%;background:${c}"></i><b style="color:${v>=90?'#04121d':'#cfe3f5'};${v<18?'left:.4vw;right:auto':''}">${v}%</b></div>`;
  };
  $("oddsBody").innerHTML = bubble.map(p=>
    `<div class="orow">`
    + `<span class="orank">${p.rk}</span>`
    + `<span class="onm">${esc(p.name)}</span>`
    + bar(p._t8,'8') + bar(p._t16,'16')
    + `</div>`).join('') || `<div class="empty">Standings settle once matches are played.</div>`;
}

function renderKnockout(tp, byId){
  // left card -> bracket, hide courts grid
  $("fxBody").style.display='none'; $("brBody").style.display='flex';
  $("nextCard").style.display='none';
  $("fxTitle").innerHTML = 'Knockout bracket <span class="tag">top 16 · fixed pairs</span>';
  const teams = tp.ko_teams||[], km = tp.ko_matches||[];
  const teamById={}; teams.forEach(t=>teamById[t.id]=t);
  const nm = id => esc((byId[id]||{}).name||'?');
  const tName = tid => { const t=teamById[tid]; return t? (nm(t.p1_id)+' &amp; '+nm(t.p2_id)) : 'TBD'; };
  const stage = (code,title) => {
    const rows = km.filter(m=>m.stage===code).sort((a,b)=>a.slot-b.slot);
    if(!rows.length) return '';
    let s = `<div class="bstage"><div class="st">${title}</div>`;
    rows.forEach(m=>{ const dn=m.status==='completed';
      const wa=m.winner_team_id&&m.winner_team_id===m.team_a_id, wb=m.winner_team_id&&m.winner_team_id===m.team_b_id;
      s += `<div class="bmatch"><span class="bp ${wa?'w':''}">${tName(m.team_a_id)}</span>`
        + (dn?`<span class="bsc">${m.score_a}–${m.score_b}</span>`:`<span class="bv">vs</span>`)
        + `<span class="bp r ${wb?'w':''}">${tName(m.team_b_id)}</span></div>`;
    });
    return s + `</div>`;
  };
  let h = stage('QF','Quarter-finals') + stage('SF','Semi-finals') + stage('F','Final');
  const fin = km.find(m=>m.stage==='F'&&m.status==='completed');
  if(fin&&fin.winner_team_id){
    h += `<div class="champ"><div class="t">🏆 Champions</div><div class="n">${tName(fin.winner_team_id)}</div></div>`;
  }
  $("brBody").innerHTML = h || `<div class="empty">Drawing the knockout…</div>`;

  // right cards: current KO matches on court + a simple "live matches" recap
  const live = km.filter(m=>m.status!=='completed');
  $("oddsTitle").innerHTML = 'On court now <span class="tag">courts 5 &amp; 6</span>';
  $("oddsHead").style.display='none';
  if(fin&&fin.winner_team_id){
    $("oddsBody").innerHTML = `<div class="empty">Tournament complete — congratulations to all 48 players.</div>`;
  } else {
    $("oddsBody").innerHTML = `<div class="courts">` + (live.length? live.sort((a,b)=>(a.court||0)-(b.court||0)).map(m=>
        `<div class="court"><div class="ct">${m.stage}${m.slot} · Court ${m.court||'-'}</div>`
        + `<div class="side"><span>${tName(m.team_a_id)}</span></div><div class="vs">vs</div>`
        + `<div class="side"><span>${tName(m.team_b_id)}</span></div></div>`).join('')
      : `<div class="empty">Waiting for the next stage…</div>`) + `</div>`;
  }
}

/* ---------------- main tick ---------------- */
async function tick(){
  try{
    const data = await loadData();
    $("err").style.display='none';
    const tp = data.trustpadel || {};
    const players = (tp.players||[]).slice();
    const byId = {}; players.forEach(p=>byId[p.id]=p);
    const phase = tp.phase || 'pool';
    const round = tp.round || 0;
    const tot   = tp.pool_rounds || MATCHES_EACH*2;
    const inKo  = phase === 'knockout';

    $("phaseLbl").textContent = inKo ? 'KNOCKOUT' : (round>0 ? `POOL · ROUND ${round}/${tot}` : 'POOL STAGE');
    $("refreshLbl").textContent = 'live · updates every '+(REFRESH_MS/1000)+'s · '+new Date().toLocaleTimeString();
    $("ratLegend").innerHTML = 'Rtg = player rating';

    // leaderboard always shows, with live odds
    computeOdds(players);
    renderLeaderboard(players);

    if(inKo){
      renderKnockout(tp, byId);
    } else {
      // pool: restore court + bubble layout (in case we came back from KO)
      $("fxBody").style.display='grid'; $("brBody").style.display='none';
      $("fxTitle").innerHTML = `This round <span class="tag">${round>0?('round '+round+' of '+tot):'not started'}</span>`;
      $("oddsTitle").innerHTML = 'Race for the knockout <span class="tag">top 8 · top 16</span>';
      renderCourts(tp.pool_matches||[], byId);
      renderNextUp(tp, byId);
      renderBubble(players);
    }
  }catch(e){
    $("err").innerHTML = `<b>Can’t reach the live data.</b><br>${esc(e.message)}<br><span style="font-size:1.4vh;color:var(--mut)">Retrying…</span>`;
    $("err").style.display='block';
    $("refreshLbl").textContent = 'reconnecting…';
  }
}
tick();
setInterval(tick, REFRESH_MS);
</script>
