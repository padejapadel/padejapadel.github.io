<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brentwood Padel Club — Court TVs</title>
<style>
  :root{
    --bg:#08111d; --cell:#0d1b2e; --line:#1b2c45; --teal:#3BC8F5; --gold:#F0A93B;
    --mut:#8AA4C0; --mut2:#5A7A99; --live:#ff4d4d; --win:#2EC4B6;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; background:var(--bg); color:#fff; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .app{ height:100vh; display:flex; flex-direction:column; }
  /* top bar */
  .bar{ height:5.5vh; min-height:34px; display:flex; align-items:center; gap:1.4vw;
    padding:0 1.6vw; border-bottom:1px solid var(--line); background:linear-gradient(180deg,#0b1626,#08111d); }
  .bar .brand{ display:flex; align-items:center; }
  .bar .brand .logo{ height:3.6vh; width:auto; display:block; }
  .bar .venue{ color:var(--mut); font-size:1.7vh; }
  .bar .right{ margin-left:auto; display:flex; align-items:center; gap:1.2vw; }
  .bar .clock{ color:#fff; font-weight:700; font-size:2vh; font-variant-numeric:tabular-nums; }
  .bar .dot{ width:1vh; height:1vh; border-radius:50%; background:var(--live); box-shadow:0 0 8px var(--live); animation:pulse 1.6s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.35} }
  /* grid */
  .grid{ flex:1; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:.7vw; padding:.7vw; min-height:0; }
  .cell{ background:var(--cell); border:1px solid var(--line); border-radius:1.1vh; overflow:hidden; display:flex; flex-direction:column; min-height:0; }
  /* camera area */
  .cam{ flex:1; position:relative; min-height:0; background:
      radial-gradient(120% 120% at 50% 0%, #12233a 0%, #0a1524 70%); display:flex; align-items:center; justify-content:center; }
  .cam video, .cam iframe, .cam img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; border:0; }
  .cam .ph{ text-align:center; color:var(--mut2); }
  .cam .ph svg{ width:5vh; height:5vh; opacity:.6; }
  .cam .ph .t{ margin-top:1vh; font-size:1.7vh; letter-spacing:.15vw; text-transform:uppercase; }
  .cam .courttag{ position:absolute; top:1vh; left:1.1vw; font-weight:800; font-size:2vh; color:#fff;
    background:rgba(0,0,0,.4); padding:.3vh 1vw; border-radius:.8vh; letter-spacing:.1vw; }
  .cam .sponsor{ position:absolute; top:1vh; right:1.1vw; z-index:4; height:3.6vh; border-radius:.7vh; overflow:hidden;
    border:1px solid rgba(255,255,255,.28); box-shadow:0 .3vh 1vh rgba(0,0,0,.55); background:#0a1524; }
  .cam .sponsor img{ position:static; inset:auto; width:auto; height:100%; object-fit:contain; display:block; }
  /* score strip */
  .score{ background:#0a1524; border-top:1px solid var(--line); padding:.8vh 1vw; }
  .score .hd{ display:flex; align-items:center; gap:.8vw; margin-bottom:.7vh; }
  .score .hd .ct{ font-weight:800; font-size:1.7vh; color:var(--mut); letter-spacing:.12vw; }
  .score .hd .pill{ font-size:1.25vh; font-weight:800; letter-spacing:.12vw; padding:.25vh .7vw; border-radius:.6vh; text-transform:uppercase; }
  .pill.live{ color:#fff; background:var(--live); }
  .pill.final{ color:#04121d; background:var(--mut); }
  .pill.badge{ color:#04121d; background:var(--gold); margin-left:auto; }
  .score .hd .type{ margin-left:auto; color:var(--mut2); font-size:1.3vh; text-transform:capitalize; }
  .score .none{ color:var(--mut2); font-size:1.7vh; padding:.6vh 0 1vh; }
  .score .waiting{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.8vh; padding:.5vh 0 .6vh; }
  .score .waiting .wbrand{ display:flex; align-items:center; gap:.6vw; opacity:.8; }
  .score .waiting .wlogo{ height:2.4vh; width:auto; display:block; }
  .score .waiting .wtag{ font-size:1.2vh; font-weight:800; letter-spacing:.1vw; text-transform:uppercase; color:#fff; background:var(--live); padding:.2vh .6vw; border-radius:.5vh; }
  .score .waiting .wtext{ display:flex; align-items:center; gap:.55vw; color:var(--mut2); font-size:1.5vh; }
  .score .waiting .wdot{ width:.95vh; height:.95vh; border-radius:50%; background:var(--live); box-shadow:0 0 6px var(--live); animation:pulse 1.6s infinite; }
  table.sc{ width:100%; border-collapse:collapse; }
  table.sc td{ padding:.35vh .3vw; font-size:2.1vh; }
  table.sc .nm{ font-weight:700; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:1px; width:100%; }
  table.sc .nm .flag{ height:1.7vh; width:auto; border-radius:2px; margin-right:.4vw; vertical-align:middle; box-shadow:0 0 0 1px rgba(255,255,255,.12); }
  table.sc .nm .rt{ color:var(--teal); font-weight:700; font-size:1.6vh; margin-left:.35vw; }
  table.sc .nm .sep{ color:var(--mut2); margin:0 .5vw; }
  table.sc .n{ text-align:center; width:3.2vw; font-variant-numeric:tabular-nums; }
  table.sc .sets{ color:var(--mut); font-weight:700; }
  table.sc .games{ color:#fff; font-weight:700; }
  table.sc .pts{ color:var(--teal); font-weight:800; width:3.6vw; }
  table.sc tr.win .nm, table.sc tr.win .pts{ color:var(--win); }
  .serv{ display:inline-block; width:1.1vh; height:1.1vh; border-radius:50%; background:var(--gold); margin-left:.5vw; vertical-align:middle; }
  .offline{ position:fixed; bottom:1vh; right:1vw; font-size:1.3vh; color:var(--mut2); }
</style>
</head>

  var lastHtml = {};
  function setHtml(el, court, h){ if(lastHtml[court]===h) return; lastHtml[court]=h; el.innerHTML=h; }

  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];}); }

  // ---- camera feed slot -------------------------------------------------
  // When the relay is configured AND this court has a CourtMaster id, embed the
  // relay's self-healing player. The iframe is inserted once (on grid build) and
  // left alone — it manages polling/stream swaps itself, so the score strip can
  // refresh independently without ever reloading the video.
  function sponsorHTML(court){ var g = COURT_SPONSORS[court]; return g ? '<div class="sponsor"><img src="'+g+'" alt="Sponsor"></div>' : ""; }

  function cameraHTML(court){
    var id = COURT_STREAM_IDS[court];
    if(RELAY_BASE && id && !DEMO){
      return '<iframe src="'+RELAY_BASE+'/embed/'+id+'" '
        + 'allow="autoplay; encrypted-media; fullscreen" allowfullscreen '
        + 'referrerpolicy="no-referrer-when-downgrade" title="Court '+court+' camera"></iframe>';
    }
    // No relay set yet (or this court has no camera) -> branded placeholder.
    return '<div class="ph">'
      + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'
      + '<path d="M23 7l-7 5 7 5V7z"></path><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>'
      + '<div class="t">Court '+court+' &middot; camera feed</div></div>';
  }

  // ---- build the grid ---------------------------------------------------
  var grid = document.getElementById("grid");
  COURTS.forEach(function(court){
    var cell = document.createElement("div");
    cell.className = "cell";
    cell.innerHTML =
      '<div class="cam"><div class="courttag">Court '+court+'</div>'+sponsorHTML(court)+'<div class="feed">'+cameraHTML(court)+'</div></div>'
      + '<div class="score" id="sc'+court+'"></div>';
    grid.appendChild(cell);
  });

  // ---- render one court's score strip -----------------------------------
  function isFinished(m){
    var w = (m.match_winner||"").toString().trim();
    var st = (m.match_state||"").toString().toLowerCase();
    return (w !== "" ) || /finish|complete|ended/.test(st);
  }
  function ageMinutes(m){
    if(!m.updated_at) return 1e9;
    var t = Date.parse(m.updated_at);
    if(isNaN(t)) return 1e9;
    return (Date.now() - t) / 60000;
  }

  // ---- per-player name / rating / flag (from players_json) --------------
  function parsePlayers(m){
    if(!m || !m.players_json) return null;
    try {
      var a = (typeof m.players_json === "string") ? JSON.parse(m.players_json) : m.players_json;
      return Array.isArray(a) ? a : null;
    } catch(e){ return null; }
  }
  // Image flags (reliable on any TV/browser, unlike emoji flags).
  function flagImg(nat){
    var c = String(nat==null?"":nat).trim().toLowerCase();
    if(!/^[a-z]{2}$/.test(c)) return "";
    return '<img class="flag" src="https://flagcdn.com/24x18/'+c+'.png" alt="">';
  }
  // The name cell for a team: flag + name + rating per player when players_json
  // is present, otherwise the plain combined team-name string.
  function nameCell(m, team){
    var ps = parsePlayers(m);
    if(ps){
      var mine = ps.filter(function(p){ return String(p.team||"").toLowerCase()===team; })
                   .sort(function(x,y){ return (x.pos||0)-(y.pos||0); });
      if(mine.length){
        return mine.map(function(p){
          var rt = (p.rating!=null && p.rating!=="") ? '<span class="rt">'+esc(Number(p.rating).toFixed(2))+'</span>' : '';
          return flagImg(p.nat)+esc(p.name||"")+rt;
        }).join('<span class="sep">&middot;</span>');
      }
    }
    return esc((team==="a" ? m.team_a : m.team_b) || (team==="a" ? "Team A" : "Team B"));
  }

  function renderCourt(court, m){
    var el = document.getElementById("sc"+court);
    if(!el) return;
    if(!m || ageMinutes(m) > STALE_MIN){
      setHtml(el, court, '<div class="waiting">'
        + '<div class="wbrand"><svg class="wlogo" viewBox="0 0 1154 208" aria-label="Padeja"><use href="#padejaWM"/></svg><span class="wtag">Live</span></div>'
        + '<div class="wtext"><span class="wdot"></span>Waiting for live score</div></div>');
      return;
    }
    var fin = isFinished(m);
    var live = !fin;
    var servA = String(m.serving_team||"").toUpperCase()==="A";
    var servB = String(m.serving_team||"").toUpperCase()==="B";
    var winA = fin && String(m.match_winner||"").toUpperCase()==="A";
    var winB = fin && String(m.match_winner||"").toUpperCase()==="B";

    var pill = live ? '<span class="pill live">Live</span>' : '<span class="pill final">Final</span>';
    var badge = "";
    if(live && m.is_match_point) badge = '<span class="pill badge">Match pt</span>';
    else if(live && m.is_set_point) badge = '<span class="pill badge">Set pt</span>';
    else if(live && m.is_tiebreak) badge = '<span class="pill badge">Tiebreak</span>';
    var type = m.match_type ? '<span class="type">'+esc(m.match_type)+'</span>' : '';

    // points column: hidden for finished matches (show sets/games only)
    function ptCell(disp, serving){
      if(fin) return '<td class="n pts"></td>';
      return '<td class="n pts">'+esc(disp||"0")+(serving?'<span class="serv"></span>':'')+'</td>';
    }
    var rowA = '<tr class="'+(winA?'win':'')+'"><td class="nm">'+nameCell(m,"a")+'</td>'
      + '<td class="n sets">'+(m.sets_a!=null?m.sets_a:0)+'</td>'
      + '<td class="n games">'+(m.game_a!=null?m.game_a:0)+'</td>'
      + ptCell(m.point_display_a, servA)+'</tr>';
    var rowB = '<tr class="'+(winB?'win':'')+'"><td class="nm">'+nameCell(m,"b")+'</td>'
      + '<td class="n sets">'+(m.sets_b!=null?m.sets_b:0)+'</td>'
      + '<td class="n games">'+(m.game_b!=null?m.game_b:0)+'</td>'
      + ptCell(m.point_display_b, servB)+'</tr>';

    setHtml(el, court, '<div class="hd"><span class="ct">Court '+court+'</span>'+pill+(badge||type)+'</div>'
      + '<table class="sc">'+rowA+rowB+'</table>');
  }

  // ---- data -------------------------------------------------------------
  function demoData(){

    var rows = {};

      ]) };
    if(COURTS[1]!=null) rows[COURTS[1]] = { court_number:COURTS[1], team_a:"Tracey & Rob", team_b:"George & Peter", point_display_a:"AD", point_display_b:"40", sets_a:0, sets_b:1, game_a:5, game_b:5, serving_team:"B", is_tiebreak:false, is_match_point:true, match_state:"inProgress", match_winner:"", match_type:"league", updated_at:now };
    if(COURTS[2]!=null) rows[COURTS[2]] = { court_number:COURTS[2], team_a:"Poppy & Gareth", team_b:"John & Craig", sets_a:2, sets_b:1, game_a:6, game_b:4, match_state:"finished", match_winner:"A", match_type:"competition", updated_at:now };
    // COURTS[3] intentionally left with no live match
    return rows;
  }

  var offline = document.getElementById("offline");
  function poll(){
    if(DEMO){ var d=demoData(); COURTS.forEach(function(c){ renderCourt(c, d[c]); }); offline.textContent=""; return; }
    var url = SUPA + "/rest/v1/live_matches?select=" + encodeURIComponent(COLS)
      + "&court_number=in.(" + COURTS.join(",") + ")&order=updated_at.desc";
    fetch(url, { headers: { apikey: ANON, Authorization: "Bearer " + ANON } })
      .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
      .then(function(list){
        var byCourt = {};
        (list||[]).forEach(function(m){ // list is newest-first, keep the first per court
          if(byCourt[m.court_number]==null) byCourt[m.court_number] = m;
        });
        COURTS.forEach(function(c){ renderCourt(c, byCourt[c]); });
        offline.textContent = "";
      })
      .catch(function(e){ offline.textContent = "reconnecting…"; });
  }

  function tick(){
    var d = new Date();
    document.getElementById("clock").textContent =
      String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  }
  tick(); setInterval(tick, 15000);
  // Keep the TV screen awake WITHOUT reloading, so the live video never breaks.
  (function keepAwake(){
    var lock = null;
    function acquire(){
      if (!("wakeLock" in navigator) || document.visibilityState !== "visible") return;
      navigator.wakeLock.request("screen").then(function(l){
        lock = l;
        l.addEventListener("release", function(){ lock = null; });
      }).catch(function(){});
    }
    document.addEventListener("visibilitychange", function(){
      if (document.visibilityState === "visible" && !lock) acquire();
    });
    ["click","touchstart","keydown","mousemove"].forEach(function(ev){
      window.addEventListener(ev, function(){ if(!lock) acquire(); });
    });
    setInterval(function(){ if(!lock) acquire(); }, 30000);  // re-acquire if ever dropped
    acquire();
  })();

  poll(); setInterval(poll, 4000);
})();
</script>
