<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BPC Padel Games · Live</title>
<style>
  :root{
    --bg:#060b11; --panel:#0d1620; --panel2:#111e2b; --line:#1d2c3b;
    --ink:#eef5fb; --mut:#8ba1b4; --mut2:#5e7385;
    --teal:#00d4aa; --sky:#37b7ff; --gold:#ffd23e; --green:#37e6a4; --red:#ff6b6b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);
    font-family:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  .stage{height:100vh;width:100vw;display:flex;flex-direction:column;padding:1.4vh 1.4vw;gap:1.2vh}
  header{display:flex;align-items:center;gap:1.1vw;padding-bottom:1vh;border-bottom:1px solid var(--line)}
  .logo{width:4.4vh;height:4.4vh;border-radius:1vh;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--teal),var(--sky));color:#04121d;font-weight:900;font-size:2.3vh}
  .htitle{font-size:2.6vh;font-weight:900;letter-spacing:.4px}
  .hsub{font-size:1.3vh;color:var(--mut);margin-top:.1vh}
  .live{margin-left:auto;display:flex;align-items:center;gap:.6vw;font-weight:800;font-size:1.5vh;color:var(--red)}
  .live .blip{width:1.1vh;height:1.1vh;border-radius:50%;background:var(--red);animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .clock{margin-left:1vw;font-size:1.7vh;color:var(--mut);font-variant-numeric:tabular-nums}
  .pb{margin-left:.9vw;font-size:1.2vh;color:var(--mut2)}.pb b{color:var(--teal)}
  .dots{display:flex;gap:.45vw;margin-left:1vw}
  .dots i{width:.95vh;height:.95vh;border-radius:50%;background:var(--line);display:block}
  .dots i.on{background:var(--gold)}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:1.2vh;padding:1.3vh 1.1vw;display:flex;flex-direction:column;min-height:0}
  .ph{font-size:1.5vh;text-transform:uppercase;letter-spacing:.26vw;font-weight:800;margin-bottom:1vh;display:flex;align-items:baseline;gap:.8vw}
  .ph .meta{margin-left:auto;font-size:1.3vh;color:var(--mut2);font-weight:600;letter-spacing:normal;text-transform:none}
  .gold{color:var(--gold)} .skyc{color:var(--sky)}

  .top{flex:1;display:grid;grid-template-columns:44% 1fr;gap:1.2vw;min-height:0}
  .coming{height:28vh;min-height:0}

  /* ---- league table (left) ---- */
  .lwrap{position:relative;flex:1;min-height:0}
  .page{position:absolute;inset:0;opacity:0;transition:opacity .5s;pointer-events:none;display:flex;flex-direction:column}
  .page.on{opacity:1}
  .thead,.strow,.ctrow{display:grid;align-items:center}
  .thead{padding:0 .5vw .7vh;border-bottom:1px solid var(--line);margin-bottom:.6vh}
  .thead div{font-size:1.15vh;color:var(--mut2);text-transform:uppercase;letter-spacing:.1vw;font-weight:700;text-align:right}
  .thead div:nth-child(2){text-align:left}
  .strow{grid-template-columns:3vh 1fr 5vw 5vw 6vw;padding:1vh .5vw;border-radius:1vh}
  .strow+.strow{margin-top:.5vh}
  .ctrow{grid-template-columns:3vh 1fr 4.5vw 4.5vw 5.5vw;padding:.75vh .5vw;border-radius:1vh}
  .ctrow+.ctrow{margin-top:.35vh}
  .strow.lead,.ctrow.lead{background:linear-gradient(90deg,rgba(255,210,62,.15),transparent)}
  .rk{font-size:2vh;font-weight:800;color:var(--mut2);text-align:center}
  .cval{font-size:2vh;font-variant-numeric:tabular-nums;text-align:right}
  .cval.bonus{color:var(--gold);font-weight:800}
  .cval.total{font-size:2.7vh;font-weight:900}
  .cvalp{font-size:2vh;text-align:right;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
  .club{display:flex;align-items:center;gap:1vw;min-width:0}
  .bignm{font-size:2.3vh;font-weight:800;line-height:1.05}
  .subnm{font-size:1.4vh;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.25vh}
  .subnm .rt{color:var(--sky);font-weight:700}
  .lg{border-radius:.9vh;object-fit:contain;background:#fff;flex:none}
  .lg.tbl{width:6.6vh;height:6.6vh;padding:.4vh}
  .lg.ct{width:5.4vh;height:5.4vh;padding:.35vh}
  .lg.fx{width:4vh;height:4vh;padding:.28vh}
  .lg.cm{width:3vh;height:3vh;padding:.2vh}
  .badge{border-radius:.9vh;display:grid;place-items:center;font-weight:900;color:#04121d;flex:none;background:#889}
  .badge.tbl{width:6.6vh;height:6.6vh;font-size:2vh}
  .badge.ct{width:5.4vh;height:5.4vh;font-size:1.7vh}
  .badge.fx{width:4vh;height:4vh;font-size:1.4vh}
  .badge.cm{width:3vh;height:3vh;font-size:1.1vh}

  /* ---- round fixtures (right) ---- */
  .heats{flex:1;min-height:0;overflow:hidden}
  #heatsInner{display:flex;flex-direction:column;gap:1vh;will-change:transform}
  .heatblk{display:flex;flex-direction:column;flex:none;background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:1vh;padding:.9vh .8vw;margin-bottom:1.1vh}
  .heatlbl{font-size:1.5vh;color:var(--gold);font-weight:800;letter-spacing:.04vw;margin:0 0 .7vh;padding-bottom:.55vh;border-bottom:1px solid var(--line)}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:.7vw}
  .fc{background:var(--panel2);border:1px solid var(--line);border-radius:.9vh;padding:.85vh .8vw;display:flex;flex-direction:column;min-width:0;overflow:hidden}
  .fc.done{border-color:rgba(55,230,164,.3)}
  .fctop{display:flex;justify-content:space-between;align-items:center;font-size:1.1vh;color:var(--mut2);font-weight:700}
  .cnum{background:rgba(55,183,255,.16);color:var(--sky);border-radius:.5vh;padding:.1vh .5vw;font-weight:800}
  .fcside{display:flex;align-items:center;gap:.4vw;margin-top:.45vh;min-width:0}
  .fcnm{min-width:0;flex:1}
  .fcclub{font-size:1.75vh;font-weight:800;line-height:1.08;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .fcclub.w{color:var(--green)}
  .fcpl{font-size:1.3vh;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.2vh}
  .fcsc{font-size:1.9vh;font-weight:900;font-variant-numeric:tabular-nums;margin-left:auto}
  .fcsc.dim{color:var(--mut2);font-size:1.2vh;font-weight:600}
  .wp{height:.65vh;border-radius:.4vh;overflow:hidden;display:flex;margin-top:.6vh;background:var(--line)}
  .wp b{display:block;height:100%}
  .wptext{display:flex;justify-content:space-between;font-size:1vh;color:var(--mut2);margin-top:.3vh;font-weight:700}

  /* ---- coming up (bottom) ---- */
  .cmgrid{flex:1;display:grid;grid-template-columns:repeat(6,1fr);gap:.7vw;min-height:0}
  .cmcard{background:var(--panel2);border:1px solid var(--line);border-radius:.9vh;padding:.7vh .7vw;display:flex;flex-direction:column;min-width:0}
  .cmtop{display:flex;justify-content:space-between;font-size:1.05vh;color:var(--mut2);font-weight:700}
  .cmside{display:flex;align-items:center;gap:.45vw;margin-top:.5vh;min-width:0}
  .cmclub{font-size:1.4vh;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cmv{text-align:center;font-size:1vh;color:var(--mut2);margin:.15vh 0}
</style>
</head>
<body>
<div class="stage">
  <header>
    <div class="logo">P</div>
    <div>
      <div class="htitle">BPC Padel Games</div>
      <div class="hsub">Brentwood Padel Club · 6 teams · 6 categories</div>
    </div>
    <div class="dots" id="dots"></div>
    <div class="live"><span class="blip"></span>LIVE</div>
    <div class="clock" id="clock">--:--</div>
    <div class="pb">Powered by <b>Padeja</b></div>
  </header>

  <div class="top">
    <div class="panel">
      <div class="lwrap" id="left"></div>
    </div>
    <div class="panel">
      <div class="ph"><span class="gold" id="roundTitle">Round —</span><span class="meta" id="roundMeta"></span></div>
      <div class="heats" id="heats"><div id="heatsInner"></div></div>
    </div>
  </div>

  <div class="panel coming">
    <div class="ph"><span class="skyc">Coming Up</span><span class="meta" id="comingMeta"></span></div>
    <div class="cmgrid" id="coming"></div>
  </div>
</div>

function logo(club,cls){ const l=CLUB_LOGOS[club];
  return l?`<img class="lg ${cls}" src="${l}" alt="">`:`<span class="badge ${cls}" style="background:${CLUB[club]||'#889'}">${INIT[club]||'?'}</span>`; }
function shortName(n){ if(!n) return ''; const p=n.trim().replace(/\s+/g,' ').split(' '); return p.length<2?p[0]:(p[0][0]+'. '+p[p.length-1]); }
function rate(l){ return (l&&l>0)?` <span class="rt">${(+l).toFixed(1)}</span>`:''; }
function players(k,club,withRate){ const pr=PAIRINGS[k]&&PAIRINGS[k][club]; if(!pr) return '<span style="color:var(--mut2)">pairing t.b.c.</span>';
  const r=withRate?1:0;
  return `${esc(shortName(pr.p1))}${r?rate(pr.l1):''} · ${esc(shortName(pr.p2))}${r?rate(pr.l2):''}`; }

let MATCHES=[], PAIRINGS={}, PAGES=[], pageIdx=0;
function tick(){ $("clock").textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }
setInterval(tick,1000); tick();

async function q(path){ const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,{headers:{apikey:SUPABASE_ANON,Authorization:"Bearer "+SUPABASE_ANON}}); return r.ok?r.json():[]; }
async function loadPairings(){
  const rows=await q("bpc_pairings?select=cat_key,club,p1,p1_rating,p2,p2_rating");
  const map={}; rows.forEach(r=>{ (map[r.cat_key]=map[r.cat_key]||{})[r.club]={p1:r.p1,l1:+r.p1_rating||0,p2:r.p2,l2:+r.p2_rating||0}; });
  PAIRINGS=map;
}
async function load(){
  const { data, error } = await sb.from("bpc_games_matches").select("*").order("seq");
  if(!error) MATCHES=data||[];
  await loadPairings();
  buildLeft(); renderRound(); renderComing();
}

// ---------- scoring ----------
function overall(){
  const clubs=Object.keys(CLUB), pts={},bonus={}; clubs.forEach(c=>{pts[c]=0;bonus[c]=0;});
  CATLIST.forEach(cat=>{ const ms=MATCHES.filter(m=>catKey(m.category)===cat.key),wins={}; clubs.forEach(c=>wins[c]=0); let played=0;
    ms.forEach(m=>{ if(m.status!=="completed")return; played++; if(m.score_a>m.score_b)wins[m.club_a]++; else wins[m.club_b]++; });
    clubs.forEach(c=>pts[c]+=wins[c]);
    if(ms.length&&played===ms.length){ const mx=Math.max(...clubs.map(c=>wins[c])),ld=clubs.filter(c=>wins[c]===mx&&mx>0),aw=ld.length>=2?3:5; ld.forEach(c=>bonus[c]+=aw); }
  });
  return clubs.map(c=>({club:c,pts:pts[c],bonus:bonus[c],total:pts[c]+bonus[c]})).sort((x,y)=>y.total-x.total||y.pts-x.pts||x.club.localeCompare(y.club));
}
function categoryTable(cat){
  const ms=MATCHES.filter(m=>catKey(m.category)===cat.key);
  const clubs=[...new Set(ms.flatMap(m=>[m.club_a,m.club_b]))];
  const rows=clubs.map(club=>{ let w=0,p=0; ms.forEach(m=>{ if(m.status!=="completed")return; if(m.club_a!==club&&m.club_b!==club)return; p++; const win=(m.club_a===club)?m.score_a>m.score_b:m.score_b>m.score_a; if(win)w++; });
    return {club,played:p,won:w}; }).sort((x,y)=>y.won-x.won||y.played-x.played||x.club.localeCompare(y.club));
  const total=ms.length,done=ms.filter(m=>m.status==="completed").length;
  return {rows,total,done,complete:total>0&&done===total};
}
function combined(k,club){ const p=PAIRINGS[k]&&PAIRINGS[k][club]; if(!p)return null; const ls=[p.l1,p.l2].filter(x=>x>0); if(!ls.length)return null; return ls.length===1?ls[0]*2:ls[0]+ls[1]; }
function form(k,club){ const ms=MATCHES.filter(m=>catKey(m.category)===k&&(m.club_a===club||m.club_b===club)&&m.status==="completed"); let w=0,n=0; ms.forEach(m=>{n++; const win=(m.club_a===club)?m.score_a>m.score_b:m.score_b>m.score_a; if(win)w++;}); return {n,s:(w+0.5)/(n+1)}; }
function winProb(k,A,B){ const rA=combined(k,A),rB=combined(k,B),fA=form(k,A),fB=form(k,B);
  let pR=null; if(rA!=null&&rB!=null) pR=1/(1+Math.pow(10,(rB-rA)/2.0));
  const pF=fA.s/(fA.s+fB.s),nAvg=(fA.n+fB.n)/2; if(pR==null) return nAvg===0?null:pF; const wF=nAvg/(nAvg+3); return (1-wF)*pR+wF*pF; }

// ---------- left: cycling league table ----------
function buildLeft(){
  PAGES=[];
  const ov=overall();
  let h=`<div class="ph"><span class="skyc">Overall Standings</span></div>
    <div class="thead" style="grid-template-columns:3vh 1fr 5vw 5vw 6vw"><div></div><div>Club</div><div>Pts</div><div>Bonus</div><div>Total</div></div>`;
  ov.forEach((r,i)=>{ h+=`<div class="strow ${i===0&&r.total>0?'lead':''}">
    <div class="rk">${i+1}</div>
    <div class="club">${logo(r.club,'tbl')}<div><div class="bignm">${esc(r.club)}</div></div></div>
    <div class="cval">${r.pts}</div><div class="cval bonus">${r.bonus?('+'+r.bonus):'–'}</div><div class="cval total">${r.total}</div></div>`; });
  PAGES.push(h);
  CATLIST.forEach(cat=>{ const t=categoryTable(cat);
    let ph=`<div class="ph"><span class="gold">${esc(cat.name)}</span><span class="meta">${t.done}/${t.total} played${t.complete?' · complete':''}</span></div>
      <div class="thead" style="grid-template-columns:3vh 1fr 4.5vw 4.5vw 5.5vw"><div></div><div>Pairing</div><div>P</div><div>W</div><div>Pts</div></div>`;
    t.rows.forEach((r,i)=>{ ph+=`<div class="ctrow ${i===0&&r.won>0?'lead':''}">
      <div class="rk">${i+1}</div>
      <div class="club">${logo(r.club,'ct')}<div><div class="bignm">${esc(r.club)}</div><div class="subnm">${players(cat.key,r.club,true)}</div></div></div>
      <div class="cval">${r.played}</div><div class="cval" style="font-weight:800">${r.won}</div><div class="cvalp">${r.won}</div></div>`; });
    PAGES.push(ph);
  });
  const left=$("left");
  left.innerHTML=PAGES.map((p,i)=>`<div class="page ${i===pageIdx%PAGES.length?'on':''}">${p}</div>`).join("");
  $("dots").innerHTML=PAGES.map((_,i)=>`<i class="${i===pageIdx%PAGES.length?'on':''}"></i>`).join("");
}
function cyclePage(){ if(!PAGES.length)return; pageIdx=(pageIdx+1)%PAGES.length;
  document.querySelectorAll("#left .page").forEach((el,i)=>el.classList.toggle("on",i===pageIdx));
  document.querySelectorAll("#dots i").forEach((el,i)=>el.classList.toggle("on",i===pageIdx)); }

// ---------- rounds ----------
function rounds(){ return [...new Set(MATCHES.map(m=>m.round))].sort((a,b)=>a-b); }
function currentRound(){ for(const r of rounds()){ if(MATCHES.some(m=>m.round===r&&m.status!=="completed")) return r; } const rs=rounds(); return rs[rs.length-1]; }

function fixtureCard(m,withProb){
  const done=m.status==="completed", aw=done&&m.score_a>m.score_b, bw=done&&m.score_b>m.score_a, k=catKey(m.category);
  let wp='';
  if(withProb){ const p=winProb(k,m.club_a,m.club_b); if(p!=null){ const pa=Math.round(p*100),pb=100-pa;
    wp=`<div class="wp"><b style="width:${pa}%;background:${CLUB[m.club_a]}"></b><b style="width:${pb}%;background:${CLUB[m.club_b]}"></b></div>
        <div class="wptext"><span>${pa}%</span><span>${pb}%</span></div>`; } }
  return `<div class="fc ${done?'done':''}">
    <div class="fctop"><span class="cnum">Court ${m.court??'–'}</span><span>${esc(m.category)}</span></div>
    <div class="fcside">${logo(m.club_a,'fx')}<div class="fcnm"><div class="fcclub ${aw?'w':''}">${esc(m.club_a)}</div><div class="fcpl">${players(k,m.club_a,false)}</div></div><span class="fcsc ${done?'':'dim'}">${done?m.score_a:''}</span></div>
    <div class="fcside">${logo(m.club_b,'fx')}<div class="fcnm"><div class="fcclub ${bw?'w':''}">${esc(m.club_b)}</div><div class="fcpl">${players(k,m.club_b,false)}</div></div><span class="fcsc ${done?'':'dim'}">${done?m.score_b:'vs'}</span></div>
    ${wp}</div>`;
}

function renderRound(){
  const r=currentRound();
  const ms=MATCHES.filter(m=>m.round===r);
  const done=ms.filter(m=>m.status==="completed").length;
  $("roundTitle").textContent="Round "+r+" · Fixtures";
  $("roundMeta").textContent=`${done}/${ms.length} played`;
  const heats=[...new Set(ms.map(m=>m.heat))].sort((a,b)=>a-b);
  $("heatsInner").innerHTML=heats.map(h=>{
    const hm=ms.filter(m=>m.heat===h).sort((a,b)=>a.court-b.court);
    return `<div class="heatblk"><div class="heatlbl">Heat ${h} · ${esc((hm[0]&&hm[0].slot_time)||'')}</div>
      <div class="cards">${hm.map(m=>fixtureCard(m,true)).join("")}</div></div>`;
  }).join("");
}

function renderComing(){
  const r=currentRound(), nx=r+1;
  const ms=MATCHES.filter(m=>m.round===nx);
  if(!ms.length){ $("comingMeta").textContent=""; $("coming").innerHTML=`<div style="grid-column:1/-1;display:grid;place-items:center;color:var(--mut2);font-size:1.6vh">Final round in play — no more to come</div>`; return; }
  const firstHeat=Math.min(...ms.map(m=>m.heat));
  const hm=ms.filter(m=>m.heat===firstHeat).sort((a,b)=>a.court-b.court);
  $("comingMeta").textContent=`Round ${nx} · Heat ${firstHeat} · ${(hm[0]&&hm[0].slot_time)||''}`;
  $("coming").innerHTML=hm.map(m=>fixtureCard(m,true)).join("");
}

load();
setInterval(load,15000);
setInterval(cyclePage,13000);
let sOff=0,sDir=1,sPause=45;
setInterval(()=>{ const outer=$("heats"), inner=$("heatsInner"); if(!outer||!inner) return;
  const max=inner.scrollHeight-outer.clientHeight;
  if(max<=2){ inner.style.transform="translateY(0)"; sOff=0; return; }
  if(sPause>0){ sPause--; return; }
  sOff+=sDir*0.6;
  if(sOff>=max){ sOff=max; sDir=-1; sPause=70; } else if(sOff<=0){ sOff=0; sDir=1; sPause=70; }
  inner.style.transform="translateY(-"+sOff+"px)";
},40);
</script>
</body>
