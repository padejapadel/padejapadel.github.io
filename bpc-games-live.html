<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BPC Padel Games · Live</title>
<style>
  :root{
    --bg:#060b11; --panel:#0d1620; --panel2:#111e2b; --line:#1d2c3b;
    --ink:#eef5fb; --mut:#8ba1b4; --mut2:#5e7385;
    --teal:#00d4aa; --sky:#37b7ff; --gold:#ffd23e; --green:#37e6a4; --red:#ff6b6b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);
    font-family:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  .stage{height:100vh;width:100vw;display:flex;flex-direction:column;padding:2.2vh 2vw}
  /* header */
  header{display:flex;align-items:center;gap:1.4vw;padding-bottom:1.6vh;border-bottom:1px solid var(--line)}
  .logo{width:5vh;height:5vh;border-radius:1.1vh;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--teal),var(--sky));color:#04121d;font-weight:900;font-size:2.6vh}
  .htitle{font-size:2.9vh;font-weight:900;letter-spacing:.4px}
  .hsub{font-size:1.5vh;color:var(--mut);margin-top:.2vh}
  .live{margin-left:auto;display:flex;align-items:center;gap:.7vw;font-weight:800;font-size:1.7vh;color:var(--red)}
  .live .blip{width:1.3vh;height:1.3vh;border-radius:50%;background:var(--red);animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .clock{margin-left:1.4vw;font-size:1.9vh;color:var(--mut);font-variant-numeric:tabular-nums}
  .pb{margin-left:1.2vw;font-size:1.4vh;color:var(--mut2)}
  .pb b{color:var(--teal)}
  /* body grid */
  .body{flex:1;display:grid;grid-template-columns:1.35fr 1fr;gap:1.6vw;padding-top:1.8vh;min-height:0}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:1.4vh;padding:1.8vh 1.6vw;display:flex;flex-direction:column;min-height:0}
  .panel h2{font-size:1.5vh;text-transform:uppercase;letter-spacing:.28vw;color:var(--mut2);font-weight:800;margin-bottom:1.2vh}
  /* standings */
  .strow{display:grid;grid-template-columns:3vh 1fr auto auto auto;gap:1vw;align-items:center;
    padding:1.15vh .6vw;border-radius:1vh}
  .strow + .strow{margin-top:.5vh}
  .strow.lead{background:linear-gradient(90deg,rgba(255,210,62,.14),transparent)}
  .rk{font-size:2vh;font-weight:800;color:var(--mut2);text-align:center}
  .club{display:flex;align-items:center;gap:.9vw;font-size:2.3vh;font-weight:800;min-width:0}
  .badge{width:3.6vh;height:3.6vh;border-radius:.8vh;display:grid;place-items:center;font-size:1.4vh;font-weight:900;color:#04121d;flex:none}
  .badge.logo{background:#fff!important;padding:.35vh;overflow:hidden}
  .badge.logo img{width:100%;height:100%;object-fit:contain;border-radius:.5vh}
  .lg{width:2.4vh;height:2.4vh;border-radius:.45vh;object-fit:contain;background:#fff;vertical-align:middle;margin-right:.5vw;flex:none}
  span.lg{display:inline-block}
  .colh{font-size:1.25vh;color:var(--mut2);text-transform:uppercase;letter-spacing:.15vw;text-align:right;font-weight:700}
  .cval{font-size:2.1vh;font-variant-numeric:tabular-nums;text-align:right;width:7vw}
  .cval.bonus{color:var(--gold);font-weight:800}
  .cval.total{font-size:2.7vh;font-weight:900;width:6vw}
  .sthead{display:grid;grid-template-columns:3vh 1fr auto auto auto;gap:1vw;padding:0 .6vw .8vh;border-bottom:1px solid var(--line);margin-bottom:.6vh}
  .sthead .cval{color:var(--mut2);font-size:1.25vh;text-transform:uppercase;letter-spacing:.12vw;font-weight:700}
  /* right column */
  .rcol{display:flex;flex-direction:column;gap:1.6vh;min-height:0}
  .rcol .panel{flex:1}
  .now .slot{font-size:1.5vh;color:var(--gold);font-weight:700;margin-bottom:1vh}
  .cm{display:grid;grid-template-columns:auto 1fr auto;gap:.9vw;align-items:center;padding:.85vh .4vw;border-bottom:1px solid rgba(255,255,255,.05)}
  .cm:last-child{border-bottom:none}
  .cnum{width:3.4vh;height:3.4vh;border-radius:.7vh;background:rgba(255,255,255,.06);border:1px solid var(--line);
    display:grid;place-items:center;font-weight:800;font-size:1.5vh;color:var(--sky)}
  .cmid{min-width:0}
  .cmcat{font-size:1.15vh;color:var(--mut2);text-transform:uppercase;letter-spacing:.1vw;font-weight:700}
  .cmteams{font-size:1.7vh;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cmteams .w{color:var(--green)}
  .cmscore{font-size:1.9vh;font-weight:900;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
  .cmscore.pending{color:var(--mut2);font-weight:600;font-size:1.4vh}
  .cats{display:flex;flex-wrap:wrap;gap:.5vw;margin-top:auto;padding-top:1.2vh}
  .catp{font-size:1.15vh;border:1px solid var(--line);border-radius:.7vh;padding:.5vh .7vw;color:var(--mut)}
  .catp.done{border-color:rgba(55,230,164,.4);color:var(--green)}
  .catp b{color:var(--ink)}
  .dim{color:var(--mut2)}
</style>
</head>
<body>
<div class="stage">
  <header>
    <div class="logo">P</div>
    <div>
      <div class="htitle">BPC Padel Games</div>
      <div class="hsub">Brentwood Padel Club · 6 teams · 6 categories</div>
    </div>
    <div class="live"><span class="blip"></span>LIVE</div>
    <div class="clock" id="clock">--:--</div>
    <div class="pb">Powered by <b>Padeja</b></div>
  </header>

  <div class="body">
    <!-- Standings -->
    <div class="panel">
      <h2>Overall Standings</h2>
      <div class="sthead">
        <div></div><div style="font-size:1.25vh;color:var(--mut2);text-transform:uppercase;letter-spacing:.12vw;font-weight:700;align-self:end">Club</div>
        <div class="cval">Match pts</div><div class="cval">Bonus</div><div class="cval total">Total</div>
      </div>
      <div id="stand"></div>
      <div class="cats" id="cats"></div>
    </div>

    <!-- Right: now / next -->
    <div class="rcol">
      <div class="panel now">
        <h2>On Court Now</h2>
        <div class="slot" id="nowSlot"></div>
        <div id="nowList"></div>
      </div>
      <div class="panel">
        <h2>Coming Up</h2>
        <div class="slot" id="nextSlot" style="color:var(--sky)"></div>
        <div id="nextList"></div>
      </div>
    </div>
  </div>
</div>

function badge(club){ const l=CLUB_LOGOS[club];
  return l ? `<span class="badge logo"><img src="${l}" alt=""></span>`
           : `<span class="badge" style="background:${CLUB[club]}">${INIT[club]}</span>`; }
function mini(club){ const l=CLUB_LOGOS[club];
  return l ? `<img class="lg" src="${l}" alt="">`
           : `<span class="lg" style="background:${CLUB[club]}"></span>`; }

let MATCHES=[];

function tick(){ const d=new Date(); $("clock").textContent=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }
setInterval(tick,1000); tick();

async function load(){
  const { data, error } = await sb.from("bpc_games_matches").select("*").order("seq");
  if(error){ console.error(error); return; }
  MATCHES=data||[]; renderStandings(); renderNow();
}

function computeStandings(){
  const clubs=Object.keys(CLUB), pts={}, bonus={}; clubs.forEach(c=>{pts[c]=0;bonus[c]=0;});
  const catStatus={};
  CATS.forEach(cat=>{
    const ms=MATCHES.filter(m=>m.category===cat), wins={}; clubs.forEach(c=>wins[c]=0);
    let played=0;
    ms.forEach(m=>{ if(m.status!=="completed")return; played++;
      if(m.score_a>m.score_b) wins[m.club_a]++; else wins[m.club_b]++; });
    clubs.forEach(c=>pts[c]+=wins[c]);
    const complete=ms.length>0&&played===ms.length;
    catStatus[cat]={complete,total:ms.length,played,wins};
    if(complete){
      const max=Math.max(...clubs.map(c=>wins[c]));
      const leaders=clubs.filter(c=>wins[c]===max&&max>0);
      const award=leaders.length>=2?3:5;
      leaders.forEach(c=>bonus[c]+=award);
      catStatus[cat].leaders=leaders; catStatus[cat].award=award;
    }
  });
  const table=clubs.map(c=>({club:c,pts:pts[c],bonus:bonus[c],total:pts[c]+bonus[c]}))
    .sort((x,y)=>y.total-x.total||y.pts-x.pts||x.club.localeCompare(y.club));
  return {table,catStatus};
}

function renderStandings(){
  const {table,catStatus}=computeStandings();
  $("stand").innerHTML=table.map((r,i)=>`
    <div class="strow ${i===0&&r.total>0?'lead':''}">
      <div class="rk">${i+1}</div>
      <div class="club">${badge(r.club)}${esc(r.club)}</div>
      <div class="cval">${r.pts}</div>
      <div class="cval bonus">${r.bonus?('+'+r.bonus):'–'}</div>
      <div class="cval total">${r.total}</div>
    </div>`).join("");
  const doneCats=CATS.filter(c=>catStatus[c].complete).length;
  $("cats").innerHTML=CATS.map(c=>{
    const s=catStatus[c];
    const lead=s.complete&&s.leaders&&s.leaders.length?` · ${s.leaders.map(x=>INIT[x]).join('&')} +${s.award}`:'';
    return `<span class="catp ${s.complete?'done':''}"><b>${esc(c)}</b> ${s.played}/${s.total}${esc(lead)}</span>`;
  }).join("");
}

function heatKey(m){ return m.round*10+m.heat; }
function renderNow(){
  // "Now" = earliest heat not fully complete; "Next" = the following heat.
  const heats=[...new Set(MATCHES.map(heatKey))].sort((a,b)=>a-b);
  let nowHeat=null;
  for(const hk of heats){
    const ms=MATCHES.filter(m=>heatKey(m)===hk);
    if(ms.some(m=>m.status!=="completed")){ nowHeat=hk; break; }
  }
  if(nowHeat===null) nowHeat=heats[heats.length-1]; // all done → show last
  const nextHeat=heats.find(h=>h>nowHeat);

  const draw=(hk,slotEl,listEl)=>{
    if(hk==null){ $(slotEl).textContent=""; $(listEl).innerHTML='<div class="dim" style="font-size:1.6vh">—</div>'; return; }
    const ms=MATCHES.filter(m=>heatKey(m)===hk).sort((a,b)=>a.court-b.court);
    $(slotEl).textContent=(ms[0]? `Round ${ms[0].round} · Heat ${ms[0].heat} · ${ms[0].slot_time||''}`:'');
    $(listEl).innerHTML=ms.map(m=>{
      const done=m.status==="completed";
      const aw=done&&m.score_a>m.score_b, bw=done&&m.score_b>m.score_a;
      const score=done?`${m.score_a}–${m.score_b}`:'vs';
      return `<div class="cm">
        <div class="cnum">${m.court??'–'}</div>
        <div class="cmid">
          <div class="cmcat">${esc(m.category)}</div>
          <div class="cmteams">${mini(m.club_a)}<span class="${aw?'w':''}">${esc(m.club_a)}</span> <span class="dim">v</span> ${mini(m.club_b)}<span class="${bw?'w':''}">${esc(m.club_b)}</span></div>
        </div>
        <div class="cmscore ${done?'':'pending'}">${score}</div>
      </div>`;
    }).join("");
  };
  draw(nowHeat,"nowSlot","nowList");
  draw(nextHeat,"nextSlot","nextList");
}

load();
setInterval(load,15000);
</script>
</body>
</html>
