<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Padeja Scorer</title>
<style>
  :root{--bg:#0A1624;--card:#162035;--line:#22344d;--brand:#3BC8F5;--green:#35D6A4;--gold:#F5B83D;--sec:#8AA4C0;--white:#fff;--loss:#F56040}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
  .wrap{max-width:640px;margin:0 auto;padding:16px;padding-bottom:60px}
  h1{font-size:20px;margin:4px 0 2px}
  .muted{color:var(--sec);font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;background:var(--green);color:#06231a}
  .btn.sec{background:var(--card);color:var(--white);border:1px solid var(--line)}
  .btn.small{width:auto;padding:9px 14px;font-size:13px}
  input.f{width:100%;background:#0e1a2b;border:1px solid var(--line);border-radius:10px;padding:13px;color:var(--white);font-size:16px;margin-bottom:10px}
  .row{display:flex;align-items:center;gap:8px}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .back{background:var(--card);border:1px solid var(--line);color:var(--sec);border-radius:10px;width:38px;height:38px;font-size:18px;cursor:pointer;flex:0 0 auto}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:#22344d;color:#cdd9e6;text-transform:capitalize}
  .pill.done{background:rgba(53,214,164,.18);color:var(--green)}
  .pill.live{background:rgba(245,184,61,.18);color:var(--gold)}
  .tabs{display:flex;gap:8px;margin:6px 0 14px}
  .tab{flex:1;text-align:center;padding:10px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--sec);font-weight:700;font-size:13px;cursor:pointer}
  .tab.on{background:var(--green);color:#06231a;border-color:var(--green)}
  .mt{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #1b2942}
  .mt:last-child{border-bottom:0}
  .team{flex:1;font-size:14px;font-weight:600;line-height:1.25}
  .team.b{text-align:right}
  .sc{width:52px;text-align:center;background:#0e1a2b;border:1px solid var(--line);border-radius:9px;padding:10px 4px;color:var(--white);font-size:17px;font-weight:700}
  .dash{color:var(--sec);font-weight:700}
  .meta{font-size:11px;color:var(--sec);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
  .rgrp{margin-bottom:6px}
  .save{background:var(--green);color:#06231a;border:0;border-radius:9px;padding:9px 12px;font-weight:800;font-size:13px;cursor:pointer;flex:0 0 auto}
  .save.ok{background:rgba(53,214,164,.18);color:var(--green)}
  table.stand{width:100%;border-collapse:collapse;font-size:13px}
  table.stand th{color:var(--sec);text-transform:uppercase;font-size:10px;text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
  table.stand td{padding:8px 6px;border-bottom:1px solid #1b2942}
  table.stand td.n{text-align:center;width:34px}
  table.stand td.pts{text-align:center;font-weight:800;color:var(--green);width:44px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:#0e1a2b;border:1px solid var(--line);color:#fff;padding:11px 16px;border-radius:12px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
  .toast.show{opacity:1}
  .toast.err{border-color:var(--loss);color:#ffd7cd}
  .logo{height:26px;vertical-align:middle}
  .err{color:var(--loss);font-size:13px;margin:6px 2px}
  .center{text-align:center}
  h2.div{font-size:13px;color:var(--gold);letter-spacing:.5px;margin:16px 0 6px}
</style>
</head>
<body>
<div class="wrap" id="wrap"><div class="muted center" style="margin-top:40px">Loading…</div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://odrckirnjavfptlfygbo.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9kcmNraXJuamF2ZnB0bGZ5Z2JvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1MzY3MzQsImV4cCI6MjA5NTExMjczNH0.rjoAQhEaTw6Sp-nGrQmYYvLdVKD7ewrKwG1PmMbyYgo";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const $ = id => document.getElementById(id);
const wrap = $("wrap");
let CURRENT = null;   // current competition {tournament_id,name,variant,share_code,status}

// --- Chas Berger Order of Play (time + court per pair) ----------------------
// Orders the league fixtures by time then court, matching the club console and
// the printed Order of Play. Keyed on the pair's player-1 name; only activates
// for the Chas draw (share_code CHASBG). Every other event is unaffected.
const CHAS_CODE_P1={
 "Dare Oduye":"A1","Megan Paul":"A2","Steve Baldwin":"A3","Danny Mangan":"A4","Ben Trueman":"A5","Jim Rex":"A6",
 "Luke Culling":"B1","Stanley Richardson":"B2","Danny Brotherton":"B3","Craig O'Donavan":"B4","Olly Brotherton":"B5","Sam Defries":"B6",
 "Ash Rex":"C1","Andy Williams":"C2","Reece Okugbeni":"C3","Ross Brotherton":"C4","Josh Grantham":"C5","Sam Laskowski":"C6",
 "Zach Holden":"D1","Ryan Brotherton":"D2","Andy Godden":"D3","Adam Anderson":"D4","Greg Williams":"D5","Brad Smith":"D6"
};
const CHAS_OOP=[
 ["11:30",1,"A3","A4"],["11:30",3,"A2","A5"],["11:30",4,"A1","A6"],["12:10",1,"A1","A5"],["12:10",3,"A6","A4"],["12:10",6,"A2","A3"],
 ["12:50",1,"A6","A2"],["12:50",4,"A5","A3"],["12:50",5,"A1","A4"],["1:30",3,"A1","A3"],["1:30",4,"A4","A2"],["1:30",5,"A5","A6"],
 ["2:10",1,"A3","A6"],["2:10",2,"A1","A2"],["2:10",6,"A4","A5"],
 ["11:30",2,"B3","B4"],["11:30",5,"B1","B6"],["11:30",6,"B2","B5"],["12:30",1,"B1","B5"],["12:30",4,"B6","B4"],["12:30",5,"B2","B3"],
 ["1:10",1,"B1","B4"],["1:10",2,"B6","B2"],["1:10",4,"B5","B3"],["1:30",1,"B4","B2"],["1:30",2,"B5","B6"],["1:30",6,"B1","B3"],
 ["2:30",2,"B1","B2"],["2:30",3,"B4","B5"],["2:30",6,"B3","B6"],
 ["11:50",1,"C2","C5"],["11:50",3,"C3","C4"],["11:50",6,"C1","C6"],["12:10",2,"C6","C4"],["12:10",4,"C2","C3"],["12:10",5,"C1","C5"],
 ["1:10",3,"C6","C2"],["1:10",5,"C1","C4"],["1:10",6,"C5","C3"],["1:50",2,"C1","C3"],["1:50",3,"C5","C6"],["1:50",6,"C4","C2"],
 ["2:10",3,"C1","C2"],["2:10",4,"C4","C5"],["2:10",5,"C3","C6"],
 ["11:50",2,"D3","D4"],["11:50",4,"D1","D6"],["11:50",5,"D2","D5"],["12:30",2,"D1","D5"],["12:30",3,"D2","D3"],["12:30",6,"D6","D4"],
 ["12:50",2,"D6","D2"],["12:50",3,"D1","D4"],["12:50",6,"D5","D3"],["1:50",1,"D5","D6"],["1:50",4,"D4","D2"],["1:50",5,"D1","D3"],
 ["2:30",1,"D1","D2"],["2:30",4,"D3","D6"],["2:30",5,"D4","D5"]
];
const CHAS_SCHED={}; CHAS_OOP.forEach(([t,c,x,y])=>{ CHAS_SCHED[[x,y].sort().join("-")]={t,c}; });
function chasMin(t){ if(!t) return 99999; const q=String(t).split(":"); let h=+q[0]; const m=+q[1]||0; if(h<=2) h+=12; return h*60+m; }
let TAB = "scores";
let LEAGUE_PAIRS = {};   // team_id -> {n1,n2} partner names (league events)

const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(msg, isErr){ const t=$("toast"); t.textContent=msg; t.className="toast show"+(isErr?" err":""); setTimeout(()=>t.className="toast",2200); }

// ---------- boot ----------
(async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session) showList(); else showLogin();
})();

// ---------- login ----------
function showLogin(){
  wrap.innerHTML = `
    <div style="text-align:center;margin:26px 0 18px">
      <h1>Padeja Scorer</h1>
      <div class="muted">Sign in with your Padeja account to enter scores for the events you've been assigned.</div>
    </div>
    <div class="card">
      <input class="f" id="email" type="email" placeholder="Email" autocomplete="username">
      <input class="f" id="pw" type="password" placeholder="Password" autocomplete="current-password">
      <div class="err" id="loginErr" style="display:none"></div>
      <button class="btn" id="loginBtn">Log in</button>
    </div>`;
  $("loginBtn").onclick = doLogin;
  $("pw").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });
}
async function doLogin(){
  const email=$("email").value.trim(), password=$("pw").value;
  if(!email||!password){ return; }
  $("loginBtn").textContent="Signing in…"; $("loginBtn").disabled=true;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ const e=$("loginErr"); e.style.display="block"; e.textContent=error.message; $("loginBtn").textContent="Log in"; $("loginBtn").disabled=false; return; }
  showList();
}
async function logout(){ await sb.auth.signOut(); showLogin(); }

// ---------- competition list ----------
async function showList(){
  wrap.innerHTML = `<div class="top"><h1 style="flex:1">Your events</h1><button class="btn sec small" id="out">Log out</button></div><div id="list"><div class="muted">Loading…</div></div>`;
  $("out").onclick = logout;
  const { data, error } = await sb.rpc("get_my_scoring_competitions");
  const list = $("list");
  if(error){ list.innerHTML = `<div class="err">${esc(error.message)}</div>`; return; }
  if(!data || !data.length){
    list.innerHTML = `<div class="card"><div class="muted">You haven't been assigned to score any events yet. Ask the host to add you as a scorer in the host console.</div></div>`;
    return;
  }
  list.innerHTML = data.map((c,i)=>`
    <div class="card" style="cursor:pointer" data-i="${i}">
      <div style="font-size:16px;font-weight:700">${esc(c.name||"Competition")}</div>
      <div class="muted" style="margin-top:4px">${esc(fmtVariant(c.variant))} · <span class="pill">${esc(c.status||"active")}</span></div>
    </div>`).join("");
  [...list.querySelectorAll("[data-i]")].forEach(el=>{
    el.onclick = ()=>openComp(data[+el.dataset.i]);
  });
}
function fmtVariant(v){
  if(v==="americano_fixed") return "Americano";
  if(!v||v==="league") return "League";
  return v.replace(/_/g," ");
}

// ---------- open a competition ----------
function openComp(c){ CURRENT=c; TAB="scores"; loadComp(); }

async function loadComp(){
  const c=CURRENT;
  wrap.innerHTML = `<div class="top"><button class="back" id="bk">‹</button><div style="flex:1"><h1 style="margin:0">${esc(c.name||"Competition")}</h1><div class="muted">${esc(fmtVariant(c.variant))}</div></div></div>
    <div class="tabs"><div class="tab ${TAB==='scores'?'on':''}" id="tScores">Enter scores</div><div class="tab ${TAB==='table'?'on':''}" id="tTable">Standings</div></div>
    <div id="body"><div class="muted">Loading fixtures…</div></div>`;
  $("bk").onclick = showList;
  $("tScores").onclick = ()=>{ TAB="scores"; loadComp(); };
  $("tTable").onclick  = ()=>{ TAB="table"; loadComp(); };

  const body = $("body");
  if(c.variant==="americano_fixed"){
    const { data, error } = await sb.rpc("get_afx_display", { p_code: c.share_code });
    if(error||!data){ body.innerHTML=`<div class="err">${esc(error?error.message:"Couldn't load this event.")}</div>`; return; }
    const afx = data.afx || data;
    if(TAB==="table") renderAfxTable(body, afx); else renderAfxScores(body, afx);
  } else {
    const { data, error } = await sb.rpc("get_host_display", { p_code: c.share_code });
    if(error||!data){ body.innerHTML=`<div class="err">${esc(error?error.message:"Couldn't load this event.")}</div>`; return; }
    // Partner names (get_host_display only returns player 1 for league teams).
    const pr = await sb.rpc("get_event_pairs", { p_code: c.share_code });
    LEAGUE_PAIRS = {}; ((pr&&pr.data)||[]).forEach(x=>LEAGUE_PAIRS[x.team_id]={n1:x.team_name,n2:x.player2_name});
    if(data.matches){
      if(TAB==="table") renderLeagueTable(body, data); else renderLeagueScores(body, data);
    } else {
      body.innerHTML = `<div class="card"><div class="muted">Scores for this format are entered in the host console. This page shows leagues and fixed Americanos.</div></div>`;
    }
  }
}

// ---------- Fixed Americano ----------
function renderAfxScores(body, afx){
  const players = {}; (afx.players||[]).forEach(p=>players[p.id]=p.name);
  const nm = id => esc(players[id] || "—");
  const matches = (afx.matches||[]).filter(m=>!m.is_final);
  const byRound = {};
  matches.forEach(m=>{ (byRound[m.round]=byRound[m.round]||[]).push(m); });
  const rounds = Object.keys(byRound).sort((a,b)=>a-b);
  let html = "";
  rounds.forEach(r=>{
    const ms = byRound[r].sort((a,b)=>String(a.court).localeCompare(String(b.court)));
    html += `<div class="card"><div class="meta">Round ${esc(r)}${ms[0].slot_time?" · "+esc(ms[0].slot_time):""}</div>`;
    ms.forEach(m=>{
      const done = m.status==="completed";
      html += `<div class="rgrp"><div class="meta">Court ${esc(m.court)}</div>
        <div class="mt" data-mid="${esc(m.id)}">
          <div class="team">${nm(m.a1_id)} &amp; ${nm(m.a2_id)}</div>
          <input class="sc" type="number" inputmode="numeric" min="0" id="a_${esc(m.id)}" value="${m.score_a!=null?esc(m.score_a):""}">
          <span class="dash">–</span>
          <input class="sc" type="number" inputmode="numeric" min="0" id="b_${esc(m.id)}" value="${m.score_b!=null?esc(m.score_b):""}">
          <div class="team b">${nm(m.b1_id)} &amp; ${nm(m.b2_id)}</div>
        </div>
        <div style="text-align:right;margin-top:4px"><button class="save ${done?'ok':''}" data-save-afx="${esc(m.id)}">${done?'✓ Saved':'Save'}</button></div>
      </div>`;
    });
    html += `</div>`;
  });
  body.innerHTML = html || `<div class="muted">No fixtures yet.</div>`;
  [...body.querySelectorAll("[data-save-afx]")].forEach(btn=>{
    btn.onclick = ()=>saveAfx(btn.getAttribute("data-save-afx"));
  });
}
async function saveAfx(mid){
  const a = parseInt($("a_"+mid).value, 10), b = parseInt($("b_"+mid).value, 10);
  if(Number.isNaN(a)||Number.isNaN(b)){ toast("Enter both scores", true); return; }
  const { error } = await sb.rpc("scorer_afx_set_result", { p_match_id: mid, p_score_a: a, p_score_b: b });
  if(error){ toast(error.message, true); return; }
  toast("Score saved");
  loadComp();
}
function renderAfxTable(body, afx){
  const st = (afx.standings||[]).slice().sort((a,b)=>(a.rk||99)-(b.rk||99));
  if(!st.length){ body.innerHTML=`<div class="muted">No standings yet — enter some scores.</div>`; return; }
  body.innerHTML = `<div class="card"><table class="stand"><thead><tr><th>#</th><th>Player</th><th class="n">P</th><th class="n">W</th><th class="n">+/−</th><th class="pts">Pts</th></tr></thead><tbody>${
    st.map((s,i)=>`<tr><td class="n">${s.rk||i+1}</td><td>${esc(s.name)}</td><td class="n">${esc(s.played||0)}</td><td class="n">${esc(s.won||0)}</td><td class="n">${(s.diff>0?"+":"")+esc(s.diff||0)}</td><td class="pts">${esc(s.points_for||0)}</td></tr>`).join("")
  }</tbody></table></div>`;
}

// ---------- Leagues ----------
function renderLeagueScores(body, d){
  const teams = {}; (d.teams||[]).forEach(t=>teams[t.id]=t.team_name);
  const leagues = d.leagues||[];
  const nm = id => esc(teams[id] || "—");
  const label = id => { const p=LEAGUE_PAIRS[id]; if(p&&p.n1) return esc(p.n1 + (p.n2 ? " & "+p.n2 : "")); return esc(teams[id] || "—"); };
  const ms = (d.matches||[]);
  const rowFor = (m, meta) => {
    const done = m.status==="completed";
    return `<div class="rgrp">${meta?`<div class="meta">${meta}</div>`:""}
        <div class="mt">
          <div class="team">${label(m.home_team_id)}</div>
          <input class="sc" type="number" inputmode="numeric" min="0" id="h_${esc(m.id)}" value="${m.home_score!=null?esc(m.home_score):""}">
          <span class="dash">–</span>
          <input class="sc" type="number" inputmode="numeric" min="0" id="v_${esc(m.id)}" value="${m.away_score!=null?esc(m.away_score):""}">
          <div class="team b">${label(m.away_team_id)}</div>
        </div>
        <div style="text-align:right;margin-top:4px"><button class="save ${done?'ok':''}" data-save-lg="${esc(m.id)}">${done?'✓ Saved':'Save'}</button></div>
      </div>`; };
  let html = "";
  // Chas Order-of-Play: order by time then court (matches the club console).
  const sched = ms.map(m=>{ const ch=CHAS_CODE_P1[teams[m.home_team_id]||""], ca=CHAS_CODE_P1[teams[m.away_team_id]||""];
    const s=(ch&&ca)?CHAS_SCHED[[ch,ca].sort().join("-")]:null; return {m,ch,s}; });
  const useSched = (CURRENT && String(CURRENT.share_code||"").toUpperCase()==="CHASBG") && sched.length>0;
  if(useSched){
    const slots={}, unsched=[]; sched.forEach(x=>{ if(x.s){ (slots[x.s.t]=slots[x.s.t]||[]).push(x); } else { unsched.push(x); } });
    Object.keys(slots).sort((a,b)=>chasMin(a)-chasMin(b)).forEach(t=>{
      const list=slots[t].sort((a2,b2)=>(a2.s.c-b2.s.c)||String(a2.ch).localeCompare(String(b2.ch)));
      html += `<h2 class="div">${esc(t)}</h2><div class="card">`;
      list.forEach(({m,ch,s})=>{ const grp=(ch||"")[0]||""; html += rowFor(m,`Court ${esc(s.c)} · Group ${esc(grp)}`); });
      html += `</div>`;
    });
    if(unsched.length){ html += `<h2 class="div">Other</h2><div class="card">`; unsched.forEach(({m})=>{ html += rowFor(m); }); html += `</div>`; }
  } else {
    const byLeague = {};
    ms.forEach(m=>{ (byLeague[m.league_id]=byLeague[m.league_id]||[]).push(m); });
    const order = leagues.length ? leagues : [{id:null,name:""}];
    order.forEach(lg=>{
      const list = byLeague[lg.id] || (lg.id===null ? ms : []);
      if(!list.length) return;
      if(leagues.length>1) html += `<h2 class="div">${esc(lg.name||("League "+(lg.league_letter||"")))}</h2>`;
      html += `<div class="card">`;
      list.forEach(m=>{ html += rowFor(m); });
      html += `</div>`;
    });
  }
  body.innerHTML = html || `<div class="muted">No fixtures yet.</div>`;
  [...body.querySelectorAll("[data-save-lg]")].forEach(btn=>{
    btn.onclick = ()=>saveLeague(btn.getAttribute("data-save-lg"));
  });
}
async function saveLeague(mid){
  const h = parseInt($("h_"+mid).value, 10), v = parseInt($("v_"+mid).value, 10);
  if(Number.isNaN(h)||Number.isNaN(v)){ toast("Enter both scores", true); return; }
  const { error } = await sb.rpc("scorer_set_league_result", { p_match_id: mid, p_home_score: h, p_away_score: v });
  if(error){ toast(error.message, true); return; }
  toast("Score saved");
  loadComp();
}
function renderLeagueTable(body, d){
  const leagues = d.leagues||[];
  const groups = {};
  (d.teams||[]).forEach(t=>{ (groups[t.league_id]=groups[t.league_id]||[]).push(t); });
  const order = leagues.length ? leagues : [{id:(d.teams||[])[0]?.league_id, name:""}];
  let html = "";
  order.forEach(lg=>{
    const ts = (groups[lg.id]||[]).slice().sort((a,b)=>(b.league_points||0)-(a.league_points||0));
    if(!ts.length) return;
    if(leagues.length>1) html += `<h2 class="div">${esc(lg.name||("League "+(lg.league_letter||"")))}</h2>`;
    html += `<div class="card"><table class="stand"><thead><tr><th>#</th><th>Team</th><th class="n">P</th><th class="n">W</th><th class="n">D</th><th class="n">L</th><th class="pts">Pts</th></tr></thead><tbody>${
      ts.map((t,i)=>`<tr><td class="n">${i+1}</td><td>${esc(t.team_name)}</td><td class="n">${esc(t.played||0)}</td><td class="n">${esc(t.won||0)}</td><td class="n">${esc(t.drawn||0)}</td><td class="n">${esc(t.lost||0)}</td><td class="pts">${esc(t.league_points||0)}</td></tr>`).join("")
    }</tbody></table></div>`;
  });
  body.innerHTML = html || `<div class="muted">No standings yet.</div>`;
}
</script>
</body>
</html>
