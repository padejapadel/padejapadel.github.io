<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payment received · Padeja</title>
<style>
  :root{--bg:#0A1624;--card:#101f31;--ink:#fff;--mut:#8AA4C0;--teal:#36d39a}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:min(92vw,440px);background:var(--card);border:1px solid rgba(255,255,255,.1);
    border-radius:18px;padding:34px 28px;text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.4)}
  .tick{width:66px;height:66px;border-radius:50%;background:rgba(54,211,154,.15);
    display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:34px;color:var(--teal)}
  h1{font-size:22px;margin:0 0 8px} p{color:var(--mut);font-size:15px;line-height:1.5;margin:0 0 6px}
  .brand{margin-top:22px;font-weight:800;letter-spacing:.5px} .brand span{color:#4FA3E3}
</style></head>
<body>
  <div class="card">
    <div class="tick">&#10003;</div>
    <h1>Payment received</h1>
    <p>Thanks &mdash; you're all set. Your entry fee has been paid and your place in the competition is confirmed.</p>
    <p>You can close this page. The organiser will be in touch with fixtures and times.</p>
    <div class="brand">Pade<span>ja</span></div>
  </div>
</body></html>
