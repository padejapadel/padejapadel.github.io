<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restarting Stripe setup…</title>
<style>
  :root{ --bg:#0D1B2E; --card:#122238; --line:#1E3050; --teal:#3BC8F5; --gold:#F0A93B; --mut:#8AA4C0; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg); color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .wrap{ min-height:100%; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card{ width:100%; max-width:380px; background:var(--card); border:1px solid var(--line);
    border-radius:16px; padding:28px 24px; text-align:center; }
  .mark{ font-weight:800; letter-spacing:3px; color:var(--teal); font-size:15px; text-transform:uppercase; }
  h1{ font-size:22px; margin:14px 0 6px; }
  p{ color:var(--mut); font-size:15px; line-height:1.5; margin:6px 0; }
  .btn{ display:inline-block; margin-top:18px; padding:13px 22px; border-radius:12px;
    background:var(--teal); color:var(--bg); font-weight:700; text-decoration:none; font-size:16px; }
  .tiny{ font-size:13px; color:var(--mut); margin-top:14px; }
  #fallback{ display:none; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="mark">Padeja</div>
      <h1>Let's try that again</h1>
      <p>Taking you back to the app to restart setup…</p>
      <div id="fallback">
        <a id="btn" class="btn" href="#">Return to Padeja</a>
        <p class="tiny">If nothing happens, tap the button above — or reopen the Padeja app and start the payment setup again.</p>
      </div>
    </div>
  </div>
<script>
  // ?app=feed -> padejafeed://stripe-refresh ; scorer / absent -> padeja://stripe-refresh
  (function () {
    var app = (new URLSearchParams(location.search).get("app") || "scorer").toLowerCase();
    var scheme = app === "feed" ? "padejafeed" : "padeja";
    var target = scheme + "://stripe-refresh";
    document.getElementById("btn").setAttribute("href", target);
    try { window.location.href = target; } catch (e) {}
    setTimeout(function () { document.getElementById("fallback").style.display = "block"; }, 1200);
  })();
</script>
</body>
</html>
