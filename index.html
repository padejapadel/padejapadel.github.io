<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Padeja Live Score</title>
  <script>
    // Password-reset catcher. Supabase sends recovery links back to this page's
    // root with the reset token in the URL. Hand off to the reset page first.
    (function () {
      var h = window.location.hash || '';
      var q = window.location.search || '';
      var authCode = '';
      try { authCode = new URLSearchParams(q).get('code') || ''; } catch (e) {}
      var looksLikeAuthCode = authCode.indexOf('pkce_') === 0 || authCode.length > 20;
      var isRecovery = /type=recovery/.test(h) || /type=recovery/.test(q) ||
                       /access_token=/.test(h) || looksLikeAuthCode;
      if (isRecovery && window.location.pathname.indexOf('reset-password') === -1) {
        window.location.replace('/reset-password.html' + q + h);
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --black:#0a0c10;
      --metal-1:#1c2026;
      --metal-2:#0e1015;
      --metal-3:#242a32;
      --line:rgba(255,255,255,0.10);
      --gold:#F5B83D;
      --gold-dim:rgba(245,184,61,0.30);
      --teal:#00D4AA;
      --teal-bright:#38efd0;
      --coral:#FF6B6B;
      --coral-bright:#ff9a9a;
      --live:#FF3B4E;
      --text:#F5F8FB;
      --muted:#9aa6b4;
      --muted-2:#6b7686;
      --fd:'Saira Condensed',-apple-system,BlinkMacSystemFont,sans-serif;
      --fu:'Barlow',-apple-system,BlinkMacSystemFont,sans-serif;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{min-height:100%;}
    body{
      background:var(--black);
      background-image:
        radial-gradient(130% 90% at 50% -20%, rgba(245,184,61,0.06), transparent 60%),
        radial-gradient(120% 90% at 10% 110%, rgba(0,212,170,0.05), transparent 55%),
        radial-gradient(120% 90% at 95% 110%, rgba(255,107,107,0.05), transparent 55%);
      color:var(--text);
      font-family:var(--fu);
      min-height:100vh;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:22px 16px;
      -webkit-font-smoothing:antialiased;
      overflow-x:hidden;
    }

    /* ── Scoreboard shell ── */
    .board{
      width:100%;max-width:440px;
      background:linear-gradient(180deg,var(--metal-1),var(--metal-2));
      border:1px solid var(--gold-dim);
      border-radius:18px;
      overflow:hidden;
      position:relative;
      box-shadow:0 34px 70px -32px rgba(0,0,0,0.85), inset 0 1px 0 rgba(255,255,255,0.07);
    }
    .board::before{
      content:"";position:absolute;inset:0;pointer-events:none;
      background:repeating-linear-gradient(118deg, rgba(255,255,255,0.022) 0 2px, transparent 2px 7px);
      mix-blend-mode:overlay;
    }

    /* top + bottom sponsor-style bands */
    .band{
      display:flex;align-items:center;gap:10px;
      padding:11px 16px;background:rgba(0,0,0,0.35);position:relative;
    }
    .band.top{border-bottom:2px solid var(--gold);}
    .band.bottom{border-top:2px solid var(--gold);justify-content:space-between;}
    .masthead{display:flex;justify-content:center;margin-bottom:14px;}
    .logo-emblem{height:74px;width:auto;display:block;filter:drop-shadow(0 8px 22px rgba(0,0,0,0.5));}
    .band .spacer{flex:1;}
    .band-mid{display:flex;flex-direction:column;align-items:center;line-height:1.15;text-align:center;}
    .band-mid .ctx-main{font-family:var(--fd);font-weight:700;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--text);}
    .band-mid .ctx-sub{font-family:var(--fu);font-weight:500;font-size:10.5px;letter-spacing:.6px;color:var(--muted);}
    .live-pill{display:inline-flex;align-items:center;gap:7px;background:rgba(255,59,78,0.12);border:1px solid rgba(255,59,78,0.4);border-radius:999px;padding:4px 11px;flex:0 0 auto;}
    .live-dot{width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 1.6s infinite;}
    .live-txt{font-family:var(--fd);font-weight:700;font-size:11px;letter-spacing:2.5px;color:#ff6674;}
    @keyframes pulse{0%,100%{opacity:1}55%{opacity:.35}}

    .code-tag{font-family:var(--fd);font-weight:700;font-size:12px;letter-spacing:3px;color:var(--muted);}
    .made{font-family:var(--fu);font-weight:600;font-size:10px;letter-spacing:2px;color:var(--muted-2);text-transform:uppercase;}

    /* ── Team rows ── */
    .team{
      display:flex;align-items:center;gap:12px;
      padding:16px 16px;position:relative;
    }
    .team + .team{border-top:1px solid var(--line);}
    .bar{width:5px;align-self:stretch;border-radius:3px;flex:0 0 auto;min-height:44px;}
    .teamA .bar{background:linear-gradient(var(--teal),#0a8f77);box-shadow:0 0 14px rgba(0,212,170,0.55);}
    .teamB .bar{background:linear-gradient(var(--coral),#b23f3f);box-shadow:0 0 14px rgba(255,107,107,0.5);}

    .names{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
    .pname{
      font-family:var(--fd);font-weight:700;
      font-size:clamp(17px,5.2vw,22px);line-height:1.04;letter-spacing:.5px;
      text-transform:uppercase;color:var(--text);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .flag{font-size:0.8em;margin-right:8px;line-height:1;vertical-align:baseline;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.5));}
    .serve-row{display:flex;align-items:center;gap:6px;margin-top:3px;height:14px;}
    .serve{width:13px;height:13px;opacity:0;}
    .serve svg{display:block;width:13px;height:13px;}
    .team.serving .serve{opacity:1;animation:serveB 1.7s ease-in-out infinite;}
    @keyframes serveB{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
    .serve-label{font-family:var(--fu);font-weight:700;font-size:9px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;opacity:0;}
    .team.serving .serve-label{opacity:1;}

    /* point box (like the reference AD box) */
    .ptbox{
      flex:0 0 auto;min-width:58px;height:56px;padding:0 10px;
      display:flex;align-items:center;justify-content:center;
      background:linear-gradient(180deg,#f3f5f7,#d9dde2);
      border-radius:10px;box-shadow:inset 0 -2px 4px rgba(0,0,0,0.18);
    }
    .ptbox .pt{font-family:var(--fd);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:0;}
    .teamA .ptbox .pt{color:#0b8f78;}
    .teamB .ptbox .pt{color:#c04a4a;}
    .ptbox.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1);}
    @keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.14)}100%{transform:scale(1)}}

    /* set columns */
    .sets{display:flex;gap:7px;flex:0 0 auto;}
    .setcell{
      width:30px;height:56px;display:flex;align-items:center;justify-content:center;
      font-family:var(--fd);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;
      color:var(--muted);border-radius:8px;background:rgba(255,255,255,0.03);
      border:1px solid rgba(255,255,255,0.06);
    }
    .setcell.won-a{color:var(--teal);}
    .setcell.won-b{color:var(--coral);}
    .setcell.current{border-color:var(--gold-dim);background:rgba(245,184,61,0.08);color:var(--text);box-shadow:0 0 12px rgba(245,184,61,0.18);}

    /* status line */
    .status{
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:10px 16px;background:rgba(0,0,0,0.25);border-top:1px solid var(--line);
    }
    .status-set{font-family:var(--fd);font-weight:700;font-size:12.5px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;font-variant-numeric:tabular-nums;}
    .status-set b{color:var(--text);}
    .chip{font-family:var(--fd);font-weight:800;font-size:11px;letter-spacing:2px;padding:4px 11px;border-radius:999px;text-transform:uppercase;white-space:nowrap;}
    .chip-gold{color:#1a1204;background:var(--gold);box-shadow:0 0 16px rgba(245,184,61,0.4);}
    .chip-live{color:var(--gold);background:rgba(245,184,61,0.13);border:1px solid var(--gold-dim);}
    .chip-teal{color:var(--teal);background:rgba(0,212,170,0.13);border:1px solid rgba(0,212,170,0.35);}
    .chip-coral{color:var(--coral);background:rgba(255,107,107,0.13);border:1px solid rgba(255,107,107,0.35);}

    /* ── Winner ── */
    .winner{padding:40px 24px 34px;text-align:center;position:relative;}
    .winner::before{content:"";position:absolute;inset:-30% 25% auto 25%;height:60%;background:radial-gradient(closest-side,rgba(245,184,61,0.35),transparent);filter:blur(8px);}
    .trophy{font-size:50px;margin-bottom:12px;position:relative;filter:drop-shadow(0 6px 18px rgba(245,184,61,0.5));}
    .w-label{font-family:var(--fd);font-weight:700;font-size:12px;letter-spacing:5px;color:var(--muted);margin-bottom:8px;position:relative;}
    .w-name{font-family:var(--fd);font-weight:800;font-size:clamp(22px,7vw,34px);line-height:1.05;color:var(--gold);text-transform:uppercase;letter-spacing:.5px;position:relative;text-wrap:balance;}
    .w-sets{margin-top:16px;display:inline-flex;gap:8px;position:relative;}
    .w-sets .setcell{color:var(--text);width:44px;}

    /* ── Messages ── */
    .message{padding:44px 22px;text-align:center;color:var(--muted);}
    .message .em{font-size:38px;margin-bottom:12px;}
    .message h2{font-family:var(--fd);font-weight:700;font-size:22px;letter-spacing:.5px;color:var(--text);margin-bottom:6px;text-transform:uppercase;}
    .message p{font-family:var(--fu);font-size:14px;line-height:1.5;max-width:300px;margin:0 auto;}
    .loading{padding:40px;text-align:center;color:var(--muted-2);font-family:var(--fd);letter-spacing:2px;text-transform:uppercase;}

    /* ── Controls ── */
    .btn-row{display:flex;gap:10px;margin-top:18px;align-items:center;justify-content:center;flex-wrap:wrap;}
    .btn{
      font-family:var(--fu);font-weight:600;font-size:13px;letter-spacing:.3px;
      background:rgba(255,255,255,0.03);border:1px solid var(--line);border-radius:11px;
      padding:10px 16px;color:var(--muted);cursor:pointer;
      transition:border-color .15s,color .15s,background .15s;
    }
    .btn:hover{border-color:var(--gold);color:var(--gold);}
    .btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
    .btn.on{border-color:rgba(0,212,170,0.5);color:var(--teal);background:rgba(0,212,170,0.08);}
    .footer{margin-top:16px;font-family:var(--fu);font-size:11px;letter-spacing:.5px;color:var(--muted-2);text-align:center;}

    @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}

    /* ── Clubhouse TV / tablet ── */
    @media (min-width:760px){
      body{padding:44px;}
      .board{max-width:1000px;border-radius:26px;}
      .band{padding:18px 30px;}
      .band.top{border-bottom-width:3px;}
      .band.bottom{border-top-width:3px;}
      .logo-emblem{height:118px;}
      .masthead{margin-bottom:22px;}
      .band-mid .ctx-main{font-size:20px;letter-spacing:3px;}
      .band-mid .ctx-sub{font-size:15px;}
      .live-pill{padding:7px 18px;gap:9px;}
      .live-dot{width:11px;height:11px;}
      .live-txt{font-size:17px;letter-spacing:3px;}
      .code-tag{font-size:18px;}
      .made{font-size:14px;}
      .team{padding:30px 30px;gap:24px;}
      .bar{width:8px;min-height:96px;}
      .pname{font-size:clamp(30px,4.4vw,48px);}
      .serve,.serve svg{width:24px;height:24px;}
      .serve-label{font-size:14px;}
      .ptbox{min-width:120px;height:112px;border-radius:16px;}
      .ptbox .pt{font-size:70px;}
      .sets{gap:14px;}
      .setcell{width:62px;height:112px;font-size:58px;border-radius:12px;}
      .status{padding:16px 30px;}
      .status-set{font-size:20px;letter-spacing:2px;}
      .chip{font-size:17px;padding:7px 18px;letter-spacing:3px;}
      .winner{padding:70px 40px;}
      .trophy{font-size:96px;}
      .w-label{font-size:18px;letter-spacing:8px;}
      .w-sets .setcell{width:88px;height:96px;font-size:52px;}
      .btn{font-size:17px;padding:15px 24px;}
      .footer{font-size:14px;}
    }
  </style>
</head>

    function escapeHtml(s){
      return String(s == null ? "" : s)
        .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
    }
    // Split a team name ("A & B") into its player lines.
    function playerLines(name){
      const parts = String(name || "").split(/\s*&\s*/).filter(Boolean);
      return parts.length ? parts : [name || "Team"];
    }

    // ── SPEECH ──
    let lastAnnouncementKey = null;
    let isMuted = true;
    function toggleMute() {
      isMuted = !isMuted;
      const btn = document.getElementById('muteBtn');
      if (isMuted) {
        btn.textContent = '🔇 Enable announcements'; btn.classList.remove('on');
        if (window.AndroidTTS) AndroidTTS.stop();
        if (window.speechSynthesis) window.speechSynthesis.cancel();
      } else {
        btn.textContent = '🔊 Announcements on'; btn.classList.add('on');
        speak('Announcements enabled');
      }
    }
    function speak(text) {
      if (isMuted) return;
      if (window.AndroidTTS) { AndroidTTS.speak(text); }
      else if (window.speechSynthesis) {
        window.speechSynthesis.cancel();
        const utt = new SpeechSynthesisUtterance(text);
        utt.lang = 'en-GB'; utt.rate = 0.9; utt.pitch = 1.0; utt.volume = 1.0;
        window.speechSynthesis.speak(utt);
      }
    }
    function pointToWords(p){
      const map = { "0":"Love","15":"Fifteen","30":"Thirty","40":"Forty","Ad":"Advantage","–":"Deuce" };
      return map[p] || p;
    }
    function buildAnnouncement(match, prevMatch){
      if (!prevMatch) return null;
      const prevSets = JSON.parse(prevMatch.sets_json || "[]");
      const currSets = JSON.parse(match.sets_json || "[]");
      if (match.match_state === "finished" && prevMatch.match_state !== "finished") {
        const w = match.match_winner === "Team A" ? match.team_a : match.team_b;
        return `Game, set and match. ${w}!`;
      }
      const pGA = prevMatch.game_a||0, pGB = prevMatch.game_b||0, cGA = match.game_a||0, cGB = match.game_b||0;
      if (currSets.length > prevSets.length) {
        const cs = currSets[prevSets.length - 1] || currSets[currSets.length - 2];
        if (cs) { return match.serving_team === "B" ? `Set. ${cs.b} games to ${cs.a}` : `Set. ${cs.a} games to ${cs.b}`; }
        return "Set";
      }
      if (cGA !== pGA || cGB !== pGB) {
        return match.serving_team === "B" ? `Game. ${cGB} games to ${cGA}` : `Game. ${cGA} games to ${cGB}`;
      }
      const pPA = prevMatch.point_display_a||"0", pPB = prevMatch.point_display_b||"0";
      const cPA = match.point_display_a||"0", cPB = match.point_display_b||"0";
      const pD = prevMatch.is_deuce, cD = match.is_deuce, pS = prevMatch.is_star_point, cS = match.is_star_point;
      if (!(cPA !== pPA || cPB !== pPB || cD !== pD)) return null;
      if (cD && !pD) return "Deuce";
      if (cS && !pS) return "Star point";
      if (match.is_match_point) { const l = match.serving_team==="B"?cPB:cPA, t = match.serving_team==="B"?cPA:cPB; return `Match point. ${pointToWords(l)}, ${pointToWords(t)}`; }
      if (match.is_set_point) { const l = match.serving_team==="B"?cPB:cPA, t = match.serving_team==="B"?cPA:cPB; return `Set point. ${pointToWords(l)}, ${pointToWords(t)}`; }
      if (cPA === "Ad" && !cD) return `Advantage ${match.team_a}`;
      if (cPB === "Ad" && !cD) return `Advantage ${match.team_b}`;
      if (cD) return "Deuce";
      return match.serving_team === "B" ? `${pointToWords(cPB)}, ${pointToWords(cPA)}` : `${pointToWords(cPA)}, ${pointToWords(cPB)}`;
    }

    // Country flag emoji from a 2-letter ISO code (same mapping the scorer uses).
    function flagEmoji(code){
      if(!code) return "";
      const c = String(code).trim().toUpperCase();
      if(!/^[A-Z]{2}$/.test(c)) return "";
      return String.fromCodePoint(...[...c].map(ch => 127397 + ch.charCodeAt(0)));
    }
    // Flags for a team's players, in pick (pos) order, from players_json.
    function playerFlags(match, teamKey){
      let arr = [];
      try { arr = JSON.parse(match.players_json || "[]"); } catch(e) {}
      return arr.filter(p => String(p.team||"").toLowerCase() === teamKey)
                .sort((a,b) => (a.pos||0) - (b.pos||0))
                .map(p => flagEmoji(p.nat));
    }

    // ── RENDER ──
    const BALL = '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#F5B83D"/><path d="M4 6c4 2 4 10 0 12M20 6c-4 2-4 10 0 12" stroke="#7a5a12" stroke-width="1.5" fill="none"/></svg>';

    function contextBand(match){
      const main = [];
      if (match.match_type) main.push(escapeHtml(match.match_type));
      if (match.court_number != null && match.court_number !== "") main.push("Court " + escapeHtml(match.court_number));
      const sub = match.club_name ? escapeHtml(match.club_name) : "";
      const mid = (main.length || sub)
        ? `<div class="band-mid">${main.length ? `<span class="ctx-main">${main.join(" · ")}</span>` : ""}${sub ? `<span class="ctx-sub">${sub}</span>` : ""}</div>`
        : `<div class="band-mid"><span class="ctx-main">Live Match</span></div>`;
      return `<div class="band top">${mid}<div class="spacer"></div><div class="live-pill"><span class="live-dot"></span><span class="live-txt">LIVE</span></div></div>`;
    }

    function namesBlock(name, flags){
      flags = flags || [];
      const lines = playerLines(name).map((n, i) => {
        const f = flags[i] ? `<span class="flag">${flags[i]}</span>` : "";
        return `<div class="pname">${f}${escapeHtml(n)}</div>`;
      }).join("");
      return `<div class="names">${lines}<div class="serve-row"><span class="serve">${BALL}</span><span class="serve-label">Serving</span></div></div>`;
    }

    function setCells(sets, teamKey, currentIdx){
      return sets.map((s, i) => {
        const val = teamKey === "a" ? s.a : s.b;
        let cls = "setcell";
        if (!s.completed && i === currentIdx) cls += " current";
        if (s.completed && s.a > s.b && teamKey === "a") cls += " won-a";
        if (s.completed && s.b > s.a && teamKey === "b") cls += " won-b";
        return `<div class="${cls}">${val}</div>`;
      }).join("");
    }

    function stateChip(match, isDeuce, advA, advB){
      if (match.is_match_point) return '<span class="chip chip-gold">Match Point</span>';
      if (match.is_star_point)  return '<span class="chip chip-gold">★ Star Point</span>';
      if (match.is_set_point)   return '<span class="chip chip-live">Set Point</span>';
      if (match.is_tiebreak)    return '<span class="chip chip-live">Tie-break</span>';
      if (isDeuce)              return '<span class="chip chip-live">Deuce</span>';
      if (advA)                 return '<span class="chip chip-teal">Advantage</span>';
      if (advB)                 return '<span class="chip chip-coral">Advantage</span>';
      return '';
    }

    let prevPts = { a:null, b:null };

    function renderLive(match){
      let sets = [];
      try { sets = JSON.parse(match.sets_json || "[]"); } catch(e) {}
      if (!sets.length) sets = [{ a: match.game_a||0, b: match.game_b||0, completed:false }];
      const currentIdx = sets.length - 1;
      const setCount = sets.length;

      const isDeuce = match.is_deuce;
      const advA = !isDeuce && match.point_display_a === "Ad";
      const advB = !isDeuce && match.point_display_b === "Ad";
      const rawA = match.point_display_a || "0", rawB = match.point_display_b || "0";
      const scoreA = isDeuce ? "40" : (rawA === "Ad" ? "AD" : rawA);
      const scoreB = isDeuce ? "40" : (rawB === "Ad" ? "AD" : rawB);
      const popA = (prevPts.a !== null && prevPts.a !== scoreA) ? " pop" : "";
      const popB = (prevPts.b !== null && prevPts.b !== scoreB) ? " pop" : "";
      prevPts = { a: scoreA, b: scoreB };

      const servingA = match.serving_team === "A", servingB = match.serving_team === "B";
      const flagsA = playerFlags(match, "a"), flagsB = playerFlags(match, "b");

      document.getElementById("content").innerHTML = `
        ${contextBand(match)}
        <div class="team teamA${servingA ? ' serving' : ''}">
          <div class="bar"></div>
          ${namesBlock(match.team_a || "Team A", flagsA)}
          <div class="ptbox${popA}"><span class="pt">${scoreA}</span></div>
          <div class="sets">${setCells(sets, "a", currentIdx)}</div>
        </div>
        <div class="team teamB${servingB ? ' serving' : ''}">
          <div class="bar"></div>
          ${namesBlock(match.team_b || "Team B", flagsB)}
          <div class="ptbox${popB}"><span class="pt">${scoreB}</span></div>
          <div class="sets">${setCells(sets, "b", currentIdx)}</div>
        </div>
        <div class="status">
          <span class="status-set">Set ${setCount} · Games <b>${match.game_a || 0}–${match.game_b || 0}</b></span>
          ${stateChip(match, isDeuce, advA, advB)}
        </div>
        <div class="band bottom">
          <span class="code-tag">${code ? escapeHtml(code) : ""}</span>
          <span class="made">Powered by Padeja</span>
        </div>`;
    }

    function renderFinished(match){
      const winner = match.match_winner === "Team A" ? match.team_a : match.team_b;
      let sets = [];
      try { sets = JSON.parse(match.sets_json || "[]"); } catch(e) {}
      const setsLine = sets.length
        ? `<div class="w-sets">${sets.map(s => `<div class="setcell">${s.a}–${s.b}</div>`).join("")}</div>` : "";
      const wKey = match.match_winner === "Team A" ? "a" : "b";
      const wflags = playerFlags(match, wKey);
      const wlines = playerLines(winner).map((n,i) => `<div>${wflags[i] ? `<span class="flag">${wflags[i]}</span>` : ""}${escapeHtml(n)}</div>`).join("");
      document.getElementById("content").innerHTML = `
        ${contextBand(match)}
        <div class="winner">
          <div class="trophy">🏆</div>
          <div class="w-label">MATCH WINNER</div>
          <div class="w-name">${wlines}</div>
          ${setsLine}
        </div>
        <div class="band bottom">
          <span class="code-tag">${code ? escapeHtml(code) : ""}</span>
          <span class="made">Powered by Padeja</span>
        </div>`;
    }

    function renderMessage(emoji, title, text){
      document.getElementById("content").innerHTML = `
        <div class="band top"><div class="band-mid"><span class="ctx-main">Live Score</span></div><div class="spacer"></div></div>
        <div class="message"><div class="em">${emoji}</div><h2>${escapeHtml(title)}</h2><p>${escapeHtml(text)}</p></div>`;
    }

    // ── FETCH LOOP ──
    let prevMatch = null;
    async function fetchScore(){
      if (!code) { renderMessage("📡","No match code","Open the link shared from the Padeja app to watch a live match."); return; }
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/live_matches?match_code=eq.${code}&select=*`, {
          headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
        });
        const data = await res.json();
        const match = data && data.length > 0 ? data[0] : null;
        if (!match) { renderMessage("🔍","Match not found","This match code doesn’t exist or the match has ended."); prevMatch = null; return; }
        const stateKey = `${match.point_display_a}|${match.point_display_b}|${match.game_a}|${match.game_b}|${match.sets_json}|${match.match_state}|${match.is_deuce}|${match.is_star_point}`;
        if (stateKey !== lastAnnouncementKey) {
          const a = buildAnnouncement(match, prevMatch);
          if (a) speak(a);
          lastAnnouncementKey = stateKey;
        }
        prevMatch = match;
        if (match.match_state === "finished") renderFinished(match); else renderLive(match);
      } catch(e) {
        renderMessage("⚠️","Connection lost","Couldn’t reach the match just now — retrying automatically.");
      }
    }
    fetchScore();
    setInterval(fetchScore, 3000);
  </script>
</body>
</html>
