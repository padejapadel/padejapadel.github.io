<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Padeja Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0D1B2A; --panel:#12243a; --panel2:#0f1e30;
    --teal:#00D4AA; --sky:#00A8FF; --coral:#FF6B6B; --gold:#FFD54A;
    --ink:#eaf2ff; --dim:#8ea6c4; --line:rgba(255,255,255,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:var(--navy); color:var(--ink);
    font-family:'Hanken Grotesk',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* Stage: video + side panel on wide screens, stacked on phones. */
  #stage{display:grid;grid-template-columns:1fr 400px;grid-template-rows:1fr;gap:14px;padding:14px;height:100vh}
  #videoWrap{position:relative;background:#000;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
  #videoWrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  #videoWrap .novideo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
         color:var(--dim);font-size:15px;text-align:center;padding:24px}
  #side{display:flex;flex-direction:column;gap:14px;min-height:0}

  /* Scores-only mode (no live stream) — side panel fills the screen. */
  #stage.solo{grid-template-columns:1fr}
  #stage.solo #videoWrap{display:none}
  #stage.solo #side{max-width:820px;width:100%;margin:0 auto}

  .brandbar{display:flex;align-items:center;justify-content:space-between;padding:2px 2px}
  .brandbar .logo{height:26px;width:auto;display:block}
  .brandbar .tag{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--dim)}

  .card2{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
  .meta{display:flex;gap:10px;align-items:center;color:var(--dim);font-size:12px;margin-bottom:6px}
  .badge{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:11px;letter-spacing:1px;
         padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--dim)}
  .badge.live{color:#fff;background:linear-gradient(90deg,#ff3b3b,#ff6b6b)}
  .badge.hot{color:#04121f;background:var(--gold)}
  .dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  .team{display:grid;grid-template-columns:14px 1fr auto;align-items:center;gap:10px;padding:10px 4px}
  .team + .team{border-top:1px solid var(--line)}
  .serve{width:10px;height:10px;border-radius:50%;background:transparent}
  .serve.on{background:var(--gold);box-shadow:0 0 10px var(--gold)}
  .tname{font-weight:800;font-size:clamp(16px,1.8vw,20px);line-height:1.15}
  .tsub{color:var(--dim);font-size:12px;font-weight:600}
  .scoreblock{display:flex;align-items:center;gap:clamp(8px,1vw,16px)}
  .setcol{font-variant-numeric:tabular-nums;font-weight:800;font-size:clamp(16px,1.8vw,22px);color:var(--dim);min-width:16px;text-align:center}
  .setcol.win{color:var(--ink)}
  .games{font-variant-numeric:tabular-nums;font-weight:900;font-size:clamp(20px,2.4vw,30px);min-width:26px;text-align:center}
  .pts{font-variant-numeric:tabular-nums;font-weight:900;font-size:clamp(20px,2.6vw,32px);color:var(--teal);
       min-width:44px;text-align:center;background:rgba(0,212,170,.1);border-radius:10px;padding:2px 4px}
  .winner{color:var(--gold)}

  .statshead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .statshead h3{margin:0;font-size:12px;letter-spacing:2px;color:var(--dim);font-weight:800}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th,td{padding:8px 6px;text-align:center;font-size:13px}
  th{color:var(--dim);font-size:10px;letter-spacing:1px;font-weight:800;border-bottom:1px solid var(--line)}
  td.pl{text-align:left;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
  tr.teamA td.pl{color:var(--teal)} tr.teamB td.pl{color:var(--coral)}
  td.big{font-weight:900;font-size:15px}
  .nostats{color:var(--dim);font-size:13px;padding:14px 4px;text-align:center;line-height:1.5}
  .foot{color:var(--dim);font-size:11px;text-align:center;margin-top:8px}
  .foot img{height:14px;vertical-align:-2px;opacity:.85}

  @media (max-width:900px){
    #stage{grid-template-columns:1fr;grid-template-rows:auto auto;height:auto;min-height:100vh;gap:12px;padding:12px}
    #videoWrap{aspect-ratio:16/9;height:auto}
    #side{min-height:0}
    .card2{padding:14px}
  }
</style>
</head>
<body>
  <div id="stage" class="solo">
    <div id="videoWrap"><div class="novideo" id="novideo">Waiting for the stream…</div></div>

    <div id="side">
      <div class="brandbar">
        <img class="logo" src="padeja_logo_horizontal_light.svg" alt="Padeja">
        <span class="tag">LIVE</span>
      </div>

      <!-- score -->
      <div class="card2" id="scorecard">
        <div class="meta">
          <span class="badge live" id="stateBadge"><span class="dot"></span>LIVE</span>
          <span id="venue"></span>
        </div>
        <div id="teams">
          <div class="nostats">Waiting for the match to appear…</div>
        </div>
      </div>

      <!-- stats -->
      <div class="card2" id="statscard" style="flex:1;min-height:0;overflow:auto">
        <div class="statshead"><h3>LIVE PLAYER STATS</h3><span class="badge" id="statsMode">tally</span></div>
        <div id="statsBody"><div class="nostats">Live stats appear when the match is scored in detailed-stats mode.</div></div>
        <div class="foot">Powered by <img src="padeja_logo_horizontal_light.svg" alt="Padeja"></div>
      </div>
    </div>
  </div>

<script>
const SB  = "https://odrckirnjavfptlfygbo.supabase.co";
const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9kcmNraXJuamF2ZnB0bGZ5Z2JvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1MzY3MzQsImV4cCI6MjA5NTExMjczNH0.rjoAQhEaTw6Sp-nGrQmYYvLdVKD7ewrKwG1PmMbyYgo";

const $ = s => document.querySelector(s);
let CODE = null, YT = null, TIMER = null, currentEmbed = null;

function readParams(){
  const p = new URLSearchParams(location.search);
  return {
    code: (p.get('code')||'').trim().toUpperCase(),
    yt:   (p.get('yt')||p.get('youtube')||p.get('video')||'').trim()
  };
}

/* ---------- Video link -> YouTube embed ---------- */
function ytEmbed(u){
  if(!u) return null;
  u = u.trim();
  let id = null, m;
  if(/^[A-Za-z0-9_-]{11}$/.test(u)) id = u;
  if(!id && (m=u.match(/[?&]v=([A-Za-z0-9_-]{11})/))) id=m[1];
  if(!id && (m=u.match(/youtu\.be\/([A-Za-z0-9_-]{11})/))) id=m[1];
  if(!id && (m=u.match(/\/live\/([A-Za-z0-9_-]{11})/)))   id=m[1];
  if(!id && (m=u.match(/\/embed\/([A-Za-z0-9_-]{11})/)))  id=m[1];
  if(!id && (m=u.match(/\/shorts\/([A-Za-z0-9_-]{11})/))) id=m[1];
  if(!id) return null;
  return `https://www.youtube.com/embed/${id}?autoplay=1&mute=1&rel=0&playsinline=1`;
}
function isFacebookUrl(u){ return /(?:^|\/\/|\.)(facebook\.com|fb\.watch|fb\.me)\b/i.test(u||''); }
function fbEmbed(u){
  if(!u || !isFacebookUrl(u)) return null;
  return `https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(u)}&show_text=false&autoplay=true&mute=1&width=1280`;
}
function videoEmbed(u){ if(!u) return null; return isFacebookUrl(u) ? fbEmbed(u) : ytEmbed(u); }

/* ---------- names ---------- */
function splitPair(s){
  const parts = String(s||'').split(/\s*&\s*| and /i).map(x=>x.trim()).filter(Boolean);
  return [parts[0]||'Player 1', parts[1]||'Player 2'];
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function j(v,fb){ if(v==null) return fb; if(typeof v!=='string') return v; try{return JSON.parse(v);}catch(e){return fb;} }

/* ---------- data ---------- */
async function fetchRow(){
  const url = `${SB}/rest/v1/live_matches?match_code=eq.${encodeURIComponent(CODE)}&select=*`;
  const r = await fetch(url,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const rows = await r.json();
  return rows && rows[0] ? rows[0] : null;
}
// The court's current camera stream (auto — no manual link needed).
async function fetchStreamEmbed(court){
  if(!court) return null;
  try{
    const r = await fetch(`${SB}/rest/v1/court_streams?court_number=eq.${court}&select=embed_url,status`,
      {headers:{apikey:KEY,Authorization:'Bearer '+KEY}});
    const rows = await r.json();
    const row = rows && rows[0];
    if(row && row.embed_url && row.status !== 'none'){ return ytEmbed(row.embed_url) || row.embed_url; }
  }catch(e){}
  return null;
}

/* ---------- video ---------- */
function setVideo(embed){
  const vw = $('#videoWrap');
  if(!embed){
    if(currentEmbed !== null){ vw.querySelectorAll('iframe').forEach(f=>f.remove()); currentEmbed = null; }
    $('#stage').classList.add('solo');
    $('#novideo').style.display = 'flex';
    return;
  }
  $('#stage').classList.remove('solo');
  if(embed === currentEmbed) return;   // same stream already playing — don't reload
  currentEmbed = embed;
  vw.querySelectorAll('iframe').forEach(f=>f.remove());
  $('#novideo').style.display = 'none';
  const f = document.createElement('iframe');
  f.src = embed;
  f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
  f.allowFullscreen = true;
  f.setAttribute('playsinline','');
  vw.appendChild(f);
}

/* ---------- score + stats ---------- */
function render(row){
  if(!row){ $('#teams').innerHTML = '<div class="nostats">No live match for code <b>'+esc(CODE)+'</b> yet. It appears as soon as scoring starts.</div>'; return; }

  const [a1,a2] = splitPair(row.team_a);
  const [b1,b2] = splitPair(row.team_b);
  const sets = j(row.sets_json,[]) || [];
  let sA=0,sB=0;
  sets.forEach(s=>{ if(s && s.completed){ if((+s.a)>(+s.b)) sA++; else if((+s.b)>(+s.a)) sB++; }});
  const setHist = sets.map(s=>`${s.a}–${s.b}`).join('  ');

  const state = String(row.match_state||'').toLowerCase().replace(/_/g,'');
  const finished = state==='finished';
  const winner = String(row.match_winner||'').toLowerCase();
  const aWon = finished && (winner.includes('a')&&!winner.includes('b'));
  const bWon = finished && (winner.includes('b')&&!winner.includes('a'));

  const st = String(row.serving_team||'').toLowerCase();
  const servA = st==='a' || st==='team a' || st==='teama';
  const servB = st==='b' || st==='team b' || st==='teamb';

  const badge = $('#stateBadge');
  if(finished){ badge.className='badge hot'; badge.textContent='MATCH FINISHED'; }
  else if(row.is_match_point){ badge.className='badge hot'; badge.textContent='MATCH POINT'; }
  else if(row.is_set_point){ badge.className='badge hot'; badge.textContent='SET POINT'; }
  else if(row.is_tiebreak){ badge.className='badge hot'; badge.textContent='TIE-BREAK'; }
  else { badge.className='badge live'; badge.innerHTML='<span class="dot"></span>LIVE'; }

  const venue = [row.club_name, row.court_number?('Court '+row.court_number):''].filter(Boolean).join(' · ');
  $('#venue').textContent = venue;

  function teamRow(name, sub, serving, setsWon, games, pts, won){
    return `<div class="team">
      <span class="serve ${serving?'on':''}"></span>
      <div><div class="tname ${won?'winner':''}">${esc(name)}</div>${sub?`<div class="tsub">${esc(sub)}</div>`:''}</div>
      <div class="scoreblock">
        <span class="setcol ${setsWon>0?'win':''}">${setsWon}</span>
        <span class="games">${games==null?'':games}</span>
        <span class="pts">${pts==null?'':esc(pts)}</span>
      </div>
    </div>`;
  }
  const pdA = finished ? '' : (row.point_display_a!=null?row.point_display_a:'');
  const pdB = finished ? '' : (row.point_display_b!=null?row.point_display_b:'');
  const subA = ((a1+' & '+a2)===String(row.team_a||'').trim()) ? '' : (a1+' & '+a2);
  const subB = ((b1+' & '+b2)===String(row.team_b||'').trim()) ? '' : (b1+' & '+b2);
  $('#teams').innerHTML =
      teamRow(row.team_a, subA, servA, sA, row.game_a, pdA, aWon)
    + teamRow(row.team_b, subB, servB, sB, row.game_b, pdB, bWon)
    + (setHist? `<div class="tsub" style="text-align:right;padding-top:8px">${esc(setHist)}</div>`:'');

  const stats = j(row.stats_json,null);
  const names = {a:[a1,a2], b:[b1,b2]};
  const body = $('#statsBody');
  if(Array.isArray(stats) && stats.length){
    $('#statsMode').textContent='detailed';
    let rows='';
    const order = [['a',1],['a',2],['b',1],['b',2]];
    order.forEach(([t,pos])=>{
      const s = stats.find(x=>String(x.team).toLowerCase()===t && (+x.pos)===pos);
      if(!s) return;
      const nm = names[t][pos-1] || (t.toUpperCase()+pos);
      rows += `<tr class="${t==='a'?'teamA':'teamB'}">
        <td class="pl">${esc(nm)}</td>
        <td class="big">${s.win|0}</td>
        <td>${s.ue|0}</td>
        <td>${s.brk|0}</td>
        <td>${s.key|0}</td>
      </tr>`;
    });
    body.innerHTML = `<table>
      <thead><tr><th style="text-align:left">PLAYER</th><th>WIN</th><th>ERR</th><th>BRK</th><th>KEY</th></tr></thead>
      <tbody>${rows}</tbody></table>
      <div class="tsub" style="margin-top:8px">WIN winners · ERR unforced errors · BRK break points won · KEY key points won</div>`;
  } else {
    $('#statsMode').textContent='tally';
    body.innerHTML = '<div class="nostats">Live player stats show here when the match is scored in <b>detailed-stats mode</b> in Padeja Live. The score above updates either way.</div>';
  }
}

async function tick(){
  try{
    const row = await fetchRow();
    render(row);
    // Video source: a manual ?yt= link wins (e.g. an external stream); otherwise
    // the court's own camera stream, looked up automatically.
    let embed = YT ? videoEmbed(YT) : null;
    if(!embed && row && row.court_number){ embed = await fetchStreamEmbed(row.court_number); }
    setVideo(embed);
  }catch(e){ /* keep last frame on a transient error */ }
}

(function(){
  const {code,yt} = readParams();
  if(!code){
    $('#teams').innerHTML = '<div class="nostats">No match code — open this from the “Watch live” button in the Padeja app.</div>';
    $('#novideo').textContent = 'No match';
    return;
  }
  CODE = code; YT = yt || null;
  tick();
  TIMER = setInterval(tick, 3000);
})();
</script>
</body>
</html>
