var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

  //---------------------------------------------------------------------
  // QRUtil
  //---------------------------------------------------------------------

  var QRUtil = function() {

    var PATTERN_POSITION_TABLE = [
      [],
      [6, 18],
      [6, 22],
      [6, 26],
      [6, 30],
      [6, 34],
      [6, 22, 38],
      [6, 24, 42],
      [6, 26, 46],
      [6, 28, 50],
      [6, 30, 54],
      [6, 32, 58],
      [6, 34, 62],

<style>
  :root{
    --bg:#0A1220; --panel:#101C30; --card:#13223A; --line:#20314f;
    --white:#F3F7FD; --muted:#93A9C6; --navy:#1B2E63; --navy2:#27407f;
    --brand:#3BC8F5; --accent:#F0A537; --good:#36C98D; --q:#1c3a2f;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
  html,body{height:100%;width:100%;overflow:hidden}
  body{
    background:radial-gradient(1200px 700px at 78% -10%, rgba(39,64,127,.35), transparent 60%), var(--bg);
    color:var(--white);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;height:100vh;width:100vw;
  }
  /* ---------- Header ---------- */
  header{
    display:flex;align-items:center;gap:2vh;
    padding:1.6vh 2.4vh;border-bottom:1px solid var(--line);
    background:linear-gradient(90deg, rgba(27,46,99,.55), rgba(16,28,48,.2));
  }
  .logoBadge{
    width:7.6vh;height:7.6vh;border-radius:1.4vh;background:#fff;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;
    box-shadow:0 2px 14px rgba(0,0,0,.35);
  }
  .logoBadge img{width:78%;height:78%;object-fit:contain}
  .hTitle{display:flex;flex-direction:column;line-height:1.05}
  .hTitle b{font-size:3.4vh;font-weight:800;letter-spacing:.3px}
  .hTitle span{font-size:1.7vh;color:var(--muted);font-weight:600;letter-spacing:.4px;margin-top:.4vh}
  .hRight{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
  .clock{font-size:3.2vh;font-weight:800;font-variant-numeric:tabular-nums}
  .hRight small{font-size:1.5vh;color:var(--muted);font-weight:600;margin-top:.4vh}
  .pade{font-weight:800}.pade i{color:var(--brand);font-style:normal}
  .pwr{display:flex;align-items:center;gap:.9vh;margin-top:.7vh}
  .pwr small{font-size:1.4vh;color:var(--muted);font-weight:600}
  .padejaLogo{height:2.9vh;width:auto;display:block;border-radius:.6vh}

  /* ---------- Main ---------- */
  main{flex:1;display:flex;gap:2vh;padding:2vh;min-height:0}

  /* ---------- Left: competitions + QR ---------- */
  .left{flex:0 0 31%;display:flex;flex-direction:column;gap:1.6vh;min-height:0}
  .leftHead{font-size:1.7vh;font-weight:800;letter-spacing:2px;color:var(--muted);text-transform:uppercase;padding:.2vh .4vh}
  .comp{
    flex:1;display:flex;gap:1.8vh;align-items:center;
    background:var(--card);border:1px solid var(--line);border-radius:1.6vh;
    padding:1.8vh;min-height:0;
  }
  .compInfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:1vh}
  .compName{font-size:2.9vh;font-weight:800;line-height:1.08}
  .tags{display:flex;gap:.8vh;flex-wrap:wrap}
  .tag{font-size:1.4vh;font-weight:700;padding:.5vh 1.1vh;border-radius:1vh;letter-spacing:.3px}
  .tag.box{background:rgba(59,200,245,.14);color:var(--brand);border:1px solid rgba(59,200,245,.3)}
  .tag.gender{background:rgba(240,165,55,.14);color:var(--accent);border:1px solid rgba(240,165,55,.3)}
  .scan{font-size:1.55vh;color:var(--muted);font-weight:600;line-height:1.35}
  .scan b{color:var(--white)}
  .qrWrap{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:.9vh}
  .qrBox{background:#fff;border-radius:1.2vh;padding:1vh;width:15vh;height:15vh;display:flex;align-items:center;justify-content:center}
  .qrBox svg{width:100%;height:100%;display:block}
  .code{font-size:1.7vh;font-weight:800;letter-spacing:3px;color:var(--white);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:.9vh;padding:.5vh 1.2vh}

  /* ---------- Right: carousel ---------- */
  .right{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:1.8vh;overflow:hidden;position:relative}
  .board{position:absolute;inset:0;padding:2.4vh 2.8vh;display:flex;flex-direction:column;opacity:0;transition:opacity .6s ease;pointer-events:none;background:var(--panel)}
  .board.show{opacity:1}
  .bHead{display:flex;align-items:baseline;gap:1.4vh;margin-bottom:1.8vh;flex:0 0 auto}
  .bHead h1{font-size:3.2vh;font-weight:800;line-height:1}
  .bHead .sub{font-size:1.9vh;color:var(--brand);font-weight:700;letter-spacing:.5px;text-transform:uppercase}
  .bBody{flex:1;min-height:0;overflow:hidden}

  /* standings */
  .boxes{display:grid;grid-template-columns:repeat(auto-fill,minmax(34vh,1fr));gap:1.8vh;align-content:start}
  .boxCard{background:var(--card);border:1px solid var(--line);border-radius:1.4vh;padding:1.4vh 1.6vh}
  .boxCard h2{font-size:1.9vh;font-weight:800;color:var(--accent);letter-spacing:1px;margin-bottom:1vh}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:.75vh .5vh;font-size:1.9vh}
  th{font-size:1.3vh;color:var(--muted);font-weight:700;letter-spacing:.5px;text-transform:uppercase;border-bottom:1px solid var(--line)}
  td.rk{width:3vh;color:var(--muted);font-weight:800;text-align:center}
  td.nm b{font-weight:800}
  td.nm span{display:block;font-size:1.5vh;color:var(--muted);font-weight:600}
  td.ctr{text-align:center;font-variant-numeric:tabular-nums}
  td.pts{text-align:center;font-weight:800;color:var(--white)}
  tr.top td{color:#bfe9ff}
  tr.top td.rk{color:var(--brand)}
  td.diff{text-align:center;font-variant-numeric:tabular-nums}

  /* results */
  .results{display:grid;grid-template-columns:1fr 1fr;gap:1.2vh;align-content:start}
  .res{display:flex;align-items:center;gap:1.4vh;background:var(--card);border:1px solid var(--line);border-radius:1.1vh;padding:1.2vh 1.6vh;font-size:2vh}
  .res .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
  .res .n.r{text-align:right}
  .res .sc{font-weight:800;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.06);border-radius:.8vh;padding:.3vh 1.2vh;letter-spacing:1px}
  .res .w{color:var(--good)}

  /* registered */
  .regGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(30vh,1fr));gap:1.2vh;align-content:start}
  .reg{display:flex;align-items:center;gap:1.4vh;background:var(--card);border:1px solid var(--line);border-radius:1.1vh;padding:1.2vh 1.5vh}
  .reg .av{width:4.6vh;height:4.6vh;border-radius:50%;background:var(--navy2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.9vh;flex:0 0 auto;overflow:hidden}
  .reg .av img{width:100%;height:100%;object-fit:cover}
  .reg .who{min-width:0}
  .reg .who b{font-size:2vh;font-weight:800;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .reg .who span{font-size:1.5vh;color:var(--muted);font-weight:600}

  /* empty / registration-open */
  .open{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2vh}
  .open .big{font-size:3.4vh;font-weight:800}
  .open .lead{font-size:2vh;color:var(--muted);max-width:60%}
  .open .qrBox{width:26vh;height:26vh}

  /* footer ticker */
  footer{flex:0 0 auto;border-top:1px solid var(--line);background:rgba(16,28,48,.6);padding:1.1vh 2.4vh;display:flex;align-items:center;gap:1.4vh;font-size:1.7vh;color:var(--muted);font-weight:600}
  footer .dot{color:var(--brand)}
  .pager{margin-left:auto;display:flex;gap:.7vh}
  .pager i{width:1.1vh;height:1.1vh;border-radius:50%;background:var(--line);display:inline-block;font-style:normal;transition:background .3s}
  .pager i.on{background:var(--brand)}
</style>

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function num(n){ return (n==null||isNaN(n)) ? 0 : (n|0); }
  function initials(s){ s=String(s||'').trim(); if(!s) return '?'; var p=s.split(/\s+/); return (p[0][0]+(p[1]?p[1][0]:'')).toUpperCase(); }

  async function rpc(fn, body){
    try{
      var res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, { method:'POST', headers:HEADERS, body:JSON.stringify(body||{}), cache:'no-store' });
      if(!res.ok) return null;
      return await res.json();
    }catch(e){ return null; }
  }

  /* ---------------- QR codes (left cards) ---------------- */
  function qrSvg(url){
    if(typeof qrcode === 'undefined') return '<div style="color:#06131f;font-size:1.3vh;font-weight:700;padding:1vh;text-align:center">'+esc(url)+'</div>';
    try{ var q=qrcode(0,'M'); q.addData(url); q.make(); return q.createSvgTag({cellSize:6, margin:1, scalable:true}); }
    catch(e){ return ''; }
  }
  function renderComps(){
    var html = '';
    COMPS.forEach(function(c){
      var url = REG_BASE + encodeURIComponent(c.code);

        +   '<div class="scan">Point your <b>phone camera</b> at the code to <b>register</b>. No app? You&rsquo;ll be offered the free Padeja download.</div>'
        + '</div>'
        + '<div class="qrWrap"><div class="qrBox">'+qrSvg(url)+'</div><div class="code">'+esc(c.code)+'</div></div>'
        + '</div>';
    });
    $('comps').innerHTML = html;
  }

  /* ---------------- Standings helpers ---------------- */
  function rankTeams(list){
    return (list||[]).slice().sort(function(a,b){
      return (num(b.league_points)-num(a.league_points))
          || (num(b.diff)-num(a.diff))
          || (num(b.won)-num(a.won))
          || (num(b.played)-num(a.played));
    });
  }
  function pairName(t){
    var n1 = (t.team_name || t.player1_name || t.player_name || 'Player');
    var n2 = (t.player2_name || '');
    return '<b>'+esc(n1)+'</b>' + (n2 ? '<span>'+esc(n2)+'</span>' : '');
  }

  function standingsBoard(comp, data){
    var teams = (data && data.teams) || [];
    var leagues = (data && data.leagues) || [];
    if(!teams.length) return null;
    // Group teams by their league (box), ordered by league_letter.
    var letterOf = {}; leagues.forEach(function(l){ letterOf[l.id] = l.league_letter || l.name || '?'; });
    var order = leagues.slice().sort(function(a,b){ return String(a.league_letter||a.name||'').localeCompare(String(b.league_letter||b.name||'')); });
    var byLeague = {}; teams.forEach(function(t){ (byLeague[t.league_id] = byLeague[t.league_id] || []).push(t); });
    var cards = '';
    order.forEach(function(l){
      var ranked = rankTeams(byLeague[l.id] || []);
      if(!ranked.length) return;
      var rows = '';
      ranked.forEach(function(t,i){
        var d = num(t.diff);
        rows += '<tr class="'+(i<2?'top':'')+'">'
          + '<td class="rk">'+(i+1)+'</td>'
          + '<td class="nm">'+pairName(t)+'</td>'
          + '<td class="ctr">'+num(t.played)+'</td>'
          + '<td class="ctr">'+num(t.won)+'</td>'
          + '<td class="diff">'+(d>0?'+':'')+d+'</td>'
          + '<td class="pts">'+num(t.league_points)+'</td>'
          + '</tr>';
      });
      cards += '<div class="boxCard"><h2>BOX '+esc(letterOf[l.id]||'')+'</h2>'
        + '<table><thead><tr><th class="rk"></th><th>Player / Pair</th><th class="ctr">P</th><th class="ctr">W</th><th class="ctr">+/&minus;</th><th class="ctr">Pts</th></tr></thead>'
        + '<tbody>'+rows+'</tbody></table></div>';
    });
    if(!cards) return null;
    return { title: comp.name, sub: 'Standings', html: '<div class="boxes">'+cards+'</div>' };
  }

  function resultsBoard(comp, data){
    var teams = (data && data.teams) || [];
    var matches = (data && data.matches) || [];
    if(!matches.length || !teams.length) return null;
    var nameById = {}; teams.forEach(function(t){ nameById[t.id] = (t.team_name || t.player1_name || t.player_name || 'Player'); });
    function nm(m, side){
      return m[side+'_name'] || nameById[m[side+'_team_id']] || nameById[m[side+'_team']] || nameById[m[side+'_id']] || null;
    }
    var DONE = {completed:1, finished:1, verified:1, confirmed:1};
    var rows = [];
    matches.forEach(function(m){
      var st = String(m.status||'').toLowerCase();
      var hs = (m.home_sets!=null) ? m.home_sets : m.home_score;
      var as = (m.away_sets!=null) ? m.away_sets : m.away_score;
      var hn = nm(m,'home'), an = nm(m,'away');
      if(!DONE[st] || hs==null || as==null || !hn || !an) return;
      rows.push({hn:hn, an:an, hs:num(hs), as:num(as)});
    });
    if(!rows.length) return null;
    rows = rows.slice(-8);
    var html = '<div class="results">' + rows.map(function(r){
      var hw = r.hs>r.as, aw = r.as>r.hs;
      return '<div class="res"><span class="n r '+(hw?'w':'')+'">'+esc(r.hn)+'</span>'
        + '<span class="sc">'+r.hs+'&ndash;'+r.as+'</span>'
        + '<span class="n '+(aw?'w':'')+'">'+esc(r.an)+'</span></div>';
    }).join('') + '</div>';
    return { title: comp.name, sub: 'Latest Results', html: html };
  }

  function registeredBoard(comp, regs){
    var url = REG_BASE + encodeURIComponent(comp.code);
    if(!regs || !regs.length){
      return { title: comp.name, sub: 'Registration Open', html:
        '<div class="open"><div class="big">Be the first to sign up!</div>'
        + '<div class="lead">Scan to register for the '+esc(comp.name)+'. No app yet? You&rsquo;ll be offered the free Padeja download.</div>'
        + '<div class="qrBox">'+qrSvg(url)+'</div><div class="code">'+esc(comp.code)+'</div></div>' };
    }
    var cells = regs.map(function(r){
      var isTeam = !!(r.p2_name) || !!(r.team_name);
      var title = r.team_name || r.p1_name || 'Player';
      var sub = isTeam ? ((r.team_name ? (r.p1_name + (r.p2_name?(' & '+r.p2_name):'')) : (r.p1_name + (r.p2_name?(' & '+r.p2_name):'')))) : 'Solo entry';
      var av = r.team_logo_url ? '<img src="'+esc(r.team_logo_url)+'" alt="">' : esc(initials(title));
      return '<div class="reg"><div class="av">'+av+'</div><div class="who"><b>'+esc(title)+'</b><span>'+esc(sub)+'</span></div></div>';
    }).join('');
    return { title: comp.name, sub: 'Registered (' + regs.length + ')', html: '<div class="regGrid">'+cells+'</div>' };
  }

  /* ---------------- Load + build boards ---------------- */
  var boards = [];
  async function loadAll(){
    var next = [];
    for(var i=0;i<COMPS.length;i++){
      var c = COMPS[i];
      var data = await rpc('get_host_display', { p_code: c.code });
      var hasTeams = data && data.teams && data.teams.length;
      if(hasTeams){
        var sb = standingsBoard(c, data); if(sb) next.push(sb);
        var rb = resultsBoard(c, data);   if(rb) next.push(rb);
      } else {
        var regs = await rpc('get_display_registrations', { p_code: c.code });
        next.push(registeredBoard(c, Array.isArray(regs)?regs:[]));
      }
    }
    if(next.length) boards = next;
    renderBoards();
  }

  /* ---------------- Carousel ---------------- */
  var idx = 0, rotTimer = null;
  function renderBoards(){
    var right = $('right');
    if(!boards.length){
      right.innerHTML = '<div class="board show"><div class="open"><div class="big">No active competitions</div><div class="lead">Nothing to show right now.</div></div></div>';
      $('pager').innerHTML = '';
      return;
    }
    if(idx >= boards.length) idx = 0;
    right.innerHTML = boards.map(function(b,i){
      return '<div class="board'+(i===idx?' show':'')+'">'
        + '<div class="bHead"><h1>'+esc(b.title)+'</h1><span class="sub">'+esc(b.sub)+'</span></div>'
        + '<div class="bBody">'+b.html+'</div></div>';
    }).join('');
    $('pager').innerHTML = boards.map(function(_,i){ return '<i class="'+(i===idx?'on':'')+'"></i>'; }).join('');
    if(rotTimer) clearInterval(rotTimer);
    rotTimer = setInterval(rotate, ROTATE_MS);
  }
  function rotate(){
    if(boards.length<2) return;
    var kids = document.querySelectorAll('#right .board');
    if(kids[idx]) kids[idx].classList.remove('show');
    idx = (idx+1) % boards.length;
    if(kids[idx]) kids[idx].classList.add('show');
    var dots = document.querySelectorAll('#pager i');
    dots.forEach(function(d,i){ d.className = (i===idx?'on':''); });
  }

  /* ---------------- Clock ---------------- */
  function tickClock(){
    var d = new Date();
    $('clock').textContent = d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  }

  /* ---------------- Boot ---------------- */
  renderComps();
  tickClock(); setInterval(tickClock, 15000);
  loadAll();
  setInterval(loadAll, REFRESH_MS);
})();
</script>
</body>
</html>
