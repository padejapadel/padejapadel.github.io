<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brentwood Padel — Court Wall</title>
<style>
  :root{ --gap:2px; --bg:#05070c; }
  html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;}
  /* 6 courts as a 3-wide x 2-tall grid filling the whole TV. */
  #wall{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-auto-rows:1fr;
    gap:var(--gap);
    width:100vw;height:100vh;
    background:var(--bg);
  }
  .tile{position:relative;overflow:hidden;background:#000;}
  .tile iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;}
  /* Small corner tag so a tile is still identifiable if its page is slow to load.
     Low-opacity and click-through so it never covers the live score. */
  .tile .label{
    position:absolute;top:6px;left:8px;z-index:2;pointer-events:none;
    font:700 12px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    letter-spacing:.08em;color:#dfe8f2;opacity:.5;
    background:rgba(0,0,0,.35);padding:3px 7px;border-radius:5px;
  }
</style>
</head>
<body>
<div id="wall"></div>
<script>
(function(){
  // ── Options (all optional, via the URL) ──────────────────────────────────
  //   ?courts=6   how many courts to show          (default 6)
  //   ?cols=3     columns in the grid              (default 3 -> 3x2 for 6)
  //   ?relay=URL  override the camera-relay base    (passed to every court)
  //   ?refresh=N  quietly reload each tile every N minutes (default 0 = never)
  var qs      = new URLSearchParams(location.search);
  var courts  = parseInt(qs.get('courts')  || '6', 10) || 6;
  var cols    = parseInt(qs.get('cols')    || '3', 10) || 3;
  var relay   = qs.get('relay') || '';
  var refresh = parseInt(qs.get('refresh') || '0', 10) || 0;

  var wall = document.getElementById('wall');
  wall.style.gridTemplateColumns = 'repeat(' + cols + ',1fr)';

  var frames = [];
  for (var n = 1; n <= courts; n++){
    var tile  = document.createElement('div');  tile.className = 'tile';

    var label = document.createElement('div');  label.className = 'label';
    label.textContent = 'COURT ' + n;
    tile.appendChild(label);

    var f = document.createElement('iframe');
    // Relative path: the wall lives next to bpc-court.html (app.padeja.com root),
    // so this resolves to app.padeja.com/bpc-court.html?court=N.
    var src = 'bpc-court.html?court=' + n + (relay ? '&relay=' + encodeURIComponent(relay) : '');
    f.src = src;
    f.setAttribute('allow', 'autoplay; fullscreen; encrypted-media');
    f.setAttribute('scrolling', 'no');
    f.setAttribute('loading', 'eager');
    tile.appendChild(f);

    wall.appendChild(tile);
    frames.push({ f: f, src: src });
  }

  // Self-heal for an always-on TV: cycle through the tiles slowly and reload one
  // at a time (cache-busted) so a stalled court recovers without all six
  // flickering together. Off by default — turn on with ?refresh=30 etc.
  if (refresh > 0){
    var i = 0;
    setInterval(function(){
      var t = frames[i % frames.length];
      t.f.src = t.src + (t.src.indexOf('?') >= 0 ? '&' : '?') + '_r=' + Date.now();
      i++;
    }, Math.max(10000, (refresh * 60000) / frames.length));
  }
})();
</script>
</body>
</html>
