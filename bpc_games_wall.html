<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>BPC Padel Games — Live Standings</title>
<style>
  :root{
    --bg:#05070d; --panel:#0e131d; --panel2:#131a27; --line:#1f2a3b;
    --text:#f3f7fb; --muted:#8ea0b6; --brand:#3BC8F5; --gold:#F2C14E;
    --good:#2fbf71; --warn:#ff6b6b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:radial-gradient(1200px 700px at 50% -10%,#0c1526 0%,var(--bg) 60%);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1900px;margin:0 auto;padding:22px 26px 40px}
  header{display:flex;align-items:center;gap:20px;margin-bottom:18px}
  .title{font-weight:900;letter-spacing:.5px;font-size:34px;line-height:1}
  .title small{display:block;color:var(--muted);font-size:15px;font-weight:700;letter-spacing:3px;margin-top:6px}
  .clock{margin-left:auto;text-align:right}
  .clock b{font-size:30px;font-weight:900}
  .clock span{display:block;color:var(--muted);font-size:13px;font-weight:700;letter-spacing:1px}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--good);margin-right:7px;vertical-align:middle;
    box-shadow:0 0 0 0 rgba(47,191,113,.6);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,191,113,.5)}70%{box-shadow:0 0 0 10px rgba(47,191,113,0)}100%{box-shadow:0 0 0 0 rgba(47,191,113,0)}}

  /* Overall leaderboard */
  .overall{background:linear-gradient(180deg,#121a2b,#0c1220);border:1px solid var(--line);border-radius:20px;padding:20px 22px;margin-bottom:22px}
  .overall h2{margin:0 0 14px;font-size:16px;letter-spacing:3px;color:var(--muted);font-weight:800;text-transform:uppercase}
  .obar{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
  .ocard{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:16px 14px;overflow:hidden}
  .ocard .rk{font-size:13px;font-weight:800;color:var(--muted)}
  .ocard .cl{font-size:22px;font-weight:900;margin:4px 0 8px;line-height:1.05}
  .ocard .pts{font-size:44px;font-weight:900;line-height:1}
  .ocard .pts small{font-size:15px;color:var(--muted);font-weight:700;margin-left:5px}
  .ocard .sub{color:var(--muted);font-size:12px;font-weight:700;margin-top:6px}
  .ocard .stripe{position:absolute;left:0;top:0;bottom:0;width:6px}
  .ocard.lead{box-shadow:0 0 0 2px var(--gold) inset}
  .medal{position:absolute;right:12px;top:10px;font-size:22px}

  /* League grid */
  .leagues{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  @media(max-width:1300px){.leagues{grid-template-columns:repeat(2,1fr)}.obar{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:820px){.leagues{grid-template-columns:1fr}.obar{grid-template-columns:repeat(2,1fr)}}
  .lg{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 16px 12px;display:flex;flex-direction:column}
  .lg h3{margin:0;font-size:20px;font-weight:900;display:flex;align-items:center;gap:10px}
  .lg h3 .cap{margin-left:auto;font-size:12px;color:var(--muted);font-weight:800;letter-spacing:1px}
  .tbl{width:100%;border-collapse:collapse;margin-top:10px}
  .tbl th{font-size:11px;color:var(--muted);text-align:center;font-weight:800;letter-spacing:1px;padding:4px 4px}
  .tbl th.l{text-align:left}
  .tbl td{padding:7px 4px;border-top:1px solid var(--line);font-size:15px;text-align:center;font-weight:700}
  .tbl td.l{text-align:left}
  .tbl td.pts{font-weight:900;font-size:18px}
  .pair{display:flex;align-items:center;gap:8px}
  .chip{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
  .pname{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
  .pnamewrap{display:flex;flex-direction:column;min-width:0}
  .psub{font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px;margin-top:1px}
  .tlogo{width:20px;height:20px;border-radius:6px;object-fit:cover;border:2px solid;flex:0 0 auto}
  .rkn{color:var(--muted);font-weight:800;width:18px;display:inline-block}
  .warn{color:var(--warn);font-size:12px;font-weight:800;margin-left:6px}
  .empty{color:var(--muted);font-weight:700;font-size:14px;padding:16px 4px;text-align:center}
  .res{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
  .res .rh{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:1px;margin-bottom:6px}
  .row{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;padding:3px 0;color:#cdd7e4}
  .row .sc{margin-left:auto;font-weight:900;color:#fff}
  .row .vs{color:var(--muted);font-weight:800}
  .setup{font-size:11px;font-weight:800;letter-spacing:1px;padding:3px 8px;border-radius:999px;background:#20304a;color:#9fc7ff}
  footer{color:var(--muted);font-size:12px;font-weight:700;text-align:center;margin-top:26px}
</style>
</head>

Team 4", "dan eagle": "Team 4", "zoe eagle": "Team 4", "christiana bourne": "Team 4", "tayla toby": "Team 4", "petra wagner": "Team 4", "ali morton": "Team 4", "martin dowie": "Team 5", "frank mcardle": "Team 5", "charlie snooks": "Team 5", "jordan bruce": "Team 5", "brad porter": "Team 5", "olly wager": "Team 5", "glenn hayes": "Team 5", "clare jackson": "Team 5", "catherine patient": "Team 5", "natasha mitchell": "Team 5", "julie bettles": "Team 5", "sian douglas": "Team 5", "daniel glozier": "Team 6", "jake marsh": "Team 6", "kevin cumbers": "Team 6", "lawrie inman": "Team 6", "tj long": "Team 6", "james cook": "Team 6", "stuart loader": "Team 6", "kate holliman": "Team 6", "laura ciftci": "Team 6", "justine miller": "Team 6", "clair williams": "Team 6", "penny reason": "Team 6"};
const IDS = LEAGUES.map(l=>l.id);
let regByTeam = {};
// The label + logo + player sub-line for a team row. Uses the approved
// registration (has both player names + the custom team name/logo).
function teamDisplay(t){
  const r = regByTeam[t.id] || {};
  const name = ((t.team_name||r.team_name||"")+"").trim() || "—";
  const p1 = ((r.player1_name||"")+"").trim();
  const p2 = ((r.player2_name||t.player2_name||"")+"").trim();
  const players = [p1,p2].filter(Boolean).join(" & ");
  const logo = ((t.team_logo_url||r.team_logo_url||"")+"").trim();
  const sub = (players && players.toLowerCase()!==name.toLowerCase()) ? players : "";
  return {name, sub, logo};
}

const norm = s => (s||"").trim().toLowerCase().replace(/\s+/g," ");
function clubById(id){ return id && PROF[id] ? PROF[id] : null; }
function clubByName(n){ n=norm(n); return NAME[n]||null; }
// resolve a league_team row to a club (profile ids first, then names)
function teamClub(t){
  return clubById(t.player1_profile_id) || clubById(t.player2_profile_id)
      || clubByName(t.team_name) || clubByName(t.player2_name)
      || (t.team_name||"").split("&").map(clubByName).find(Boolean) || null;
}
// two-player club check for the mis-pair warning
function pairClubs(t){
  const a = clubById(t.player1_profile_id) || clubByName(t.team_name);
  const b = clubById(t.player2_profile_id) || clubByName(t.player2_name);
  return [a,b];
}
function pairLabel(t){
  const tn=(t.team_name||"").trim();
  const p2=(t.player2_name||"").trim();
  if(p2 && tn.indexOf("&")<0) return tn+" & "+p2;
  return tn || p2 || "—";
}

async function q(path){
  const r = await fetch(SUPA+"/rest/v1/"+path, {headers:{apikey:ANON,Authorization:"Bearer "+ANON}});
  if(!r.ok) throw new Error(r.status);
  return r.json();
}

function esc(s){return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

async function load(){
  try{
    const inIds="("+IDS.join(",")+")";
    const [teams, matches, comps, regs] = await Promise.all([
      q("league_teams?tournament_id=in."+inIds+"&select=*"),
      q("tournament_matches?tournament_id=in."+inIds+"&select=*"),
      q("tournaments?id=in."+inIds+"&select=id,name,status"),
      q("league_registrations?tournament_id=in."+inIds+"&status=eq.approved&select=resulting_team_id,team_name,team_logo_url,player1_name,player2_name")
    ]);
    render(teams, matches, comps, regs);
    const now=new Date();
    document.getElementById("updated").innerHTML='<span class="dot"></span>updated '+now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  }catch(e){
    document.getElementById("updated").innerHTML='<span class="dot" style="background:#ff6b6b"></span>connection error — retrying';
  }
}

function render(teams, matches, comps, regs){
  regByTeam={}; (regs||[]).forEach(r=>{ if(r.resulting_team_id) regByTeam[r.resulting_team_id]=r; });
  const byLeague={}; IDS.forEach(id=>byLeague[id]={teams:[],matches:[],status:"setup"});
  comps.forEach(c=>{ if(byLeague[c.id]) byLeague[c.id].status=c.status; });
  teams.forEach(t=>{ if(byLeague[t.tournament_id]) byLeague[t.tournament_id].teams.push(t); });
  matches.forEach(m=>{ if(byLeague[m.tournament_id]) byLeague[m.tournament_id].matches.push(m); });

  // ---- overall roll-up ----
  const tot={}; CLUBS.forEach(c=>tot[c]={pts:0,teams:0,leads:0});
  LEAGUES.forEach(L=>{
    const ts=byLeague[L.id].teams.slice().sort((a,b)=>(b.league_points-a.league_points)||((b.points_for-b.points_against)-(a.points_for-a.points_against)));
    ts.forEach((t,i)=>{
      const c=teamClub(t); if(!c||!tot[c])return;
      tot[c].pts += (t.league_points||0); tot[c].teams++;
      if(i===0 && (t.played||0)>0) tot[c].leads++;
    });
  });
  const order=CLUBS.slice().sort((a,b)=>(tot[b].pts-tot[a].pts)||(tot[b].leads-tot[a].leads)||CLUBS.indexOf(a)-CLUBS.indexOf(b));
  const medals=["🥇","🥈","🥉"];
  document.getElementById("overall").innerHTML = order.map((c,i)=>{
    const col=CLUB_COLORS[c]||"#3BC8F5";
    return `<div class="ocard ${i===0&&tot[c].pts>0?'lead':''}">
      <div class="stripe" style="background:${col}"></div>
      ${i<3&&tot[c].pts>0?`<div class="medal">${medals[i]}</div>`:''}
      <div class="rk">#${i+1}</div>
      <div class="cl" style="color:${col}">${esc(c)}</div>
      <div class="pts">${tot[c].pts}<small>pts</small></div>
      <div class="sub">${tot[c].teams}/6 pairs in · ${tot[c].leads} category lead${tot[c].leads===1?'':'s'}</div>
    </div>`;
  }).join("");

  // ---- per-league panels ----
  document.getElementById("leagues").innerHTML = LEAGUES.map(L=>{
    const d=byLeague[L.id];
    const ts=d.teams.slice().sort((a,b)=>(b.league_points-a.league_points)||((b.points_for-b.points_against)-(a.points_for-a.points_against))||(a.team_name||"").localeCompare(b.team_name||""));
    let body;
    if(ts.length===0){
      body=`<div class="empty">Awaiting pairs…</div>`;
    }else{
      const rows=ts.map((t,i)=>{
        const c=teamClub(t); const col=c?CLUB_COLORS[c]:"#33415a";
        const [ca,cb]=pairClubs(t); const mismatch = ca&&cb&&ca!==cb;
        const td=teamDisplay(t);
        const mark = td.logo ? `<img class="tlogo" style="border-color:${col}" src="${esc(td.logo)}" onerror="this.style.display='none'"/>` : `<span class="chip" style="background:${col}"></span>`;
        return `<tr>
          <td class="l"><div class="pair"><span class="rkn">${i+1}</span>${mark}
            <div class="pnamewrap"><span class="pname">${esc(td.name)}${mismatch?'<span class="warn">⚠ mixed club</span>':''}</span>${td.sub?`<span class="psub">${esc(td.sub)}</span>`:''}</div></div></td>
          <td>${t.played||0}</td><td>${t.won||0}</td><td>${t.drawn||0}</td><td>${t.lost||0}</td>
          <td class="pts">${t.league_points||0}</td></tr>`;
      }).join("");
      body=`<table class="tbl">
        <tr><th class="l">Pair</th><th>P</th><th>W</th><th>D</th><th>L</th><th>Pts</th></tr>
        ${rows}</table>`;
    }
    // results
    const played=d.matches.filter(m=>m.score_a!=null&&m.score_b!=null);
    let res="";
    if(played.length){
      const nameOf=(id1,id2)=>{
        const t=d.teams.find(t=>{
          const s=new Set([t.player1_profile_id,t.player2_profile_id]);
          return s.has(id1)&&s.has(id2);
        });
        return t?teamDisplay(t).name:"Pair";
      };
      res=`<div class="res"><div class="rh">RESULTS</div>`+played.slice(-6).map(m=>{
        const A=nameOf(m.player_a1_id,m.player_a2_id), B=nameOf(m.player_b1_id,m.player_b2_id);
        const win=m.score_a>m.score_b;
        return `<div class="row"><span style="font-weight:${win?900:700};color:${win?'#fff':'#cdd7e4'}">${esc(A)}</span>
          <span class="vs">v</span><span style="font-weight:${!win?900:700}">${esc(B)}</span>
          <span class="sc">${m.score_a} – ${m.score_b}</span></div>`;
      }).join("")+`</div>`;
    } else if(d.matches.length===0){
      res=`<div class="res"><div class="rh">RESULTS</div><div class="empty" style="padding:6px 0">Fixtures not generated yet</div></div>`;
    }
    const statusPill = d.status && d.status!=="active" ? `<span class="setup">${esc(d.status)}</span>` : "";
    return `<div class="lg"><h3>${esc(L.label)} ${statusPill}<span class="cap">CAP ${L.cap.toFixed(2)}</span></h3>${body}${res}</div>`;
  }).join("");
}

function tick(){ document.getElementById("clock").textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
tick(); setInterval(tick,1000);
load(); setInterval(load,20000);
</script>
