<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BPC Padel Games — Live Standings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wght@500;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    color-scheme: dark;
    --bg:#0A111E; --bg2:#0B1424;
    --panel:#101C30; --panel2:#152540; --panel3:#0E1829;
    --line:#233953; --line-soft:rgba(255,255,255,.06);
    --ink:#EDF3FC; --muted:#93A7C2; --faint:#5B7089;
    --brand:#34D6C6; --brand-2:#22B9AE; --brand-dim:rgba(52,214,198,.13);
    --win:#5AD08C; --loss:#F2647E; --draw:#9AAFC8;
    /* squad identity */
    --sq-padeja:#3EA6F0; --sq-t2:#F2C14E; --sq-t3:#54D08A;
    --sq-t4:#F2894E; --sq-t5:#A98BEE; --sq-t6:#EC6FA0;
    --display:"Saira", "Hanken Grotesk", system-ui, sans-serif;
    --body:"Hanken Grotesk", system-ui, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--body);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  .frame{
    position:fixed; inset:0;
    display:grid; place-items:center;
    background:
      radial-gradient(120% 90% at 82% -10%, rgba(52,214,198,.10), transparent 55%),
      radial-gradient(90% 70% at 0% 0%, rgba(62,166,240,.08), transparent 55%),
      var(--bg);
  }
  .board{
    position:relative;
    width:min(100vw, calc(100vh * 16 / 9));
    height:min(100vh, calc(100vw * 9 / 16));
    container-type:size;
    overflow:hidden;
    background:
      linear-gradient(180deg, rgba(255,255,255,.015), transparent 20%),
      var(--bg);
    display:flex; flex-direction:column;
  }
  .pad{ padding: 2.4cqh 3cqh; }

  /* ---------- masthead ---------- */
  .mast{
    display:flex; align-items:flex-end; justify-content:space-between;
    gap:2cqh;
    padding:2.4cqh 3cqh 1.4cqh;
  }
  .mast .lede{ display:flex; align-items:center; gap:1.6cqh; }
  .logo{
    width:5.6cqh; height:5.6cqh; border-radius:1.3cqh; flex:none;
    display:grid; place-items:center;
    background:linear-gradient(150deg, var(--brand), var(--brand-2));
    color:#04201d; font-family:var(--display); font-weight:800;
    font-size:3.2cqh; box-shadow:0 0.6cqh 2cqh rgba(52,214,198,.28);
  }
  .title{ font-family:var(--display); font-weight:800; letter-spacing:.02em; line-height:.94; font-size:4.2cqh; }
  .subtitle{ color:var(--muted); font-weight:600; letter-spacing:.28em; text-transform:uppercase; font-size:1.35cqh; margin-top:.7cqh; }
  .clockwrap{ text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:.5cqh; }
  .clock{ font-family:var(--display); font-weight:700; font-size:4.4cqh; line-height:.9; font-variant-numeric:tabular-nums; }
  .live{ display:inline-flex; align-items:center; gap:.8cqh; color:var(--muted); font-weight:600; font-size:1.35cqh; }
  .dot{ width:1.1cqh; height:1.1cqh; border-radius:50%; background:var(--win); box-shadow:0 0 0 0 rgba(90,208,140,.55); animation:pulse 2.4s infinite; }
  @keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(90,208,140,.5);} 70%{box-shadow:0 0 0 1.3cqh rgba(90,208,140,0);} 100%{box-shadow:0 0 0 0 rgba(90,208,140,0);} }

  /* ---------- rotation progress ---------- */
  .rot{ height:.5cqh; margin:0 3cqh; border-radius:1cqh; background:var(--line-soft); overflow:hidden; }
  .rot > i{ display:block; height:100%; width:0; background:linear-gradient(90deg,var(--brand),var(--brand-2)); border-radius:1cqh; }

  /* ---------- main grid ---------- */
  .grid{ flex:1; min-height:0; display:grid; grid-template-columns: 30cqw 1fr; gap:2.4cqh; padding:1.6cqh 3cqh 1.2cqh; }
  .card{ background:linear-gradient(180deg, var(--panel), var(--panel3)); border:1px solid var(--line); border-radius:1.8cqh; }
  .card-h{ display:flex; align-items:center; justify-content:space-between; padding:1.5cqh 1.8cqh 1cqh; }
  .card-t{ font-family:var(--display); font-weight:700; font-size:2.1cqh; letter-spacing:.01em; }
  .eyebrow{ font-weight:700; letter-spacing:.26em; text-transform:uppercase; font-size:1.15cqh; color:var(--muted); }
  .cap{ font-family:var(--display); font-weight:600; font-size:1.3cqh; color:var(--muted); letter-spacing:.06em; }

  /* ---------- overall rail ---------- */
  .rail{ display:flex; flex-direction:column; min-height:0; }
  .rail .card-h{ padding-bottom:.4cqh; }
  .rail-body{ flex:1; display:flex; flex-direction:column; padding:.8cqh 1.4cqh 1.4cqh; gap:.7cqh; min-height:0; }
  .team-row{
    display:grid; grid-template-columns: 3cqh 5cqh 1fr auto; align-items:center; gap:1.3cqh;
    padding:1.05cqh 1.2cqh; border-radius:1.2cqh; background:var(--panel2);
    border:1px solid transparent; position:relative; overflow:hidden;
  }
  .team-row::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:.5cqh; background:var(--sq); }
  .team-row.lead{ background:linear-gradient(90deg, var(--brand-dim), var(--panel2) 60%); border-color:rgba(52,214,198,.35); }
  .rank{ font-family:var(--display); font-weight:700; font-size:2cqh; color:var(--muted); text-align:center; font-variant-numeric:tabular-nums; }
  .team-row.lead .rank{ color:var(--brand); }
  .badge{ width:5cqh; height:5cqh; border-radius:1.1cqh; display:grid; place-items:center; font-family:var(--display); font-weight:800; font-size:2.4cqh; color:#08121c; background:var(--sq); box-shadow:inset 0 -0.4cqh 1cqh rgba(0,0,0,.22); }
  .team-name{ font-family:var(--display); font-weight:700; font-size:2.15cqh; line-height:1; }
  .team-sub{ color:var(--muted); font-size:1.3cqh; font-weight:500; margin-top:.55cqh; display:flex; gap:1.1cqh; }
  .team-sub b{ color:var(--ink); font-weight:700; }
  .team-pts{ text-align:right; }
  .team-pts .n{ font-family:var(--display); font-weight:800; font-size:3.5cqh; line-height:.85; font-variant-numeric:tabular-nums; }
  .team-pts .u{ display:block; color:var(--muted); font-size:1.1cqh; font-weight:700; letter-spacing:.16em; text-transform:uppercase; margin-top:.3cqh; }

  /* ---------- stage ---------- */
  .stage{ position:relative; min-height:0; }
  .scene{ position:absolute; inset:0; opacity:0; visibility:hidden; transition:opacity .5s ease; display:flex; flex-direction:column; }
  .scene.on{ opacity:1; visibility:visible; }

  /* categories grid */
  .cats{ flex:1; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(2,1fr); gap:1.6cqh; min-height:0; }
  .cat{ display:flex; flex-direction:column; min-height:0; }
  .cat .card-h{ padding:1.1cqh 1.4cqh .5cqh; }
  .cat .card-t{ font-size:1.9cqh; }
  .thead, .trow{ display:grid; grid-template-columns: 1.9cqh 1fr 2.1cqh 2.1cqh 2.1cqh 3.1cqh; align-items:center; gap:.7cqh; }
  .thead{ padding:.3cqh 1.4cqh .6cqh; color:var(--muted); font-weight:700; font-size:1.02cqh; letter-spacing:.08em; text-transform:uppercase; border-bottom:1px solid var(--line-soft); }
  .thead .r,.trow .r{ text-align:center; font-variant-numeric:tabular-nums; }
  .tbody{ padding:.3cqh .6cqh .8cqh; display:flex; flex-direction:column; justify-content:space-around; flex:1; }
  .trow{ padding:.42cqh .8cqh; border-radius:.8cqh; }
  .trow:nth-child(odd){ background:rgba(255,255,255,.022); }
  .trow.top{ background:var(--brand-dim); }
  .p-idx{ font-family:var(--display); font-weight:700; font-size:1.35cqh; color:var(--muted); text-align:center; font-variant-numeric:tabular-nums; }
  .trow.top .p-idx{ color:var(--brand); }
  .pair{ display:flex; align-items:center; gap:.85cqh; min-width:0; }
  .chip{ width:1.5cqh; height:1.5cqh; border-radius:.42cqh; background:var(--sq); flex:none; box-shadow:inset 0 -0.2cqh .5cqh rgba(0,0,0,.25); }
  .pair-txt{ min-width:0; }
  .pair-name{ font-family:var(--display); font-weight:700; font-size:1.5cqh; line-height:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pair-players{ display:flex; flex-direction:column; gap:.12cqh; margin-top:.32cqh; min-width:0; }
  .pair-players .pl{ color:var(--muted); font-size:1.14cqh; font-weight:500; line-height:1.16; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rt{ color:var(--brand); font-weight:700; font-variant-numeric:tabular-nums; }
  .r{ font-size:1.4cqh; font-weight:600; color:var(--muted); }
  .r.pts{ font-family:var(--display); font-weight:800; font-size:1.85cqh; color:var(--ink); }
  .trow.top .r.pts{ color:var(--brand); }

  .await{ flex:1; display:grid; place-items:center; color:var(--muted); font-weight:600; font-size:1.5cqh; opacity:.7; }

  /* spotlight */
  .spot{ flex:1; display:flex; flex-direction:column; min-height:0; }
  .spot-head{ display:flex; align-items:center; gap:2cqh; padding:.4cqh .4cqh 2cqh; }
  .spot-badge{ width:8.5cqh; height:8.5cqh; border-radius:2cqh; display:grid; place-items:center; font-family:var(--display); font-weight:800; font-size:4.4cqh; color:#08121c; background:var(--sq); box-shadow:0 1cqh 2.6cqh rgba(0,0,0,.35), inset 0 -0.6cqh 1.4cqh rgba(0,0,0,.2); }
  .spot-id{ flex:1; min-width:0; }
  .spot-rankline{ display:flex; align-items:center; gap:1.1cqh; color:var(--muted); font-weight:700; font-size:1.4cqh; letter-spacing:.02em; }
  .spot-rankline .pos{ color:var(--sq); font-family:var(--display); font-size:1.6cqh; }
  .spot-name{ font-family:var(--display); font-weight:800; font-size:4.4cqh; line-height:.95; margin:.5cqh 0 .3cqh; }
  .spot-meta{ display:flex; gap:2.4cqh; color:var(--muted); font-size:1.45cqh; font-weight:500; }
  .spot-meta b{ color:var(--ink); font-family:var(--display); font-weight:700; }
  .spot-total{ text-align:right; }
  .spot-total .n{ font-family:var(--display); font-weight:800; font-size:6.6cqh; line-height:.8; color:var(--sq); font-variant-numeric:tabular-nums; }
  .spot-total .u{ color:var(--muted); font-weight:700; letter-spacing:.18em; text-transform:uppercase; font-size:1.2cqh; }
  .contrib{ flex:1; display:flex; flex-direction:column; justify-content:space-between; gap:1cqh; min-height:0; }
  .crow{ display:grid; grid-template-columns: 11cqh 1fr 9cqw 3.4cqh; align-items:center; gap:1.6cqh; background:var(--panel2); border:1px solid var(--line-soft); border-radius:1.2cqh; padding:1cqh 1.6cqh; }
  .crow.empty{ opacity:.5; }
  .ccat{ font-family:var(--display); font-weight:700; font-size:1.55cqh; color:var(--muted); letter-spacing:.02em; }
  .cteam{ min-width:0; }
  .cteam .n{ font-family:var(--display); font-weight:700; font-size:1.8cqh; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cteam .p{ color:var(--muted); font-size:1.28cqh; margin-top:.3cqh; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cbar{ height:1.5cqh; border-radius:1cqh; background:rgba(255,255,255,.06); overflow:hidden; }
  .cbar > i{ display:block; height:100%; background:var(--sq); border-radius:1cqh; }
  .cpts{ font-family:var(--display); font-weight:800; font-size:2.3cqh; text-align:right; font-variant-numeric:tabular-nums; }

  /* stats */
  .stats{ flex:1; display:grid; grid-template-rows:auto 1fr; gap:1.6cqh; min-height:0; }
  .tiles{ display:grid; grid-template-columns:repeat(4,1fr); gap:1.4cqh; }
  .tile{ background:var(--panel2); border:1px solid var(--line-soft); border-radius:1.4cqh; padding:1.3cqh 1.5cqh; }
  .tile .k{ color:var(--muted); font-weight:700; letter-spacing:.14em; text-transform:uppercase; font-size:1.05cqh; }
  .tile .v{ font-family:var(--display); font-weight:800; font-size:3.4cqh; line-height:1; margin-top:.7cqh; font-variant-numeric:tabular-nums; }
  .tile .s{ color:var(--muted); font-size:1.2cqh; margin-top:.5cqh; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile .v.sm{ font-size:2.1cqh; }
  .stats-cols{ display:grid; grid-template-columns: 1.15fr 1fr; gap:1.6cqh; min-height:0; }
  .lead-list{ display:flex; flex-direction:column; justify-content:space-around; flex:1; padding:.4cqh .5cqh; gap:.55cqh; }
  .lead-row{ display:grid; grid-template-columns: 2.4cqh 1.6cqh 1fr auto; align-items:center; gap:1.1cqh; padding:.7cqh 1cqh; border-radius:1cqh; }
  .lead-row:nth-child(odd){ background:rgba(255,255,255,.022); }
  .lead-row .i{ font-family:var(--display); font-weight:700; color:var(--muted); text-align:center; font-size:1.5cqh; }
  .lead-row .nm{ font-family:var(--display); font-weight:700; font-size:1.6cqh; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lead-row .sub{ color:var(--muted); font-size:1.18cqh; margin-top:.28cqh; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lead-row .pt{ font-family:var(--display); font-weight:800; font-size:2cqh; font-variant-numeric:tabular-nums; }
  .bars{ padding:1cqh 1.6cqh; display:flex; flex-direction:column; justify-content:space-around; flex:1; gap:.6cqh; }
  .bar-row{ display:grid; grid-template-columns: 8.5cqh 1fr 3.2cqh; align-items:center; gap:1.2cqh; }
  .bar-row .lab{ font-family:var(--display); font-weight:700; font-size:1.4cqh; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar-track{ height:1.7cqh; background:rgba(255,255,255,.05); border-radius:1cqh; overflow:hidden; }
  .bar-track > i{ display:block; height:100%; border-radius:1cqh; background:var(--sq); }
  .bar-row .bv{ font-family:var(--display); font-weight:800; font-size:1.75cqh; text-align:right; font-variant-numeric:tabular-nums; }

  .sub-card-h{ display:flex; align-items:center; justify-content:space-between; padding:1.2cqh 1.6cqh .4cqh; }

  /* ---------- fixtures / order of play ---------- */
  .fx{ flex:1; display:grid; gap:1.6cqh; min-height:0; }
  .fx.split{ grid-template-rows:auto 1fr; }
  .fx.solo{ grid-template-rows:1fr; }
  .fx-sec-h{ display:flex; align-items:center; justify-content:space-between; margin-bottom:.9cqh; }
  .fx-sec-h .lbl{ font-family:var(--display); font-weight:700; font-size:1.95cqh; display:flex; align-items:center; gap:1.1cqh; }
  .livepill{ display:inline-flex; align-items:center; gap:.6cqh; color:var(--loss); font-weight:800; font-size:1.2cqh; letter-spacing:.16em; text-transform:uppercase; }
  .livepill i{ width:.95cqh; height:.95cqh; border-radius:50%; background:var(--loss); animation:pulse2 1.5s infinite; }
  @keyframes pulse2{ 0%{box-shadow:0 0 0 0 rgba(242,100,126,.5);} 70%{box-shadow:0 0 0 1.1cqh rgba(242,100,126,0);} 100%{box-shadow:0 0 0 0 rgba(242,100,126,0);} }
  .fx-live{ display:grid; grid-template-columns:repeat(3,1fr); gap:1.4cqh; }
  .lmatch{ background:linear-gradient(180deg,var(--panel2),var(--panel3)); border:1px solid rgba(242,100,126,.32); border-radius:1.5cqh; padding:1.3cqh 1.6cqh 1.5cqh; display:flex; flex-direction:column; gap:1.2cqh; }
  .lmatch .ltop{ display:flex; align-items:center; justify-content:space-between; }
  .lmatch .court{ font-family:var(--display); font-weight:700; font-size:1.55cqh; }
  .lmatch .lcat{ color:var(--muted); font-size:1.2cqh; font-weight:600; }
  .lteams{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:1cqh; }
  .lteam{ display:flex; align-items:center; gap:.8cqh; min-width:0; }
  .lteam.r{ flex-direction:row-reverse; text-align:right; }
  .lteam .lt{ min-width:0; }
  .lteam .n{ font-family:var(--display); font-weight:700; font-size:1.7cqh; line-height:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lteam .p{ color:var(--muted); font-size:1.15cqh; margin-top:.3cqh; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lscore{ font-family:var(--display); font-weight:800; font-size:3cqh; font-variant-numeric:tabular-nums; letter-spacing:.02em; }
  .lscore .dash{ color:var(--muted); margin:0 .4cqh; }

  .fx-list{ display:flex; flex-direction:column; min-height:0; }
  .fxrows{ flex:1; display:flex; flex-direction:column; justify-content:space-around; padding:.3cqh 1.6cqh 1cqh; }
  .fxrow{ display:grid; grid-template-columns: 6.5cqh 8.5cqh 12cqh 1fr; align-items:center; gap:1.4cqh; padding:.75cqh 0; border-bottom:1px solid var(--line-soft); }
  .fxrow:last-child{ border-bottom:0; }
  .fxrow .time{ font-family:var(--display); font-weight:800; font-size:1.95cqh; font-variant-numeric:tabular-nums; }
  .fxrow .courtpill{ justify-self:start; font-weight:700; font-size:1.2cqh; color:var(--muted); background:rgba(255,255,255,.05); border:1px solid var(--line-soft); border-radius:.7cqh; padding:.42cqh .8cqh; white-space:nowrap; }
  .fxrow .fcat{ color:var(--muted); font-weight:600; font-size:1.4cqh; }
  .fxvs{ display:flex; align-items:center; gap:1.1cqh; min-width:0; }
  .fxteam{ display:flex; align-items:center; gap:.7cqh; min-width:0; flex:1; }
  .fxteam.r{ flex-direction:row-reverse; text-align:right; }
  .fxteam .n{ font-family:var(--display); font-weight:700; font-size:1.55cqh; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .fxvs .v{ color:var(--muted); font-weight:700; font-size:1.2cqh; flex:none; }
  .fx-empty{ flex:1; display:grid; place-items:center; text-align:center; }
  .fx-empty .big{ font-family:var(--display); font-weight:700; font-size:2.4cqh; color:var(--muted); }
  .fx-empty .sm{ color:var(--faint); font-size:1.5cqh; margin-top:.8cqh; }

  /* ---------- dock ---------- */
  .dock{ display:flex; align-items:center; justify-content:space-between; padding:1cqh 3cqh 2cqh; gap:2cqh; }
  .dots{ display:flex; gap:1cqh; align-items:center; }
  .navdot{ display:flex; align-items:center; gap:.7cqh; color:var(--muted); font-weight:700; font-size:1.25cqh; letter-spacing:.04em; opacity:.55; transition:opacity .3s; }
  .navdot i{ width:1cqh; height:1cqh; border-radius:50%; background:currentColor; }
  .navdot.on{ opacity:1; color:var(--brand); }
  .upnext{ color:var(--muted); font-weight:600; font-size:1.3cqh; }
  .upnext b{ color:var(--ink); font-weight:700; }
  .ticker{ display:flex; align-items:center; gap:1.4cqh; color:var(--muted); font-weight:600; font-size:1.3cqh; overflow:hidden; }
  .ticker .res{ display:inline-flex; align-items:center; gap:.7cqh; white-space:nowrap; }
  .ticker .sc{ font-family:var(--display); font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums; }
  .ticker .w{ color:var(--win); } .ticker .l{ color:var(--loss); }

  @media (prefers-reduced-motion: reduce){
    .scene{ transition:none; }
    .dot{ animation:none; }
    .rot > i{ transition:none !important; }
  }

  /* order of play (live: pairings only) */
  .fxwrap{ flex:1; display:grid; grid-template-columns:repeat(3,1fr); grid-auto-rows:min-content; gap:1.4cqh 2.2cqh; padding:1.2cqh 1.8cqh; overflow:hidden; align-content:start; }
  .fxcat{ min-width:0; }
  .fxcat-h{ display:flex; align-items:center; gap:.8cqh; font-family:var(--display); font-weight:700; font-size:1.7cqh; padding-bottom:.5cqh; border-bottom:1px solid var(--line); margin-bottom:.4cqh; }
  .fxcat-h .cnt{ margin-left:auto; color:var(--muted); font-weight:600; font-size:1.15cqh; letter-spacing:.02em; }
  .fxmatch{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:.9cqh; padding:.5cqh 0; font-size:1.35cqh; }
  .fxmatch .tm{ font-family:var(--display); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }

const IDS=LEAGUES.map(l=>l.id);

/* ---------- helpers ---------- */
const norm=s=>(s||"").trim().toLowerCase().replace(/\s+/g," ");
const two=n=>String(n).padStart(2,"0");
function esc(s){return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
async function q(path){const r=await fetch(SUPA+"/rest/v1/"+path,{headers:{apikey:ANON,Authorization:"Bearer "+ANON}});if(!r.ok)throw new Error(r.status);return r.json();}
function clubById(id){return id&&PROF[id]?PROF[id]:null;}
function clubByName(n){return NAME[norm(n)]||null;}
function teamClub(t){return clubById(t.player1_profile_id)||clubById(t.player2_profile_id)||clubByName(t.team_name)||clubByName(t.player2_name)||(t.team_name||"").split("&").map(clubByName).find(Boolean)||null;}
function fmtRate(v){return (v==null||v===""||isNaN(+v)||+v===0)?"":(+v).toFixed(2);}
function cleanName(n){n=(n||"").trim();const at=n.indexOf("@");return at>0?n.slice(0,at):n;}
function playersStack(ti){
  const line=(nm,r)=>nm?`<span class="pl">${esc(cleanName(nm))}${r?` <span class="rt">${r}</span>`:""}</span>`:"";
  return line(ti.p1,ti.r1)+line(ti.p2,ti.r2);
}
// Overall-team badge: the club's logo if set, otherwise the coloured letter.
function clubBadge(club,cls){
  const s=SQUAD[club], logo=CLUB_LOGOS[club];
  if(logo) return `<div class="${cls}" style="padding:0;overflow:hidden;background:#0b1220"><img src="${logo}" alt="" style="width:100%;height:100%;object-fit:cover;display:block"></div>`;
  return `<div class="${cls}" style="background:${s.color}">${s.short}</div>`;
}
// Per-pairing chip: the club's logo if that club has one, otherwise its colour.
function pairChip(club,col){
  const logo=club&&CLUB_LOGOS[club];
  if(logo) return `<span class="chip" style="padding:0;overflow:hidden;background:#0b1220"><img src="${logo}" alt="" style="width:100%;height:100%;object-fit:cover;display:block"></span>`;
  return `<span class="chip" style="--sq:${col||'#33415a'}"></span>`;
}

let regByTeam={}, LEVELS={}, MODEL=null, curSpotIdx=0, curSpotClub=null, curScene=0;

function teamInfo(t){
  const r=regByTeam[t.id]||{};
  const name=((t.team_name||r.team_name||"")+"").trim()||"—";
  const logo=((t.team_logo_url||r.team_logo_url||"")+"").trim();
  const p1=((r.player1_name||t.player1_name||"")+"").trim();
  const p2=((r.player2_name||t.player2_name||"")+"").trim();
  return {name,logo,p1,p2,r1:fmtRate(LEVELS[t.player1_profile_id]),r2:fmtRate(LEVELS[t.player2_profile_id])};
}
function playersHTML(ti){
  const a=ti.p1?esc(cleanName(ti.p1))+(ti.r1?` <span class="rt">${ti.r1}</span>`:""):"";
  const b=ti.p2?esc(cleanName(ti.p2))+(ti.r2?` <span class="rt">${ti.r2}</span>`:""):"";
  return [a,b].filter(Boolean).join(" · ");
}

/* ---------- build model ---------- */
function build(teams,matches,comps,regs){
  regByTeam={}; (regs||[]).forEach(r=>{if(r.resulting_team_id)regByTeam[r.resulting_team_id]=r;});
  const byLeague={}; IDS.forEach(id=>byLeague[id]={teams:[],matches:[],status:"setup"});
  comps.forEach(c=>{if(byLeague[c.id])byLeague[c.id].status=c.status;});
  teams.forEach(t=>{if(byLeague[t.tournament_id])byLeague[t.tournament_id].teams.push(t);});
  matches.forEach(m=>{if(byLeague[m.tournament_id])byLeague[m.tournament_id].matches.push(m);});
  LEAGUES.forEach(L=>byLeague[L.id].teams.sort((a,b)=>((b.league_points||0)-(a.league_points||0))||(((b.points_for||0)-(b.points_against||0))-((a.points_for||0)-(a.points_against||0)))||(a.team_name||"").localeCompare(b.team_name||"")));
  const tot={}; CLUBS.forEach(c=>tot[c]={club:c,pts:0,pairsIn:0,leads:0});
  LEAGUES.forEach(L=>byLeague[L.id].teams.forEach((t,i)=>{const c=teamClub(t);if(!c||!tot[c])return;tot[c].pts+=(t.league_points||0);tot[c].pairsIn++;if(i===0&&(t.played||0)>0)tot[c].leads++;}));
  const overall=CLUBS.slice().sort((a,b)=>(tot[b].pts-tot[a].pts)||(tot[b].leads-tot[a].leads)||CLUBS.indexOf(a)-CLUBS.indexOf(b)).map(c=>tot[c]);
  const squadTeams={}; CLUBS.forEach(c=>squadTeams[c]=[]);
  LEAGUES.forEach(L=>byLeague[L.id].teams.forEach(t=>{const c=teamClub(t);if(c&&squadTeams[c])squadTeams[c].push({league:L,t});}));
  MODEL={byLeague,overall,tot,squadTeams};
}

/* ---------- renders ---------- */
function renderRail(){
  document.getElementById("rail").innerHTML=MODEL.overall.map((o,i)=>{
    const s=SQUAD[o.club];
    return `<div class="team-row${i===0&&o.pts>0?' lead':''}" style="--sq:${s.color}">
      <div class="rank">${i+1}</div>
      ${clubBadge(o.club,'badge')}
      <div><div class="team-name">${esc(o.club)}</div>
        <div class="team-sub"><span><b>${o.pairsIn}</b>/6 pairs</span><span><b>${o.leads}</b> cat ${o.leads===1?'lead':'leads'}</span></div></div>
      <div class="team-pts"><span class="n">${o.pts}</span><span class="u">pts</span></div>
    </div>`;
  }).join("");
}
function renderCats(){
  document.getElementById("cats").innerHTML=LEAGUES.map(L=>{
    const d=MODEL.byLeague[L.id];
    const pill=d.status&&d.status!=="active"?`<span class="cap" style="color:#9fc7ff">${esc(d.status)}</span>`:"";
    let body;
    if(d.teams.length===0){ body=`<div class="await">Awaiting pairs…</div>`; }
    else{
      const rows=d.teams.map((t,i)=>{
        const c=teamClub(t), col=c?SQUAD[c].color:"#33415a", ti=teamInfo(t);
        return `<div class="trow${i===0&&(t.played||0)>0?' top':''}">
          <div class="p-idx">${i+1}</div>
          <div class="pair">${pairChip(c,col)}
            <div class="pair-txt"><div class="pair-name">${esc(ti.name)}</div>
              <div class="pair-players">${playersStack(ti)}</div></div></div>
          <div class="r">${t.won||0}</div><div class="r">${t.drawn||0}</div><div class="r">${t.lost||0}</div>
          <div class="r pts">${t.league_points||0}</div></div>`;
      }).join("");
      body=`<div class="thead"><div></div><div style="text-align:left;letter-spacing:.1em">Pair</div><div class="r">W</div><div class="r">D</div><div class="r">L</div><div class="r">Pts</div></div><div class="tbody">${rows}</div>`;
    }
    return `<div class="card cat"><div class="card-h"><div class="card-t">${esc(L.label)} ${pill}</div><div class="cap">CAP ${L.cap.toFixed(2)}</div></div>${body}</div>`;
  }).join("");
}
function renderSpot(club){
  curSpotClub=club;
  const s=SQUAD[club], o=MODEL.tot[club], pos=MODEL.overall.findIndex(x=>x.club===club)+1;
  const list=MODEL.squadTeams[club]||[];
  const maxC=Math.max(1,...CLUBS.flatMap(c=>(MODEL.squadTeams[c]||[]).map(x=>x.t.league_points||0)));
  const combos=list.map(x=>{const ti=teamInfo(x.t);return (+ti.r1||0)+(+ti.r2||0);});
  const best=combos.length?Math.max(...combos):0;
  const rows=LEAGUES.map(L=>{
    const item=list.find(x=>x.league.id===L.id);
    if(!item) return `<div class="crow empty"><div class="ccat">${esc(L.label)}</div><div class="cteam"><div class="n" style="color:var(--muted)">— no pair entered —</div></div><div class="cbar"><i style="width:0"></i></div><div class="cpts">–</div></div>`;
    const ti=teamInfo(item.t), pts=item.t.league_points||0;
    return `<div class="crow"><div class="ccat">${esc(L.label)}</div>
      <div class="cteam"><div class="n">${esc(ti.name)}</div><div class="p">${playersHTML(ti)}</div></div>
      <div class="cbar"><i style="width:${Math.round(pts/maxC*100)}%;background:${s.color}"></i></div>
      <div class="cpts">${pts}</div></div>`;
  }).join("");
  document.getElementById("spot").innerHTML=`
    <div class="spot-head">
      ${clubBadge(club,'spot-badge')}
      <div class="spot-id"><div class="spot-rankline"><span class="pos" style="color:${s.color}">#${pos}</span> · Overall</div>
        <div class="spot-name">${esc(club)}</div>
        <div class="spot-meta"><span><b>${o.pairsIn}</b>/6 pairs in</span><span><b>${o.leads}</b> category ${o.leads===1?'lead':'leads'}</span>${best>0?`<span>Best rated pair <b>${best.toFixed(2)}</b></span>`:''}</div></div>
      <div class="spot-total"><div class="n" style="color:${s.color}">${o.pts}</div><div class="u">points</div></div>
    </div>
    <div class="contrib" style="--sq:${s.color}">${rows}</div>`;
}
function renderStats(){
  const all=LEAGUES.flatMap(L=>MODEL.byLeague[L.id].teams.map(t=>({L,t})));
  const played=LEAGUES.reduce((a,L)=>a+MODEL.byLeague[L.id].matches.filter(m=>m.score_a!=null&&m.score_b!=null).length,0);
  const unbeaten=all.filter(x=>(x.t.lost||0)===0&&(x.t.played||0)>0).length;
  const lead=MODEL.overall[0];
  const tiles=[
    {k:"Matches Played",v:played,s:"across 6 categories"},
    {k:"Pairs Competing",v:all.length,s:`${MODEL.overall.reduce((a,o)=>a+o.pairsIn,0)} entries`},
    {k:"League Leader",v:lead&&lead.pts>0?esc(lead.club):"—",sm:true,s:lead&&lead.pts>0?`${lead.pts} pts · ${lead.leads} category leads`:"awaiting results"},
    {k:"Unbeaten Pairs",v:unbeaten,s:"no losses yet"},
  ];
  document.getElementById("tiles").innerHTML=tiles.map(t=>`<div class="tile"><div class="k">${t.k}</div><div class="v${t.sm?' sm':''}">${t.v}</div><div class="s">${t.s}</div></div>`).join("");
  const leaders=all.slice().sort((a,b)=>((b.t.league_points||0)-(a.t.league_points||0))||(((b.t.points_for||0)-(b.t.points_against||0))-((a.t.points_for||0)-(a.t.points_against||0)))).slice(0,6);
  document.getElementById("leaders").innerHTML=leaders.map((x,i)=>{
    const c=teamClub(x.t), col=c?SQUAD[c].color:"#33415a", ti=teamInfo(x.t);
    return `<div class="lead-row"><div class="i">${i+1}</div>${pairChip(c,col)}
      <div style="min-width:0"><div class="nm">${esc(ti.name)}</div><div class="sub">${esc(x.L.label)}${ti.p1?' · '+esc(ti.p1)+(ti.p2?' & '+esc(ti.p2):''):''}</div></div>
      <div class="pt">${x.t.league_points||0}<span style="color:var(--muted);font-size:1.1cqh;font-weight:700"> pts</span></div></div>`;
  }).join("");
  const maxP=Math.max(1,...MODEL.overall.map(o=>o.pts));
  document.getElementById("bars").innerHTML=MODEL.overall.map(o=>{
    const s=SQUAD[o.club];
    return `<div class="bar-row"><div class="lab">${esc(o.club)}</div><div class="bar-track"><i style="width:${Math.round(o.pts/maxP*100)}%;background:${s.color}"></i></div><div class="bv">${o.pts}</div></div>`;
  }).join("");
}
function renderResults(){
  const played=[];
  LEAGUES.forEach(L=>{
    const d=MODEL.byLeague[L.id];
    d.matches.filter(m=>m.score_a!=null&&m.score_b!=null).forEach(m=>{
      const nameOf=(i1,i2)=>{const t=d.teams.find(t=>{const s=new Set([t.player1_profile_id,t.player2_profile_id]);return s.has(i1)&&s.has(i2);});return t?teamInfo(t).name:"Pair";};
      played.push({a:nameOf(m.player_a1_id,m.player_a2_id),b:nameOf(m.player_b1_id,m.player_b2_id),sa:m.score_a,sb:m.score_b});
    });
  });
  const t=document.getElementById("ticker");
  if(!played.length){ t.innerHTML="<span style='letter-spacing:.2em;text-transform:uppercase;font-size:1.05cqh;color:var(--muted)'>Results appear here as scores come in</span>"; return; }
  t.innerHTML="<span style='letter-spacing:.2em;text-transform:uppercase;font-size:1.05cqh;color:var(--muted)'>Latest&nbsp;</span>"+
    played.slice(-4).reverse().map(r=>`<span class="res">${esc(r.a)} <span class="sc">${r.sa}–${r.sb}</span> ${esc(r.b)}</span>`).join("<span style='opacity:.3'>•</span>");
}
function renderFixtures(){
  const fx=document.getElementById("fx"); fx.className="fx solo";
  const anyMatches=LEAGUES.some(L=>MODEL.byLeague[L.id].matches.length>0);
  if(!anyMatches){
    fx.innerHTML=`<div class="card fx-list"><div class="fx-empty"><div><div class="big">Order of play to be published</div><div class="sm">Fixtures appear here as soon as the organiser generates them.</div></div></div></div>`;
    return;
  }
  const blocks=LEAGUES.map(L=>{
    const d=MODEL.byLeague[L.id];
    if(d.matches.length===0) return "";
    const up=d.matches.filter(m=>m.score_a==null||m.score_b==null);
    const nameOf=(i1,i2)=>{const t=d.teams.find(t=>{const s=new Set([t.player1_profile_id,t.player2_profile_id]);return s.has(i1)&&s.has(i2);});return t?teamInfo(t).name:"Pair";};
    let inner;
    if(up.length===0){ inner=`<div class="none">All fixtures played ✓</div>`; }
    else{
      inner=up.slice(0,8).map(m=>{
        const A=nameOf(m.player_a1_id,m.player_a2_id), B=nameOf(m.player_b1_id,m.player_b2_id);
        return `<div class="fxmatch"><span class="tm">${esc(A)}</span><span class="v">v</span><span class="tm b">${esc(B)}</span></div>`;
      }).join("");
    }
    return `<div class="fxcat"><div class="fxcat-h">${esc(L.label)}<span class="cnt">${up.length?up.length+' to play':'complete'}</span></div>${inner}</div>`;
  }).join("");
  fx.innerHTML=`<div class="card fx-list"><div class="sub-card-h"><div class="card-t">Order of Play</div><div class="eyebrow">Upcoming fixtures</div></div><div class="fxwrap">${blocks}</div></div>`;
}

/* ---------- load ---------- */
async function load(){
  try{
    const inIds="("+IDS.join(",")+")";
    const [teams,matches,comps,regs]=await Promise.all([
      q("league_teams?tournament_id=in."+inIds+"&select=*"),
      q("tournament_matches?tournament_id=in."+inIds+"&select=*"),
      q("tournaments?id=in."+inIds+"&select=id,name,status"),
      q("league_registrations?tournament_id=in."+inIds+"&status=eq.approved&select=resulting_team_id,team_name,team_logo_url,player1_name,player2_name")
    ]);
    // best-effort player ratings — never let this break the board
    try{
      const ids=[...new Set(teams.flatMap(t=>[t.player1_profile_id,t.player2_profile_id]).filter(Boolean))];
      if(ids.length){ const rows=await q("profiles?id=in.("+ids.join(",")+")&select=id,level"); LEVELS={}; rows.forEach(p=>{LEVELS[p.id]=p.level;}); }
    }catch(e){ /* ratings unavailable — names still show */ }
    build(teams,matches,comps,regs);
    if(!curSpotClub) curSpotClub=CLUBS[0];
    renderRail(); renderCats(); renderStats(); renderResults(); renderFixtures(); renderSpot(curSpotClub);
    const now=new Date();
    document.getElementById("updated").innerHTML=`updated ${now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}`;
    document.querySelector(".live .dot").style.background="var(--win)";
  }catch(e){
    const u=document.getElementById("updated"); if(u) u.textContent="connection error — retrying";
    const dot=document.querySelector(".live .dot"); if(dot) dot.style.background="var(--loss)";
  }
}

/* ---------- rotation ---------- */
const SCENES=[
  {id:"cats",     label:"Category Tables", dur:16000},
  {id:"spot",     label:"Team Spotlight",  dur:11000, spotlight:true},
  {id:"fixtures", label:"Order of Play",   dur:12000},
  {id:"stats",    label:"Tournament Stats",dur:13000},
];
const sceneEls={}; document.querySelectorAll(".scene").forEach(e=>sceneEls[e.dataset.scene]=e);
const dotsEl=document.getElementById("dots");
dotsEl.innerHTML=SCENES.map((s,i)=>`<span class="navdot" data-i="${i}"><i></i>${s.label}</span>`).join("");
const dotEls=[...dotsEl.querySelectorAll(".navdot")];
const rotbar=document.getElementById("rotbar"), upnext=document.getElementById("upnext");
let timer=null; const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function show(i){
  curScene=(i+SCENES.length)%SCENES.length;
  const sc=SCENES[curScene];
  if(sc.spotlight && MODEL){ renderSpot(CLUBS[curSpotIdx%CLUBS.length]); curSpotIdx++; }
  Object.values(sceneEls).forEach(e=>e.classList.remove("on"));
  sceneEls[sc.id].classList.add("on");
  dotEls.forEach((d,di)=>d.classList.toggle("on",di===curScene));
  upnext.innerHTML=`Up next · <b>${SCENES[(curScene+1)%SCENES.length].label}</b>`;
  if(!reduce){ rotbar.style.transition="none"; rotbar.style.width="0%"; requestAnimationFrame(()=>{rotbar.style.transition=`width ${sc.dur}ms linear`;rotbar.style.width="100%";}); }
  else rotbar.style.width="100%";
  clearTimeout(timer); timer=setTimeout(()=>show(curScene+1),sc.dur);
}

/* ---------- clock + boot ---------- */
function tick(){const d=new Date();document.getElementById("clock").textContent=`${two(d.getHours())}:${two(d.getMinutes())}`;}
tick(); setInterval(tick,1000);
show(0);
load(); setInterval(load,20000);

</script>
