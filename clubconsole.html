<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Padeja Club Console</title>
<style>
  :root{--bg:#0A1624;--card:#162035;--line:#22344d;--brand:#3BC8F5;--green:#35D6A4;--gold:#F5B83D;--sec:#8AA4C0;--white:#fff;--loss:#F56040}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
  .wrap{max-width:720px;margin:0 auto;padding:16px;padding-bottom:70px}
  h1{font-size:21px;margin:2px 0}
  h2.sec{font-size:12px;color:var(--sec);text-transform:uppercase;letter-spacing:.5px;margin:16px 2px 8px;font-weight:700}
  .muted{color:var(--sec);font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;background:var(--green);color:#06231a}
  .btn:disabled{opacity:.5}
  .btn.sec{background:var(--card);color:var(--white);border:1px solid var(--line)}
  .btn.gold{background:var(--gold);color:#2a1e00}
  .btn.small{width:auto;padding:9px 14px;font-size:13px;display:inline-block}
  input.f,select.f{width:100%;background:#0e1a2b;border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--white);font-size:15px;margin-bottom:10px}
  .lbl{font-size:11px;color:var(--sec);text-transform:uppercase;letter-spacing:.4px;font-weight:700;margin:2px 2px 5px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .back{background:var(--card);border:1px solid var(--line);color:var(--sec);border-radius:10px;width:38px;height:38px;font-size:18px;cursor:pointer;flex:0 0 auto}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:#22344d;color:#cdd9e6;text-transform:capitalize}
  .code{font-size:30px;font-weight:800;letter-spacing:4px;color:var(--gold);text-align:center;margin:2px 0}
  .tabs{display:flex;gap:8px;margin:8px 0 14px}
  .tab{flex:1;text-align:center;padding:10px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--sec);font-weight:700;font-size:13px;cursor:pointer}
  .tab.on{background:var(--green);color:#06231a;border-color:var(--green)}
  .plrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #1b2942}
  .plrow:last-child{border-bottom:0}
  .plrow .n{flex:1;font-size:14px}
  .plrow .rm{background:#22344d;color:var(--loss);border:0;border-radius:8px;width:30px;height:30px;font-size:16px;cursor:pointer}
  .addrow{display:flex;gap:8px;margin-top:10px}
  .addrow input{flex:1;margin-bottom:0}
  .addrow button{flex:0 0 auto}
  .meta{font-size:11px;color:var(--sec);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
  .rgrp{margin-bottom:6px}
  .mt{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #1b2942}
  .mt:last-child{border-bottom:0}
  .team{flex:1;font-size:14px;font-weight:600;line-height:1.25}
  .team.b{text-align:right}
  .sc{width:50px;text-align:center;background:#0e1a2b;border:1px solid var(--line);border-radius:9px;padding:9px 4px;color:var(--white);font-size:17px;font-weight:700}
  input[type=number]{color-scheme:dark}
  .dash{color:var(--sec);font-weight:700}
  .save{background:var(--green);color:#06231a;border:0;border-radius:9px;padding:8px 12px;font-weight:800;font-size:13px;cursor:pointer}
  .save.ok{background:rgba(53,214,164,.18);color:var(--green)}
  table.stand{width:100%;border-collapse:collapse;font-size:13px}
  table.stand th{color:var(--sec);text-transform:uppercase;font-size:10px;text-align:left;padding:6px;border-bottom:1px solid var(--line)}
  table.stand td{padding:8px 6px;border-bottom:1px solid #1b2942}
  table.stand td.n{text-align:center;width:34px}
  table.stand td.pts{text-align:center;font-weight:800;color:var(--green);width:44px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:#0e1a2b;border:1px solid var(--line);color:#fff;padding:11px 16px;border-radius:12px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;z-index:50}
  .toast.show{opacity:1}
  .toast.err{border-color:var(--loss);color:#ffd7cd}
  .err{color:var(--loss);font-size:13px;margin:6px 2px}
  .center{text-align:center}
  .hint{font-size:11px;color:#7f92a8;margin:-4px 2px 10px}
  /* ---- brand + polish ---- */
  .appbar{display:flex;align-items:center;gap:10px;margin:6px 0 16px}
  .brandlock{display:flex;align-items:center;gap:11px;flex:1;min-width:0}
  .brandlock img{width:36px;height:36px;border-radius:11px;display:block;box-shadow:0 3px 12px rgba(6,180,212,.35);flex:0 0 auto}
  .wm{line-height:1.05}
  .wm .nm{font-size:20px;font-weight:800;letter-spacing:-.3px;background:linear-gradient(90deg,#06C3B1,#06B4D4 45%,#14A6F4);-webkit-background-clip:text;background-clip:text;color:transparent;display:block}
  .wm .sub{display:block;font-size:9.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--sec);margin-top:2px}
  .btn.grad{background:linear-gradient(90deg,#06C3B1,#14A6F4);color:#03202b}
  .btn.danger{background:transparent;border:1px solid #5c2b2b;color:#F58A7A;box-shadow:none}
  .card.codecard{background:linear-gradient(135deg,rgba(6,195,177,.12),rgba(20,166,244,.10));border-color:#1c3a52}
  .brandhero{display:flex;flex-direction:column;align-items:center;gap:12px;margin:30px 0 20px}
  .brandhero img{width:70px;height:70px;border-radius:20px;box-shadow:0 8px 26px rgba(6,180,212,.4)}
  .modal{position:fixed;inset:0;background:rgba(4,10,18,.62);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60}
  .modal .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:360px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .modal h3{margin:0 0 6px;font-size:17px}
  .modal p{margin:0 0 16px;color:var(--sec);font-size:13.5px;line-height:1.45}
  .modal .row{display:flex;gap:10px}
  .modal .row .btn{flex:1}
</style>
</head>

// Reusable confirm dialog (avoids native confirm()).
function confirmModal(title,msg,okLabel,onOk,danger){
  const m=document.createElement("div"); m.className="modal";
  m.innerHTML=`<div class="box"><h3>${esc(title)}</h3><p>${esc(msg)}</p>
    <div class="row"><button class="btn sec" id="cmNo">Cancel</button><button class="btn ${danger?'danger':'grad'}" id="cmYes">${esc(okLabel)}</button></div></div>`;
  document.body.appendChild(m);
  const close=()=>m.remove();
  m.addEventListener("click",e=>{ if(e.target===m) close(); });
  m.querySelector("#cmNo").onclick=close;
  m.querySelector("#cmYes").onclick=async()=>{ m.querySelector("#cmYes").disabled=true; try{ await onOk(); } finally { close(); } };
}

function login(){
  wrap.innerHTML=`<div class="brandhero">${logoTag(70,20)}<div class="center">${wordmark("Club Console")}<div class="muted" style="margin-top:8px;max-width:300px">Sign in with your Padeja account to set up and run your club's competitions.</div></div></div>

async function doLogin(){
  const email=$("email").value.trim(), password=$("pw").value; if(!email||!password)return;
  $("lb").textContent="Signing in…"; $("lb").disabled=true;

  home();
}

async function reload(){
  if(CUR.variant==="americano_fixed"){
    const {data}=await sb.rpc("get_afx_display",{p_code:CUR.share_code});
    AFX=(data&&data.afx)?data.afx:{players:[],matches:[],standings:[]};
    PLAYERS=(AFX.players||[]).map(p=>p.name);
  } else if(CUR.variant==="mexicano"){
    const {data}=await sb.rpc("get_host_display",{p_code:CUR.share_code});
    MX=(data&&data.players!==undefined)?{players:data.players||[],rounds:data.rounds||[],matches:data.matches||[]}:{players:[],rounds:[],matches:[]};
    if(!(MX.rounds||[]).length) PLAYERS=(MX.players||[]).map(p=>p.display_name);
  } else {
    const {data}=await sb.rpc("get_host_display",{p_code:CUR.share_code});
    LG=(data&&data.matches!==undefined)?data:{leagues:[],teams:[],matches:[]};
    const kd=await sb.rpc("get_knockout",{p_code:CUR.share_code}); KO=(kd&&kd.data)||[];
    const kc=await sb.rpc("get_knockout_courts",{p_tournament_id:CUR.tournament_id}); KOCOURTS={}; ((kc&&kc.data)||[]).forEach(r=>KOCOURTS[r.ord]=r.court);
    const pp=await sb.rpc("get_event_pairs",{p_code:CUR.share_code}); PAIRS={}; ((pp&&pp.data)||[]).forEach(p=>PAIRS[p.team_id]={n1:p.team_name,n2:p.player2_name});
    try{ const {data:trow}=await sb.from("tournaments").select("points_for_win,points_for_draw,points_for_loss,points_per_played,playoff_teams").eq("id",CUR.tournament_id).maybeSingle(); LGSET=trow||{}; }catch(e){ LGSET={}; }

  }
  renderManage();
}

function drawPlist(){
  const el=$("plist");
  if(!PLAYERS.length){ el.innerHTML=`<div class="muted">No players yet — add them below.</div>`; return; }
  el.innerHTML=PLAYERS.map((n,i)=>`<div class="plrow"><div class="n">${i+1}. ${esc(n)}</div><button class="rm" data-i="${i}">×</button></div>`).join("");
  [...el.querySelectorAll(".rm")].forEach(b=>b.onclick=()=>{PLAYERS.splice(+b.dataset.i,1);renderBuild();});
}
function addPlayer(){
  const raw=$("pAdd").value;
  const parts=raw.split(/[\n,]/).map(s=>s.trim()).filter(Boolean);
  for(const p of parts){ if(!PLAYERS.some(x=>x.toLowerCase()===p.toLowerCase())) PLAYERS.push(p); }
  $("pAdd").value=""; renderBuild(); $("pAdd") && $("pAdd").focus();
}

async function generate(){
  if(PLAYERS.length<4){ toast("Add at least 4 players",true); return; }
  // dedupe names (fixtures join by name, so names must be unique)
  const seen=new Set(); for(const n of PLAYERS){ const k=n.toLowerCase(); if(seen.has(k)){toast("Two players have the same name: "+n+". Make names unique.",true);return;} seen.add(k); }
  const courts=$("sCourts").value.split(",").map(s=>s.trim()).filter(Boolean);
  if(!courts.length){ toast("Enter at least one court",true); return; }
  const rounds=Math.max(1,Math.min(20,parseInt($("sRounds").value)||12));
  const [mMin,cMin]=($("sLen").value.split("/").map(x=>parseInt(x.trim())||0)); const matchMin=mMin||10, changeMin=(isNaN(cMin)?5:cMin);
  const start=parseTime($("sStart").value)|| (13*60);
  const wantFinal=$("sFinal").checked;

  $("genBtn").disabled=true; $("genBtn").textContent="Building draw…";
  await new Promise(r=>setTimeout(r,20));
  const draw=generateDraw(PLAYERS.length, courts, rounds);
  if(!draw){ $("genBtn").disabled=false; $("genBtn").textContent="Generate draw"; toast("Couldn't build a draw with those settings — try more rounds or fewer courts.",true); return; }

  // build payloads (names)
  const players=PLAYERS.map((n,i)=>({name:n,seed:i+1}));
  const matches=[];
  draw.forEach((rd,ri)=>{
    const slot=fmtRange(start+ri*(matchMin+changeMin),matchMin);
    // rotate which courts are used so all get used when there are spares
    const need=rd.matches.length;
    const used=[]; for(let k=0;k<need;k++) used.push(courts[(ri+k)%courts.length]);
    used.sort((a,b)=>(""+a).localeCompare(""+b,undefined,{numeric:true}));
    rd.matches.forEach((mt,mi)=>{ const [a1,a2,b1,b2]=mt;
      matches.push({round:ri+1,court:used[mi],slot_time:slot,a1:PLAYERS[a1],a2:PLAYERS[a2],b1:PLAYERS[b1],b2:PLAYERS[b2]}); });
  });
  let final=null;
  if(wantFinal){ final={round:rounds+1,court:courts[0],slot_time:fmtRange(start+rounds*(matchMin+changeMin),matchMin)}; }

  const {error}=await sb.rpc("org_afx_generate",{p_tournament_id:CUR.tournament_id,p_players:players,p_matches:matches,p_final:final});
  if(error){ $("genBtn").disabled=false; $("genBtn").textContent="Generate draw"; toast(error.message,true); return; }
  toast("Draw generated — it's live on the display code");
  await reload();
}
async function seedFinal(){
  const {error}=await sb.rpc("org_afx_seed_final",{p_tournament_id:CUR.tournament_id});
  if(error){ toast(error.message,true); return; }
  toast("Final seeded from standings"); await reload();
}

// ----- score tab -----
function renderScores(){
  const body=$("body");
  const players={}; (AFX.players||[]).forEach(p=>players[p.id]=p.name); const nm=id=>esc(players[id]||"—");
  const ms=(AFX.matches||[]).filter(m=>!m.is_final);
  if(!ms.length){ body.innerHTML=`<div class="muted">No draw yet — generate one in the Players &amp; draw tab.</div>`; return; }
  const byR={}; ms.forEach(m=>{(byR[m.round]=byR[m.round]||[]).push(m);});
  let html="";
  Object.keys(byR).sort((a,b)=>a-b).forEach(r=>{
    const list=byR[r].sort((a,b)=>(""+a.court).localeCompare(""+b.court,undefined,{numeric:true}));
    html+=`<div class="card"><div class="meta">Round ${esc(r)}${list[0].slot_time?" · "+esc(list[0].slot_time):""}</div>`;
    list.forEach(m=>{const done=m.status==="completed";
      html+=`<div class="rgrp"><div class="meta">Court ${esc(m.court)}</div><div class="mt">
        <div class="team">${nm(m.a1_id)} &amp; ${nm(m.a2_id)}</div>
        <input class="sc" type="number" inputmode="numeric" min="0" id="a_${esc(m.id)}" value="${m.score_a!=null?esc(m.score_a):""}">
        <span class="dash">–</span>
        <input class="sc" type="number" inputmode="numeric" min="0" id="b_${esc(m.id)}" value="${m.score_b!=null?esc(m.score_b):""}">
        <div class="team b">${nm(m.b1_id)} &amp; ${nm(m.b2_id)}</div></div>
        <div style="text-align:right;margin-top:4px"><button class="save ${done?'ok':''}" data-s="${esc(m.id)}">${done?'✓ Saved':'Save'}</button></div></div>`;});
    html+=`</div>`;
  });
  body.innerHTML=html;
  [...body.querySelectorAll("[data-s]")].forEach(b=>b.onclick=()=>saveScore(b.getAttribute("data-s")));
}
async function saveScore(mid){
  const a=parseInt($("a_"+mid).value,10), b=parseInt($("b_"+mid).value,10);
  if(Number.isNaN(a)||Number.isNaN(b)){ toast("Enter both scores",true); return; }
  const {error}=await sb.rpc("scorer_afx_set_result",{p_match_id:mid,p_score_a:a,p_score_b:b});
  if(error){ toast(error.message,true); return; }
  toast("Score saved"); await reload();
}

function renderTable(){
  const body=$("body");

// Round-robin "circle" schedule: every team plays once per round, so fixtures
// alternate between teams instead of stacking one team's games together.
function rrSchedule(ids){
  const a=ids.slice();
  if(a.length<2) return [];
  if(a.length%2===1) a.push(null);      // dummy "bye" for odd numbers
  const n=a.length, rounds=n-1, half=n/2;
  const out=[];
  for(let r=0;r<rounds;r++){
    for(let i=0;i<half;i++){
      const h=a[i], g=a[n-1-i];
      if(h!==null && g!==null) out.push(r%2===0?[h,g]:[g,h]); // alternate home/away
    }
    a.splice(1,0,a.pop());               // fix first, rotate the rest
  }
  return out;
}
async function genFixtures(){
  const byDiv={}; (LG.teams||[]).forEach(t=>{(byDiv[t.league_id]=byDiv[t.league_id]||[]).push(t);});

  for(const d of (LG.leagues||[])){
    if(isKoDiv(d)) continue;
    const ts=byDiv[d.id]||[]; if(ts.length<2) continue;
    const pairs=rrSchedule(ts.map(t=>t.id));
    const {data,error}=await sb.rpc("org_insert_league_fixtures",{p_league_id:d.id,p_pairs:pairs});
    if(error){err=error.message;break;} total+=data||0;
  }
  if(err){toast(err,true);return;}
  toast(total>0?("Added "+total+" fixtures"):"Fixtures already up to date"); await reload();
}

function bracketSeedOrder(n){
  let a=[1,2];
  while(a.length<n){ const m=a.length*2+1, next=[]; for(const x of a){ next.push(x); next.push(m-x); } a=next; }
  return a;
}

  if(error){ toast(error.message,true); return; }
  const ids=(quals||[]).map(q=>q.team_id);
  const Q=ids.length;
  if(Q<2){ toast("Need at least 2 qualifiers — check each division has teams and results.",true); return; }
  if((Q&(Q-1))!==0){ toast("Top "+per+" per division makes "+Q+" qualifiers, which won't form a clean bracket. Pick a number that totals 4, 8 or 16.",true); return; }
  const order=bracketSeedOrder(Q), pairs=[];
  for(let i=0;i<Q;i+=2){ pairs.push([ids[order[i]-1], ids[order[i+1]-1]]); }
  const {error:e2}=await sb.rpc("org_knockout_seed",{p_tournament_id:CUR.tournament_id,p_pairs:pairs});
  if(e2){ toast(e2.message,true); return; }
  toast("Knockout seeded — enter scores below"); await reload();
}
async function advanceKnockout(){
  const {data,error}=await sb.rpc("org_knockout_advance",{p_tournament_id:CUR.tournament_id});
  if(error){ toast(error.message,true); return; }
  toast(data||"Nothing to advance yet"); await reload();

// ================= Mexicano (progressive) =================
// Ported from the app's HostCompetitionManager:
//   round 1  -> shuffle, take courts*4, chunk into fours: (0,1) vs (2,3)
//   round n  -> rank by total_points desc, take courts*4, same chunking
// Extra players (beyond courts*4) sit the round: lowest shuffle (r1) / lowest
// ranked (later). Courts cycle per match, exactly like createMatches.
function mxCourtsFromInput(){
  const raw=($("mxCourts")&&$("mxCourts").value)||"1,2,3,4";
  return raw.split(",").map(s=>s.trim()).filter(Boolean);
}
function mxCourtsFromMatches(){
  // court numbers seen in round 1 (fallback: all matches), in numeric order
  const r1=(MX.rounds||[]).slice().sort((a,b)=>a.round_number-b.round_number)[0];
  const src=(MX.matches||[]).filter(m=>r1?m.round_id===r1.id:true);
  const set=[...new Set(src.map(m=>m.court_number).filter(c=>c!=null))];
  set.sort((a,b)=>a-b);
  return set.length?set.map(String):["1","2","3","4"];
}
function mxChunk(ids, courts){
  const out=[]; let i=0, ci=0;
  while(i+3<ids.length){
    out.push({a1:ids[i],a2:ids[i+1],b1:ids[i+2],b2:ids[i+3],court:parseInt(courts[ci%courts.length],10)||null});
    i+=4; ci++;
  }
  return out;
}
function mxNextRoundNumber(){ return (MX.rounds||[]).reduce((m,r)=>Math.max(m,r.round_number||0),0)+1; }
function mxRoundComplete(rn){
  const ms=(MX.matches||[]).filter(m=>m.round_number===rn);
  return ms.length>0 && ms.every(m=>m.status==="finished");
}
// The top-4 final is an ordinary round under the hood; a local flag remembers
// which round_number is the final so the console labels it and ends the event.
// (Cosmetic only — the round works everywhere even without the flag.)
function mxFinalRound(){ try{ const v=localStorage.getItem("padeja_mx_final_"+CUR.tournament_id); return v?parseInt(v,10):null; }catch(e){ return null; } }
function mxSetFinalRound(rn){ try{ localStorage.setItem("padeja_mx_final_"+CUR.tournament_id,String(rn)); }catch(e){} }
function mxRankedPlayers(){ return (MX.players||[]).slice().sort((a,b)=>(b.total_points||0)-(a.total_points||0)||(a.ranking||99)-(b.ranking||99)); }

function renderMxBuild(){
  const body=$("body");
  const started=(MX.rounds||[]).length>0;
  if(started){
    const roster=(MX.players||[]).slice().sort((a,b)=>(a.ranking||99)-(b.ranking||99));
    body.innerHTML=`<h2 class="sec">Players (${roster.length})</h2>
      <div class="card"><div class="muted" style="margin-bottom:8px">Round 1 has started, so the field is locked. Go to <b>Rounds</b> to enter scores and generate the next round.</div>
      ${roster.map((p,i)=>`<div class="plrow"><div class="n">${i+1}. ${esc(p.display_name)}</div></div>`).join("")}</div>`;
    return;
  }
  body.innerHTML=`
    <h2 class="sec">Players (${PLAYERS.length})</h2>
    <div class="card"><div id="plist"></div>
      <div class="addrow"><input class="f" id="pAdd" placeholder="Add a player's name"><button class="btn small" id="pAddBtn">Add</button></div>
      <div class="hint">Tip: paste a whole list — one name per line — into the box and press Add.</div>
    </div>
    <h2 class="sec">Round settings</h2>
    <div class="card">
      <div class="lbl">Courts (comma-separated)</div><input class="f" id="mxCourts" value="1,2,3,4">
      <div class="hint">Each round fills courts×4 players (top-ranked first); any extras sit that round. Points-to-a-target scoring — highest running total wins.</div>
      <button class="btn" id="mxGenBtn">Generate round 1</button>
    </div>`;
  drawMxPlist();
  $("pAddBtn").onclick=addMxPlayer;
  $("pAdd").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();addMxPlayer();}});
  $("mxGenBtn").onclick=mxGenerateRound1;
}
function drawMxPlist(){
  const el=$("plist");
  if(!PLAYERS.length){ el.innerHTML=`<div class="muted">No players yet — add them below.</div>`; return; }
  el.innerHTML=PLAYERS.map((n,i)=>`<div class="plrow"><div class="n">${i+1}. ${esc(n)}</div><button class="rm" data-i="${i}">×</button></div>`).join("");
  [...el.querySelectorAll(".rm")].forEach(b=>b.onclick=()=>{PLAYERS.splice(+b.dataset.i,1);renderMxBuild();});
}
function addMxPlayer(){
  const parts=($("pAdd").value).split(/[\n,]/).map(s=>s.trim()).filter(Boolean);
  for(const p of parts){ if(!PLAYERS.some(x=>x.toLowerCase()===p.toLowerCase())) PLAYERS.push(p); }
  $("pAdd").value=""; renderMxBuild(); $("pAdd")&&$("pAdd").focus();
}
async function mxGenerateRound1(){
  if(PLAYERS.length<4){ toast("Add at least 4 players",true); return; }
  const seen=new Set(); for(const n of PLAYERS){ const k=n.toLowerCase(); if(seen.has(k)){toast("Two players share the name: "+n+". Make names unique.",true);return;} seen.add(k); }
  const courts=mxCourtsFromInput(); if(!courts.length){ toast("Enter at least one court",true); return; }
  $("mxGenBtn").disabled=true; $("mxGenBtn").textContent="Generating…";
  // 1. save the field -> creates tournament_players (with ids)
  const players=PLAYERS.map(n=>({name:n}));
  const r1=await sb.rpc("org_mexicano_set_players",{p_tournament_id:CUR.tournament_id,p_players:players});
  if(r1.error){ $("mxGenBtn").disabled=false; $("mxGenBtn").textContent="Generate round 1"; toast(r1.error.message,true); return; }
  // 2. re-read to get player ids, then shuffle + pair round 1
  const disp=await sb.rpc("get_host_display",{p_code:CUR.share_code});
  const ppl=(disp.data&&disp.data.players)||[];
  let ids=ppl.map(p=>p.id);
  for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]];}
  const field=ids.slice(0, Math.max(1,courts.length)*4);
  const matches=mxChunk(field,courts);
  if(!matches.length){ $("mxGenBtn").disabled=false; $("mxGenBtn").textContent="Generate round 1"; toast("Need at least 4 players on court",true); return; }
  const r2=await sb.rpc("org_mexicano_insert_round",{p_tournament_id:CUR.tournament_id,p_round_number:1,p_matches:matches});
  if(r2.error){ $("mxGenBtn").disabled=false; $("mxGenBtn").textContent="Generate round 1"; toast(r2.error.message,true); return; }
  toast("Round 1 generated — it's live on the display code");
  TAB="score"; await reload();
}

function renderMxRounds(){
  const body=$("body");
  const rounds=(MX.rounds||[]).slice().sort((a,b)=>a.round_number-b.round_number);
  if(!rounds.length){ body.innerHTML=`<div class="muted">No rounds yet — add players and generate round 1 in the <b>Players</b> tab.</div>`; return; }
  const names={}; (MX.players||[]).forEach(p=>names[p.id]=p.display_name); const nm=id=>esc(names[id]||"—");
  const finalRn=mxFinalRound();
  let html="";
  rounds.forEach(rd=>{
    const ms=(MX.matches||[]).filter(m=>m.round_number===rd.round_number)
      .sort((a,b)=>((a.court_number||0)-(b.court_number||0)));
    const isFin=rd.round_number===finalRn;
    html+=`<div class="card"><div class="meta"${isFin?' style="color:var(--gold)"':''}>${isFin?"🏆 Final":"Round "+esc(rd.round_number)}</div>`;
    ms.forEach(m=>{const done=m.status==="finished";
      html+=`<div class="rgrp"><div class="meta">Court ${esc(m.court_number!=null?m.court_number:"–")}</div><div class="mt">
        <div class="team">${nm(m.player_a1_id)} &amp; ${nm(m.player_a2_id)}</div>
        <input class="sc" type="number" inputmode="numeric" min="0" id="ma_${esc(m.id)}" value="${m.score_a!=null?esc(m.score_a):""}">
        <span class="dash">–</span>
        <input class="sc" type="number" inputmode="numeric" min="0" id="mb_${esc(m.id)}" value="${m.score_b!=null?esc(m.score_b):""}">
        <div class="team b">${nm(m.player_b1_id)} &amp; ${nm(m.player_b2_id)}</div></div>
        <div style="text-align:right;margin-top:4px"><button class="save ${done?'ok':''}" data-mx="${esc(m.id)}">${done?'✓ Saved':'Save'}</button></div></div>`;});
    html+=`</div>`;
  });
  const lastRn=rounds[rounds.length-1].round_number;
  const finalDone=finalRn!=null;
  if(finalDone){
    const champ=mxRoundComplete(finalRn)?mxRankedPlayers()[0]:null;
    html+=`<div class="card center">${champ?`<div class="lbl" style="text-align:center">Champion</div><div style="font-size:20px;font-weight:800;color:var(--gold)">🏆 ${esc(champ.display_name)}</div>`:`<div class="muted">Final generated — enter the score above to crown the champion.</div>`}</div>`;
  } else if(mxRoundComplete(lastRn)){
    html+=`<button class="btn" id="mxNextBtn">Generate round ${lastRn+1} (from the standings)</button>
      <div class="hint">Ranks everyone by points and pairs the field top-two-vs-next-two, court by court.</div>
      <button class="btn gold" id="mxFinalBtn" style="margin-top:6px">🏆 Generate top-4 final instead</button>
      <div class="hint">Ends the event with one match: 1st &amp; 4th vs 2nd &amp; 3rd. Its score still adds to the totals, so the table crowns the champion.</div>`;
  } else {
    html+=`<div class="hint" style="text-align:center;margin-top:2px">Enter every score in round ${lastRn} to unlock the next round.</div>`;
  }
  body.innerHTML=html;
  [...body.querySelectorAll("[data-mx]")].forEach(b=>b.onclick=()=>saveMxScore(b.getAttribute("data-mx")));
  if($("mxNextBtn")) $("mxNextBtn").onclick=mxGenerateNext;
  if($("mxFinalBtn")) $("mxFinalBtn").onclick=mxGenerateFinal;
}
async function saveMxScore(mid){
  const a=parseInt($("ma_"+mid).value,10), b=parseInt($("mb_"+mid).value,10);
  if(Number.isNaN(a)||Number.isNaN(b)){ toast("Enter both scores",true); return; }
  const {error}=await sb.rpc("org_mexicano_set_result",{p_match_id:mid,p_score_a:a,p_score_b:b});
  if(error){ toast(error.message,true); return; }
  toast("Score saved"); await reload();
}
async function mxGenerateNext(){
  const rn=mxNextRoundNumber();
  const courts=mxCourtsFromMatches();
  const ranked=(MX.players||[]).slice().sort((a,b)=>(b.total_points||0)-(a.total_points||0)||(a.ranking||99)-(b.ranking||99));
  const ids=ranked.map(p=>p.id).slice(0, Math.max(1,courts.length)*4);
  const matches=mxChunk(ids,courts);
  if(!matches.length){ toast("Not enough players for another round",true); return; }
  $("mxNextBtn").disabled=true; $("mxNextBtn").textContent="Generating…";
  const {error}=await sb.rpc("org_mexicano_insert_round",{p_tournament_id:CUR.tournament_id,p_round_number:rn,p_matches:matches});
  if(error){ $("mxNextBtn").disabled=false; toast(error.message,true); return; }
  toast("Round "+rn+" generated"); await reload();
}
async function mxGenerateFinal(){
  const ranked=mxRankedPlayers();
  if(ranked.length<4){ toast("Need at least 4 players for a final",true); return; }
  const rn=mxNextRoundNumber();
  const courts=mxCourtsFromMatches();
  const [p1,p2,p3,p4]=ranked;                         // ranks 1..4 by points
  const match={a1:p1.id,a2:p4.id,b1:p2.id,b2:p3.id,court:parseInt(courts[0],10)||null}; // 1+4 vs 2+3
  $("mxFinalBtn").disabled=true; $("mxFinalBtn").textContent="Generating…";
  const {error}=await sb.rpc("org_mexicano_insert_round",{p_tournament_id:CUR.tournament_id,p_round_number:rn,p_matches:[match]});
  if(error){ $("mxFinalBtn").disabled=false; $("mxFinalBtn").textContent="🏆 Generate top-4 final instead"; toast(error.message,true); return; }
  mxSetFinalRound(rn);
  toast("Top-4 final generated"); await reload();
}

function renderMxTable(){
  const body=$("body");
  const st=(MX.players||[]).slice().sort((a,b)=>(a.ranking||99)-(b.ranking||99)||(b.total_points||0)-(a.total_points||0));

  }</tbody></table></div>`;
}

// ================= balanced Americano draw generator =================
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function generateDraw(N,courts,rounds){
  const mpr=Math.min(Math.floor(N/4),courts.length); if(mpr<1)return null;
  const pk=(a,b)=>a<b?a+"-"+b:b+"-"+a;
  function match(players,used,rnd){
    for(let t=0;t<500;t++){ const pool=players.slice(); for(let i=pool.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
      const pairs=[]; let ok=true;
      while(pool.length){ const a=pool.shift(); const cands=pool.filter(b=>!used.has(pk(a,b)));
        if(!cands.length){ok=false;break;} const b=cands[Math.floor(rnd()*cands.length)]; pool.splice(pool.indexOf(b),1); pairs.push([a,b]); }
      if(ok)return pairs; }
    return null;
  }
  function group(pairs,opp,rnd){
    let best=null,bp=Infinity;
    for(let t=0;t<250;t++){ const idx=pairs.map((_,i)=>i); for(let i=idx.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
      const ms=[]; let pen=0;
      for(let i=0;i<idx.length;i+=2){ const [p,q]=pairs[idx[i]],[s,tt]=pairs[idx[i+1]];
        for(const x of [p,q]) for(const y of [s,tt]) pen+=Math.pow(opp[x][y]+1,2); ms.push([p,q,s,tt]); }
      if(pen<bp){bp=pen;best=ms;} }
    return best;
  }
  function attempt(seed){
    const rnd=mulberry32(seed); const used=new Set(); const rest=new Array(N).fill(0);
    const opp=Array.from({length:N},()=>new Array(N).fill(0)); const sched=[];
    const playersPer=mpr*4, numRest=N-playersPer;
    for(let r=0;r<rounds;r++){
      let restSet=null,pairing=null;
      const cands=[];
      if(numRest===0) cands.push(new Set());
      else{ const order=[...Array(N).keys()].sort((a,b)=>rest[a]-rest[b]||rnd()-0.5);
        for(let t=0;t<60;t++){ const pick=order.slice(0,numRest+3).slice(); for(let i=pick.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[pick[i],pick[j]]=[pick[j],pick[i]];}
          cands.push(new Set(pick.slice(0,numRest))); } }
      for(const rs of cands){ const playing=[...Array(N).keys()].filter(p=>!rs.has(p)); const pm=match(playing,used,rnd); if(pm){restSet=rs;pairing=pm;break;} }
      if(!pairing)return null;
      restSet.forEach(p=>rest[p]++); pairing.forEach(([a,b])=>used.add(pk(a,b)));
      const ms=group(pairing,opp,rnd);
      ms.forEach(([p,q,s,tt])=>{ for(const x of [p,q]) for(const y of [s,tt]){opp[x][y]++;opp[y][x]++;} });
      sched.push({matches:ms,rest:[...restSet]});
    }
    const ov=[]; for(let i=0;i<N;i++)for(let j=i+1;j<N;j++)ov.push(opp[i][j]);
    const score=(Math.max(...ov)-Math.min(...ov))*100+Math.max(...ov)+(Math.max(...rest)-Math.min(...rest))*10;
    return {sched,score};
  }
  let best=null; for(let s=1;s<=250;s++){ const a=attempt(s); if(a&&(!best||a.score<best.score))best=a; }
  return best?best.sched:null;
}
// ---- time helpers ----
function parseTime(s){ if(!s)return null; const m=String(s).trim().toLowerCase().match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm)?$/); if(!m)return null;
  let h=parseInt(m[1]); const mn=m[2]?parseInt(m[2]):0; const ap=m[3];
  if(ap==="pm"&&h<12)h+=12; if(ap==="am"&&h===12)h=0; return h*60+mn; }
function fmtRange(startMin,len){ return fmt12(startMin)+"–"+fmt12(startMin+len); }
function fmt12(t){ t=((t%1440)+1440)%1440; let h=Math.floor(t/60),mn=t%60; const ap=h>=12?"pm":"am"; let hh=h%12; if(hh===0)hh=12; return hh+":"+String(mn).padStart(2,"0")+ap; }
