<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Join a competition · Padeja</title>
<meta name="description" content="Register and pay for this competition on Padeja — no app needed." />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --bg:#0A1624; --card:#122034; --line:#1E3050; --white:#F2F6FC; --muted:#8AA4C0;
         --brand:#3BC8F5; --accent:#F09537; --green:#2fb573; --danger:#e06b6b; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--white);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100dvh;display:flex;align-items:flex-start;justify-content:center;
    padding:24px 16px calc(24px + env(safe-area-inset-bottom));}
  .wrap{width:100%;max-width:440px}
  .logo{font-size:22px;font-weight:800;letter-spacing:.5px;text-align:center;margin-bottom:14px}
  .logo span{color:var(--brand)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px 20px;margin-bottom:14px}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin:0 0 6px}
  h1{font-size:23px;line-height:1.25;margin:0 0 8px;font-weight:800}
  .meta{color:var(--muted);font-size:14px;line-height:1.6}
  .meta b{color:var(--white);font-weight:700}
  .fee{display:inline-block;margin-top:12px;font-size:15px;font-weight:800;color:var(--accent);
    background:rgba(240,149,55,.12);border:1px solid rgba(240,149,55,.35);border-radius:10px;padding:6px 12px}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    border:none;border-radius:12px;padding:14px 16px;font-size:16px;font-weight:800;cursor:pointer;margin-top:12px}
  .btn-primary{background:var(--brand);color:#06202e}
  .btn-ghost{background:transparent;color:var(--white);border:1px solid var(--line)}
  .btn[disabled]{opacity:.55;cursor:default}
  label{display:block;font-size:12px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin:12px 0 5px}
  input{width:100%;padding:12px 13px;border-radius:10px;border:1px solid var(--line);background:#0d1b2b;color:#fff;font-size:16px}
  .msg{margin-top:12px;font-size:14px;color:var(--danger);min-height:1em}
  .ok{color:var(--green)}
  .hidden{display:none}
  .spin{text-align:center;color:var(--muted);padding:30px 0}
  .sub{color:var(--muted);font-size:13px;margin:10px 0 0;line-height:1.5}
  .back{color:var(--brand);font-size:14px;background:none;border:none;cursor:pointer;padding:6px 0;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">Pade<span>ja</span></div>

  <div id="loading" class="card"><div class="spin">Loading competition…</div></div>

  <!-- Competition details -->
  <div id="comp" class="card hidden">
    <div class="eyebrow" id="cEyebrow">Competition</div>
    <h1 id="cName">—</h1>
    <div class="meta" id="cMeta"></div>
    <div id="cFee"></div>
    <div id="cClosed" class="sub hidden" style="color:var(--danger)">Registration for this competition is closed.</div>
    <button id="joinHereBtn" class="btn btn-primary">Join here</button>
  </div>

  <!-- Choose user type -->
  <div id="choose" class="card hidden">
    <div class="eyebrow">Join</div>
    <h1 style="font-size:19px">Do you have a Padeja account?</h1>
    <button id="chooseUser" class="btn btn-primary">Yes — sign in</button>
    <button id="chooseGuest" class="btn btn-ghost">No — I'm new</button>
    <button id="chooseBack" class="back">← Back</button>
  </div>

  <!-- Existing Padeja user -->
  <div id="userForm" class="card hidden">
    <div class="eyebrow">Sign in to join</div>
    <label>Padeja email</label><input id="uEmail" type="email" autocomplete="email" placeholder="you@email.com" />
    <label>Password</label><input id="uPass" type="password" autocomplete="current-password" placeholder="••••••••" />
    <button id="userJoinBtn" class="btn btn-primary">Sign in &amp; join</button>
    <button id="userBack" class="back">← Back</button>
    <div id="uMsg" class="msg"></div>
  </div>

  <!-- Guest -->
  <div id="guestForm" class="card hidden">
    <div class="eyebrow">Join as a guest</div>
    <p class="sub" style="margin-top:0">No app needed — just your details and payment.</p>
    <label>Full name</label><input id="gName" type="text" autocomplete="name" placeholder="Your name" />
    <label>Email</label><input id="gEmail" type="email" autocomplete="email" placeholder="you@email.com" />
    <label>Mobile number</label><input id="gPhone" type="tel" autocomplete="tel" placeholder="07…" />
    <button id="guestJoinBtn" class="btn btn-primary">Join &amp; pay</button>
    <button id="guestBack" class="back">← Back</button>
    <div id="gMsg" class="msg"></div>
  </div>

  <!-- Success (free comps) -->
  <div id="done" class="card hidden" style="text-align:center">
    <div style="font-size:40px;color:var(--green)">✓</div>
    <h1 style="font-size:20px">You're in!</h1>
    <p class="sub" id="doneMsg">You've joined the competition. The organiser will confirm your place.</p>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://odrckirnjavfptlfygbo.supabase.co";
  const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9kcmNraXJuamF2ZnB0bGZ5Z2JvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1MzY3MzQsImV4cCI6MjA5NTExMjczNH0.rjoAQhEaTw6Sp-nGrQmYYvLdVKD7ewrKwG1PmMbyYgo";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
  const $ = (id)=>document.getElementById(id);
  const qs = new URLSearchParams(location.search);
  const CODE = (qs.get("code")||"").trim();
  let COMP = null;

  function show(id){ $(id).classList.remove("hidden"); }
  function hide(id){ $(id).classList.add("hidden"); }
  function cap(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }
  function money(pennies, cur){ return (cur==="usd"?"$":cur==="eur"?"€":"£") + (pennies/100).toFixed(2); }
  function fmtDate(d){ if(!d) return ""; try{ return new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}); }catch(_){ return ""; } }

  async function load(){
    if(!CODE){ $("loading").innerHTML='<div class="spin">No competition code in the link.</div>'; return; }
    try{
      const { data, error } = await sb.rpc("get_tournament_by_code", { p_code: CODE });
      if(error) throw error;
      const c = Array.isArray(data) ? data[0] : data;
      if(!c){ $("loading").innerHTML='<div class="spin">Competition not found for this code.</div>'; return; }
      COMP = c;
      hide("loading"); show("comp");
      const label = c.variant==="box_league" ? "Box League" : cap(c.format||"Competition");
      $("cEyebrow").textContent = label;
      $("cName").textContent = c.name || "Competition";
      let meta = "";
      if(c.venue_name) meta += '📍 <b>'+escapeHtml(c.venue_name)+'</b><br>';
      if(c.start_date) meta += '🗓 '+fmtDate(c.start_date);
      $("cMeta").innerHTML = meta;
      const amt = c.entry_fee_amount||0;
      if(c.has_entry_fee && amt>0){
        const pay = (c.registration_mode==="team") ? Math.round(amt/2) : amt;
        $("cFee").innerHTML = '<div class="fee">Entry '+money(pay, c.entry_fee_currency||"gbp")+'</div>';
      }
      const open = (c.registration_status||"")==="open";
      if(!open){ show("cClosed"); $("joinHereBtn").disabled = true; $("joinHereBtn").textContent="Registration closed"; }
    }catch(e){ $("loading").innerHTML='<div class="spin">Couldn\'t load this competition.</div>'; }
  }
  function escapeHtml(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

  // navigation
  $("joinHereBtn").onclick=()=>{ hide("comp"); show("choose"); };
  $("chooseBack").onclick=()=>{ hide("choose"); show("comp"); };
  $("chooseUser").onclick=()=>{ hide("choose"); show("userForm"); };
  $("chooseGuest").onclick=()=>{ hide("choose"); show("guestForm"); };
  $("userBack").onclick=()=>{ hide("userForm"); show("choose"); };
  $("guestBack").onclick=()=>{ hide("guestForm"); show("choose"); };

  function handleResult(data){
    if(data && data.url){ location.href = data.url; return true; }      // Stripe checkout
    if(data && data.joined){ hide("userForm"); hide("guestForm"); show("done"); return true; } // free comp
    return false;
  }

  // Padeja user
  $("userJoinBtn").onclick = async ()=>{
    const btn=$("userJoinBtn"), msg=$("uMsg"); msg.textContent="";
    const email=$("uEmail").value.trim(), pass=$("uPass").value;
    if(!email||!pass){ msg.textContent="Enter your email and password."; return; }
    btn.disabled=true; btn.textContent="Signing in…";
    try{
      const { error:le } = await sb.auth.signInWithPassword({ email, password:pass });
      if(le){ throw new Error("Sign-in failed — check your email and password."); }
      btn.textContent="Joining…";
      const { data, error } = await sb.functions.invoke("public-join-checkout", { body:{ code:CODE } });
      if(error){ let m=error.message||"Couldn't join."; try{ if(error.context&&error.context.json){ const j=await error.context.json(); if(j&&j.error) m=j.error; } }catch(_){ } throw new Error(m); }
      if(!handleResult(data)) throw new Error((data&&data.error)||"Couldn't join.");
    }catch(e){ msg.textContent=e.message||"Couldn't join."; btn.disabled=false; btn.textContent="Sign in & join"; }
  };

  // Guest
  $("guestJoinBtn").onclick = async ()=>{
    const btn=$("guestJoinBtn"), msg=$("gMsg"); msg.textContent="";
    const name=$("gName").value.trim(), email=$("gEmail").value.trim(), phone=$("gPhone").value.trim();
    if(!name){ msg.textContent="Enter your name."; return; }
    if(!email){ msg.textContent="Enter your email (for your receipt / payment)."; return; }
    btn.disabled=true; btn.textContent="Joining…";
    try{
      const { data, error } = await sb.functions.invoke("public-join-checkout", { body:{ code:CODE, name, email, phone } });
      if(error){ let m=error.message||"Couldn't join."; try{ if(error.context&&error.context.json){ const j=await error.context.json(); if(j&&j.error) m=j.error; } }catch(_){ } throw new Error(m); }
      if(!handleResult(data)) throw new Error((data&&data.error)||"Couldn't join.");
    }catch(e){ msg.textContent=e.message||"Couldn't join."; btn.disabled=false; btn.textContent="Join & pay"; }
  };

  load();
</script>
</body>
</html>
