<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Padeja · Live Display</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#00D4AA; --sky:#00A8FF; --gold:#FFD700; --red:#FF6B6B;
    --line:rgba(255,255,255,.10); --card:rgba(255,255,255,.045);
    --mut:rgba(255,255,255,.58); --mut2:rgba(255,255,255,.38);
    --po:rgba(255,215,0,.14); --poln:rgba(255,215,0,.55);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Poppins',sans-serif;color:#fff;overflow:hidden;
    background:
      radial-gradient(1400px 800px at 8% -5%, rgba(0,168,255,.13), transparent 60%),
      radial-gradient(1300px 900px at 100% 105%, rgba(0,212,170,.13), transparent 55%),
      linear-gradient(160deg,#0A2236,#0D1B2A 55%,#07131f);}
  #app{height:100vh;width:100vw;display:flex;flex-direction:column;padding:2.2vh 2.4vw}
  /* header */
  .hdr{display:flex;align-items:center;justify-content:space-between;gap:2vw;padding-bottom:1.6vh;border-bottom:1px solid var(--line)}
  .wm{height:6.2vh;width:auto;display:block}
  .htitle{text-align:center;flex:1;min-width:0}
  .htitle .nm{font-size:3.4vh;font-weight:700;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .htitle .vn{font-size:1.9vh;color:var(--mut);font-weight:500;margin-top:.3vh}
  .hright{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:.5vh}
  .live{display:inline-flex;align-items:center;gap:.7vw;font-size:1.7vh;font-weight:700;letter-spacing:2px;color:var(--red)}
  .live .dot{width:1.2vh;height:1.2vh;border-radius:50%;background:var(--red);box-shadow:0 0 1.4vh var(--red);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .code{font-size:1.7vh;color:var(--mut)} .code b{color:var(--gold);letter-spacing:2px}
  /* main */
  .main{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:1.6vh}
  .topgrid{flex:1;min-height:0;display:grid;grid-template-columns:37% 63%;gap:1.6vw}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:1.4vh;padding:1.4vh 1.4vw;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .panel h3{font-size:1.7vh;text-transform:uppercase;letter-spacing:3px;color:var(--teal);font-weight:600;margin-bottom:1vh;flex:none}
  .panel .body{overflow:hidden;flex:1;min-height:0}
  .subh{font-size:1.5vh;letter-spacing:2px;color:var(--mut2);text-transform:uppercase;margin:1.2vh 0 .6vh;font-weight:600}
  .subh:first-child{margin-top:0}
  /* fixtures */
  .fx{display:flex;align-items:center;gap:.8vw;padding:.85vh 0;border-bottom:1px solid var(--line);font-size:1.9vh}
  .fx .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fx .t.r{text-align:right}
  .fx .sc{font-weight:700;font-size:2vh;min-width:3.4vw;text-align:center;color:#fff}
  .fx .vs{color:var(--mut2);font-size:1.5vh;min-width:3.4vw;text-align:center}
  .fx .dv{font-size:1.2vh;color:var(--mut2);border:1px solid var(--line);border-radius:.6vh;padding:.1vh .5vw}
  .fx .w{color:var(--teal);font-weight:700}
  /* tables */
  .tables{display:grid;grid-template-columns:repeat(auto-fit,minmax(24vw,1fr));gap:.8vh 1.4vw;align-content:start;height:100%;overflow:hidden}
  .lg h4{font-size:1.7vh;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-bottom:.5vh;font-weight:700}
  table{width:100%;border-collapse:collapse;table-layout:fixed}
  th,td{padding:.62vh .5vw;text-align:left;font-size:1.7vh;overflow:hidden}
  th{font-size:1.25vh;text-transform:uppercase;letter-spacing:1px;color:var(--mut2);font-weight:600}
  td.n,th.n{text-align:center;width:2.3vw}
  th.tmh,td.tmc{width:auto}
  tr.row{border-top:1px solid var(--line)}
  tr.po td{background:var(--po)}
  tr.po td:first-child{box-shadow:inset .35vw 0 0 var(--gold)}
  .rank{font-weight:700;color:var(--mut)}
  .pts{font-weight:800;color:var(--teal);font-size:1.9vh}
  .potag{font-size:1.05vh;color:#04121d;background:var(--gold);border-radius:.5vh;padding:.15vh .4vw;font-weight:800;letter-spacing:1px;margin-left:.4vw}
  .tm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .teamcell{display:flex;align-items:center;gap:.45vw;min-width:0}
  /* odds band */
  .oddsband{height:27vh;margin-top:1.6vh;background:var(--card);border:1px solid var(--line);border-radius:1.4vh;padding:1.3vh 1.4vw;display:flex;flex-direction:column;overflow:hidden}
  .oddsband h3{font-size:1.7vh;text-transform:uppercase;letter-spacing:3px;font-weight:600;margin-bottom:1vh;flex:none}
  .oddsband h3 span{color:var(--gold)}
  .oddsgrid{flex:1;min-height:0;display:grid;grid-auto-flow:column;grid-template-rows:repeat(6,1fr);grid-auto-columns:1fr;gap:.5vh 2vw;overflow:hidden}
  .ob{display:flex;align-items:center;gap:.8vw;font-size:1.6vh}
  .ob .nm{width:12vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#eaf6ff}
  .ob .bar{flex:1;height:1.7vh;background:rgba(255,255,255,.08);border-radius:1vh;overflow:hidden}
  .ob .fill{height:100%;border-radius:1vh;background:linear-gradient(90deg,var(--sky),var(--teal))}
  .ob .fill.hi{background:linear-gradient(90deg,var(--teal),var(--gold))}
  .ob .pc{width:4vw;text-align:right;font-weight:700}
  .ob .pc.g{color:var(--gold)} .ob .pc.z{color:var(--mut2)}
  /* bracket scene */
  .bracket{height:100%;display:flex;align-items:center;justify-content:center;gap:3vw;padding:2vh}
  .bround{display:flex;flex-direction:column;justify-content:space-around;gap:2vh;height:80%}
  .bround h4{font-size:1.8vh;text-transform:uppercase;letter-spacing:3px;color:var(--mut2);text-align:center;margin-bottom:.5vh}
  .pm{background:var(--card);border:1px solid var(--line);border-radius:1.2vh;padding:1.2vh 1.4vw;min-width:20vw}
  .pr{display:flex;justify-content:space-between;gap:1vw;padding:.7vh 0;font-size:2.2vh}
  .pr+.pr{border-top:1px dashed var(--line)}
  .pr.win{color:var(--gold);font-weight:800}
  .pr .tbc{color:var(--mut2);font-style:italic}
  .champ{position:absolute;bottom:9vh;left:0;right:0;text-align:center;font-size:2.6vh;font-weight:800;color:var(--gold)}
  /* footer */
  .ftr{flex:none;display:flex;align-items:center;justify-content:space-between;padding-top:1.3vh;border-top:1px solid var(--line);font-size:1.6vh;color:var(--mut)}
  .ftr b{color:var(--teal)}
  .dots{display:flex;gap:.7vw}
  .dots i{width:1vh;height:1vh;border-radius:50%;background:var(--mut2);display:inline-block}
  .dots i.on{background:var(--teal)}
  /* gate */
  .gate{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4vh;text-align:center}
  .gate input{font-family:inherit;font-size:3vh;text-align:center;letter-spacing:.6vw;text-transform:uppercase;padding:1.6vh 2vw;border-radius:1.4vh;border:1px solid var(--line);background:rgba(255,255,255,.05);color:#fff;outline:none;width:min(80vw,16ch)}
  .gate button{font-family:inherit;font-size:2.2vh;font-weight:700;border:none;border-radius:1.2vh;padding:1.4vh 3vw;color:#04121d;background:linear-gradient(120deg,var(--teal),var(--sky));cursor:pointer}
  .gate .err{color:var(--red);font-size:2vh;min-height:2.4vh}
  .hidden{display:none!important}
  .court{position:fixed;right:-6vw;bottom:-4vh;width:34vw;height:auto;opacity:.05;transform:rotate(-8deg);pointer-events:none}
</style>
</head>

<script>
const SUPABASE_URL="https://odrckirnjavfptlfygbo.supabase.co";
const SUPABASE_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9kcmNraXJuamF2ZnB0bGZ5Z2JvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1MzY3MzQsImV4cCI6MjA5NTExMjczNH0.rjoAQhEaTw6Sp-nGrQmYYvLdVKD7ewrKwG1PmMbyYgo";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
const $ = id=>document.getElementById(id);
const esc = s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const qs = new URLSearchParams(location.search);

let DATA=null, TOPN=2, SCENES=["standings"], sceneIx=0;

function poDone(m){ return m && (m.status==="completed"||m.status==="complete"); }
function fxDone(m){ return m && m.status==="completed"; }

// ---------- data ----------
async function fetchData(code){
  if(qs.get("demo")==="1"){ return DEMO(); }
  const { data, error } = await sb.rpc("get_host_display",{ p_code:code });
  if(error) throw error;
  return data;
}

// ---------- odds (Monte Carlo) ----------
function computeOdds(comp, league, teams, matches, topN, sims){
  const lt = teams.filter(t=>t.league_id===league.id);
  const ids = lt.map(t=>t.id);
  if(!ids.length) return {};
  const rem = matches.filter(m=>m.league_id===league.id && !fxDone(m) && m.home_team_id && m.away_team_id);
  const PW = num(comp.points_for_win,3), PL = num(comp.points_for_loss,0), PD = num(comp.points_for_draw,1);
  const rating={}, avgF={}, avgA={};
  lt.forEach(t=>{ const p=t.played||0;
    rating[t.id] = ((t.league_points||0)+1.0)/(p+1.0) + ((num(t.points_for,0)-num(t.points_against,0))/Math.max(1,p))*0.05;
    avgF[t.id] = p>0 ? num(t.points_for,0)/p : 6;
    avgA[t.id] = p>0 ? num(t.points_against,0)/p : 6;
  });
  const K=1.15, cnt={}; ids.forEach(id=>cnt[id]=0);
  if(!rem.length){ // deterministic
    const order=[...lt].sort(cmpTeam);
    order.forEach((t,i)=> cnt[t.id]= i<topN?sims:0);
  } else {
    for(let s=0;s<sims;s++){
      const pts={}, pf={};
      lt.forEach(t=>{ pts[t.id]=t.league_points||0; pf[t.id]=num(t.points_for,0); });
      rem.forEach(m=>{
        const a=m.home_team_id, b=m.away_team_id;
        const pa=1/(1+Math.exp(-K*(rating[a]-rating[b])));
        const winA = Math.random()<pa;
        let fa=Math.max(0,Math.round(samp(avgF[a],avgA[b]))), fb=Math.max(0,Math.round(samp(avgF[b],avgA[a])));
        if(winA && fa<=fb) fa=fb+1+(Math.random()*3|0);
        if(!winA && fb<=fa) fb=fa+1+(Math.random()*3|0);
        pf[a]+=fa; pf[b]+=fb;
        if(fa>fb){ pts[a]+=PW; pts[b]+=PL; } else if(fb>fa){ pts[b]+=PW; pts[a]+=PL; } else { pts[a]+=PD; pts[b]+=PD; }
      });
      const order=[...ids].sort((x,y)=> (pts[y]-pts[x])||(pf[y]-pf[x])||(Math.random()-.5));
      for(let i=0;i<Math.min(topN,order.length);i++) cnt[order[i]]++;
    }
  }
  const odds={}; ids.forEach(id=> odds[id]=cnt[id]/sims); return odds;
}
function samp(mF, mAopp){ const base=(mF+mAopp)/2; return base + (Math.random()-0.5)*base*0.6; }
function num(v,d){ return (v==null||isNaN(v))?d:v; }
function cmpTeam(a,b){ return (b.league_points-a.league_points)||(num(b.points_for,0)-num(a.points_for,0))||0; }

// ---------- render ----------
function render(){
  const c=DATA.competition||{};
  TOPN = parseInt(qs.get("top")) || c.playoff_teams || 2;
  $("cName").textContent = c.name||"Padeja Competition";
  $("cVenue").textContent = c.venue_name||"";
  $("cCode").textContent = (qs.get("code")||"").toUpperCase()||"----";
  $("oddsTopLbl").textContent = `chance of Top ${TOPN}`;
  const leagues=(DATA.leagues||[]).slice().sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  const teams=DATA.teams||[], matches=DATA.matches||[], po=DATA.playoffs||[];
  const nameOf={}; teams.forEach(t=> nameOf[t.id]=t.team_name||"Team");

  // fixtures
  const results = matches.filter(fxDone).slice(-6).reverse();
  const upcoming = matches.filter(m=>!fxDone(m) && m.home_team_id && m.away_team_id).slice(0,8);
  const dv = id => leagues.length>1 ? `<span class="dv">${esc((leagues.find(l=>l.id===id)||{}).league_letter||"")}</span>` : "";
  let fh="";
  if(results.length){ fh+=`<div class="subh">Latest results</div>`;
    results.forEach(m=>{ const hw=num(m.home_score,0)>num(m.away_score,0), aw=num(m.away_score,0)>num(m.home_score,0);
      fh+=`<div class="fx">${dv(m.league_id)}<span class="t ${hw?'w':''}">${esc(nameOf[m.home_team_id])}</span>
        <span class="sc">${num(m.home_score,0)}–${num(m.away_score,0)}</span>
        <span class="t r ${aw?'w':''}">${esc(nameOf[m.away_team_id])}</span></div>`; });
  }
  if(upcoming.length){ fh+=`<div class="subh">Upcoming</div>`;
    upcoming.forEach(m=>{ fh+=`<div class="fx">${dv(m.league_id)}<span class="t">${esc(nameOf[m.home_team_id])}</span>
      <span class="vs">v</span><span class="t r">${esc(nameOf[m.away_team_id])}</span></div>`; });
  }
  if(!fh) fh=`<div style="color:var(--mut2);font-size:1.9vh">No fixtures yet.</div>`;
  $("fixturesBody").innerHTML=fh;

  // tables + odds
  let th="", oh="";
  leagues.forEach(l=>{
    const lt=teams.filter(t=>t.league_id===l.id).slice().sort(cmpTeam);
    if(!lt.length) return;
    th+=`<div class="lg">${leagues.length>1?`<h4>${esc(l.name)}</h4>`:""}
      <table><thead><tr><th class="n">#</th><th>Team</th><th class="n">P</th><th class="n">W</th><th class="n">D</th><th class="n">L</th><th class="n">Pts</th></tr></thead><tbody>`;
    lt.forEach((t,i)=>{ const po=i<TOPN;
      th+=`<tr class="row ${po?'po':''}"><td class="n rank">${i+1}</td>
        <td class="tmc"><div class="teamcell"><span class="tm">${esc(t.team_name||"Team")}</span>${po?'<span class="potag">PO</span>':''}</div></td>
        <td class="n">${t.played||0}</td><td class="n">${t.won||0}</td><td class="n">${t.drawn||0}</td>
        <td class="n">${t.lost||0}</td><td class="n pts">${t.league_points||0}</td></tr>`; });
    th+=`</tbody></table></div>`;
    // odds
    const odds=computeOdds(DATA.competition,l,teams,matches,TOPN, 2200);
    lt.forEach(t=>{ const p=odds[t.id]||0; const pct=Math.round(p*100);
      const hi = pct>=50; const cls = pct>=100?'g':(pct<=0?'z':'');
      oh+=`<div class="ob"><span class="nm">${esc(t.team_name||"Team")}</span>
        <span class="bar"><span class="fill ${hi?'hi':''}" style="width:${Math.max(2,pct)}%"></span></span>
        <span class="pc ${cls}">${pct}%</span></div>`;
    });
  });
  $("tablesBody").innerHTML=th;
  $("oddsBody").innerHTML=oh;

  // playoffs bracket
  const hasPo = po.length>0;
  renderBracket(po);
  SCENES = hasPo ? ["standings","playoffs"] : ["standings"];
  if(sceneIx>=SCENES.length) sceneIx=0;
  $("phaseLbl").textContent = hasPo ? "Playoffs" : "League stage";
  applyScene();
}

const RLABEL={quarter_final:"Quarter-finals",semi_final:"Semi-finals",final:"Final"};
const RORDER=["quarter_final","semi_final","final"];
function renderBracket(po){
  const byR={}; po.forEach(m=>{ (byR[m.round]=byR[m.round]||[]).push(m); });
  let cols="";
  RORDER.forEach(r=>{ const ms=(byR[r]||[]).sort((a,b)=>a.match_number-b.match_number); if(!ms.length) return;
    cols+=`<div class="bround"><h4>${RLABEL[r]||r}</h4>`;
    ms.forEach(m=>{
      const aw=poDone(m)&&m.winner_id&&m.team_a_id&&m.winner_id===m.team_a_id;
      const bw=poDone(m)&&m.winner_id&&m.team_b_id&&m.winner_id===m.team_b_id;
      const rowa = m.team_a_name?`<span>${esc(m.team_a_name)}</span><span>${m.score_a!=null?m.score_a:""}</span>`:`<span class="tbc">TBC</span><span></span>`;
      const rowb = m.team_b_name?`<span>${esc(m.team_b_name)}</span><span>${m.score_b!=null?m.score_b:""}</span>`:`<span class="tbc">TBC</span><span></span>`;
      cols+=`<div class="pm"><div class="pr ${aw?'win':''}">${rowa}</div><div class="pr ${bw?'win':''}">${rowb}</div></div>`;
    });
    cols+=`</div>`;
  });
  $("bracketBody").innerHTML=cols || `<div style="color:var(--mut2)">Playoffs not started.</div>`;
  const fin=(byR["final"]||[])[0];
  if(poDone(fin)&&fin.winner_name){ $("champLine").textContent=`🏆 Champions: ${fin.winner_name}`; $("champLine").classList.remove("hidden"); }
  else $("champLine").classList.add("hidden");
}

function applyScene(){
  const sc=SCENES[sceneIx];
  $("sceneStandings").style.display = sc==="standings"?"flex":"none";
  $("scenePlayoffs").classList.toggle("hidden", sc!=="playoffs");
  $("sceneDots").innerHTML = SCENES.map((s,i)=>`<i class="${i===sceneIx?'on':''}"></i>`).join("");
}
function rotate(){ if(SCENES.length<2) return; sceneIx=(sceneIx+1)%SCENES.length; applyScene(); }

// ---------- clock ----------
function tick(){ const d=new Date(); $("clock").textContent = d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }

// ---------- boot ----------
async function boot(){
  const code=(qs.get("code")||"").trim();
  if(!code && qs.get("demo")!=="1"){ showGate(); return; }
  $("gate").classList.add("hidden"); $("app").classList.remove("hidden");
  tick(); setInterval(tick,1000);
  await refresh();
  setInterval(refresh, 25000);   // data refresh
  setInterval(rotate, 20000);    // scene rotation
}
async function refresh(){
  try{
    const code=(qs.get("code")||"").trim();
    const d = await fetchData(code);
    if(!d || d.found===false){ showGate("No competition found for that code."); return; }
    DATA=d; render();
  }catch(e){ console.error(e); }
}
function showGate(err){
  $("app").classList.add("hidden"); $("gate").classList.remove("hidden");
  if(err) $("gateErr").textContent=err;
  const go=()=>{ const c=$("codeInput").value.trim().toUpperCase(); if(c){ location.search="?code="+encodeURIComponent(c); } };
  $("goBtn").onclick=go;
  $("codeInput").onkeydown=e=>{ if(e.key==="Enter") go(); };
}

  const A="lgA",B="lgB";
  const teams=[
    mk("a1",A,"Michael Oliver & Craig Charles",4,3,0,1,58,40),
    mk("a2",A,"Jack Woodford & Ollie Watts",4,3,0,1,55,44),
    mk("a3",A,"Andy Madden & Paula Smith",4,2,0,2,49,47),
    mk("a4",A,"Ben Whitney & James Dean",4,2,0,2,45,46),
    mk("a5",A,"Paul Daniels & Debbie McGee",4,1,0,3,41,52),
    mk("a6",A,"Craig Revel & Mike Lee",4,1,0,3,38,57),

    mk("b3",B,"Ben Oaks & Matthew Smith",4,2,0,2,48,49),
    mk("b4",B,"Paula Sharp & Annie Lee",4,1,1,2,44,50),
    mk("b5",B,"Lee Phelps & Danny Peters",4,1,0,3,40,55),

  ];
  const matches=[];
  let idc=0;
  const add=(ln,h,a,hs,as,done)=>matches.push({id:"m"+(idc++),league_id:ln,home_team_id:h,away_team_id:a,home_score:hs,away_score:as,status:done?"completed":"pending",created_at:idc});
  add(A,"a1","a6",6,3,true); add(A,"a2","a5",6,4,true); add(A,"a3","a4",6,5,true);

  add(A,"a5","a6",null,null,false); add(A,"a2","a3",null,null,false);
  add(B,"b1","b6",6,2,true); add(B,"b2","b5",6,3,true); add(B,"b3","b4",5,5,true);
  add(B,"b1","b2",6,4,true);
  add(B,"b1","b3",null,null,false); add(B,"b2","b4",null,null,false); add(B,"b4","b6",null,null,false);
  return { found:true,
    competition:{name:"Brentwood Summer Slam", venue_name:"Brentwood Padel Club", number_of_leagues:2, playoff_teams:2, playoff_enabled:false, tournament_phase:"active", points_for_win:3, points_for_draw:1, points_for_loss:0},
    leagues:[{id:A,name:"League A",league_letter:"A"},{id:B,name:"League B",league_letter:"B"}],
    teams, matches, playoffs:[] };
}
boot();
</script>
