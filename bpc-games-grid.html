<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BPC Padel Games · All Leagues</title>
<style>
  :root{
    --bg:#060b11; --panel:#0d1620; --panel2:#111e2b; --line:#1d2c3b;
    --ink:#eef5fb; --mut:#8ba1b4; --mut2:#5e7385;
    --teal:#00d4aa; --sky:#37b7ff; --gold:#ffd23e; --green:#37e6a4; --red:#ff6b6b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);
    font-family:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  .stage{height:100vh;width:100vw;display:flex;flex-direction:column;padding:1.3vh 1.3vw;gap:1.1vh}
  header{display:flex;align-items:center;gap:1.1vw;padding-bottom:.9vh;border-bottom:1px solid var(--line)}
  .logo{width:4.4vh;height:4.4vh;border-radius:1vh;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--teal),var(--sky));color:#04121d;font-weight:900;font-size:2.3vh}
  .htitle{font-size:2.5vh;font-weight:900;letter-spacing:.4px}
  .hsub{font-size:1.25vh;color:var(--mut);margin-top:.1vh}
  .live{margin-left:auto;display:flex;align-items:center;gap:.6vw;font-weight:800;font-size:1.5vh;color:var(--red)}
  .live .blip{width:1.1vh;height:1.1vh;border-radius:50%;background:var(--red);animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .clock{margin-left:1vw;font-size:1.6vh;color:var(--mut);font-variant-numeric:tabular-nums}
  .pb{margin-left:.9vw;font-size:1.15vh;color:var(--mut2)}.pb b{color:var(--teal)}

  .grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:1vw;min-height:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:1.1vh;padding:1vh .9vw;display:flex;flex-direction:column;min-height:0}
  .ch{display:flex;align-items:baseline;gap:.7vw;margin-bottom:.7vh;padding-bottom:.6vh;border-bottom:1px solid var(--line)}
  .ctitle{font-size:1.9vh;font-weight:900;color:var(--sky);letter-spacing:.3px}
  .cmeta{margin-left:auto;font-size:1.15vh;color:var(--mut2);font-weight:600}
  .thead{display:grid;grid-template-columns:2.1vh 1fr 2.8vw 2.8vw 3.1vw 4.8vw;align-items:end;padding:0 .4vw .35vh;gap:.25vw}
  .thead div{font-size:1.0vh;color:var(--mut2);text-transform:uppercase;letter-spacing:.05vw;font-weight:700;text-align:right}
  .thead div.l{text-align:left}
  .thead div.chance{color:var(--teal)}
  .rows{flex:1;display:flex;flex-direction:column;justify-content:flex-start;gap:.3vh;min-height:0}
  .row{display:grid;grid-template-columns:2.1vh 1fr 2.8vw 2.8vw 3.1vw 4.8vw;align-items:center;padding:.42vh .4vw;border-radius:.7vh;gap:.25vw}
  .row.lead{background:linear-gradient(90deg,rgba(255,210,62,.22),rgba(255,210,62,.04));box-shadow:inset 0 0 0 1px rgba(255,210,62,.35)}
  .rk{font-size:1.5vh;font-weight:800;color:var(--mut2);text-align:center}
  .row.lead .rk{color:var(--gold)}
  .club{display:flex;align-items:center;gap:.6vw;min-width:0}
  .lg{width:3.4vh;height:3.4vh;border-radius:.6vh;object-fit:contain;background:#fff;padding:.22vh;flex:none}
  .badge{width:3.4vh;height:3.4vh;border-radius:.6vh;display:grid;place-items:center;font-weight:900;color:#04121d;flex:none;background:#889;font-size:1.2vh}
  .nm{min-width:0}
  .bignm{font-size:1.6vh;font-weight:800;line-height:1.02;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row.lead .bignm{color:var(--gold)}
  .subnm{font-size:1.02vh;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.1vh}
  .val{font-size:1.5vh;font-variant-numeric:tabular-nums;text-align:right;font-weight:700}
  .val.mut{color:var(--mut2);font-weight:600}
  .val.pts{color:var(--gold);font-weight:900}
  .val.chance{color:var(--teal);font-weight:800;position:relative}
  .chbar{position:absolute;left:0;right:0;bottom:-.35vh;height:.3vh;border-radius:.2vh;background:var(--line);overflow:hidden}
  .chbar b{display:block;height:100%;background:var(--teal)}
  .empty{flex:1;display:grid;place-items:center;color:var(--mut2);font-size:1.4vh;text-align:center}
  .hdrlogo{height:4.8vh;width:auto;max-width:20vw;object-fit:contain;display:block}
  .padeja-mark{height:2.4vh;width:2.4vh;border-radius:.5vh;vertical-align:-.6vh;margin:0 .3vw}
  .padeja-lockup{height:2.9vh;width:auto;object-fit:contain;vertical-align:middle;margin-left:.45vw}
</style>
</head>

const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function q(path){
  try{ const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,{headers:{apikey:SUPABASE_ANON,Authorization:"Bearer "+SUPABASE_ANON}}); return r.ok?await r.json():[]; }
  catch(e){ return []; }
}
function logo(club){
  const src=CLUB_LOGOS[club];
  if(src) return `<img class="lg" src="${src}" alt="">`;
  const initials=(club||"?").split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
  return `<div class="badge">${esc(initials)}</div>`;
}
let PROFS={}, LEVELS={};
function pname(id,fb){ return (id&&PROFS[id])||fb||""; }
function teamPlayers(t){
  const a=pname(t.player1_profile_id,"");
  const b=(t.player2_name&&t.player2_name.trim())||pname(t.player2_profile_id,"");
  return [a,b].filter(Boolean).join(" & ");
}
function cmpTeam(a,b){
  return (b.league_points||0)-(a.league_points||0)
      || ((b.points_for||0)-(b.points_against||0))-((a.points_for||0)-(a.points_against||0))
      || (b.points_for||0)-(a.points_for||0)
      || String(a.team_name).localeCompare(String(b.team_name));
}

// ── ratings + projection ────────────────────────────────────────────────
// Pairing ratings from the BPC Teams sheet (combined pair rating per club, per league).
const SHEET_RATINGS={
  mens1:{"Team Padeja":8.0,"Crispy Winners":9.0,"Lob Mob":8.15,"No Strings Attached":8.95,"Anti-Social":7.92,"The Misfits":8.27},
  mens2:{"Team Padeja":7.85,"Crispy Winners":8.4,"Lob Mob":7.75,"No Strings Attached":8.7,"Anti-Social":7.45,"The Misfits":8.07},
  mens3:{"Team Padeja":7.6,"Crispy Winners":8.0,"Lob Mob":7.55,"No Strings Attached":7.35,"Anti-Social":7.48,"The Misfits":7.47},
  mixed:{"Team Padeja":7.6,"Crispy Winners":7.55,"Lob Mob":6.8,"No Strings Attached":7.5,"Anti-Social":7.56,"The Misfits":6.75},
  ladies1:{"Team Padeja":7.2,"Crispy Winners":7.1,"Lob Mob":7.35,"No Strings Attached":6.9,"Anti-Social":7.35,"The Misfits":7.25},
  ladies2:{"Team Padeja":7.0,"Crispy Winners":6.3,"Lob Mob":6.0,"No Strings Attached":6.45,"Anti-Social":6.45,"The Misfits":6.65},
};
function teamRating(t){
  const s=(SHEET_RATINGS[TID2KEY[t.tournament_id]]||{})[t.team_name];
  if(s!=null) return s;
  const a=+LEVELS[t.player1_profile_id]||0, b=+LEVELS[t.player2_profile_id]||0; const sum=a+b;
  return sum>0?sum:null;
}
function attachRatings(teams){
  const known=teams.map(teamRating).filter(v=>v!=null);
  const avg=known.length?known.reduce((a,b)=>a+b,0)/known.length:8;
  teams.forEach(t=>{ const r=teamRating(t); t._rating=(r!=null?r:avg); });
}
function winProb(rA,rB){ if(rA==null||rB==null) return 0.5; return 1/(1+Math.pow(10,(rB-rA)/2.0)); }
function remainingPairs(teams,matches){
  if(!matches.length){ // fixtures not generated yet → assume the full round-robin
    const p=[]; for(let i=0;i<teams.length;i++) for(let j=i+1;j<teams.length;j++) p.push([teams[i].id,teams[j].id]); return p;
  }
  return matches.filter(m=>!m.result_verified && m.home_team_id && m.away_team_id).map(m=>[m.home_team_id,m.away_team_id]);
}
function projectFirst(teams,pairs){
  const N=8000, ids=teams.map(t=>t.id), base={}, rate={};
  teams.forEach(t=>{ base[t.id]=t.league_points||0; rate[t.id]=t._rating; });
  const first={}; ids.forEach(id=>first[id]=0);
  for(let s=0;s<N;s++){
    const pts={}; ids.forEach(id=>pts[id]=base[id]);
    for(let p=0;p<pairs.length;p++){ const x=pairs[p][0],y=pairs[p][1];
      if(Math.random()<winProb(rate[x],rate[y])) pts[x]++; else pts[y]++; }
    let mx=-Infinity; ids.forEach(id=>{ if(pts[id]>mx) mx=pts[id]; });
    const lead=ids.filter(id=>pts[id]===mx), sh=1/lead.length;
    lead.forEach(id=>first[id]+=sh);
  }
  const out={}; ids.forEach(id=>out[id]=first[id]/N); return out;
}
// cache so the % doesn't flicker when nothing has changed
const PROJ_CACHE={};
function projectionFor(key,teams,matches){
  attachRatings(teams);
  const sig=teams.map(t=>t.id+":"+(t.league_points||0)+":"+t._rating).sort().join("|")
          +"#"+matches.filter(m=>m.result_verified).length+"/"+matches.length;
  if(PROJ_CACHE[key] && PROJ_CACHE[key].sig===sig) return PROJ_CACHE[key].proj;
  const proj = teams.length>=2 ? projectFirst(teams, remainingPairs(teams,matches)) : {};
  PROJ_CACHE[key]={sig,proj};
  return proj;
}

async function loadAll(){
  const tids=CATLIST.map(c=>c.tid).join(",");
  const teams=await q(`league_teams?select=id,tournament_id,team_name,played,won,drawn,lost,points_for,points_against,league_points,player1_profile_id,player2_profile_id,player2_name&tournament_id=in.(${tids})`);
  const matches=await q(`league_matches?select=tournament_id,home_team_id,away_team_id,result_verified&tournament_id=in.(${tids})`);
  const ids=[...new Set(teams.flatMap(t=>[t.player1_profile_id,t.player2_profile_id]).filter(Boolean))];
  PROFS={}; LEVELS={};
  if(ids.length){ const pr=await q(`profiles?select=id,display_name,level&id=in.(${ids.join(",")})`); pr.forEach(p=>{ PROFS[p.id]=p.display_name; LEVELS[p.id]=+p.level||0; }); }
  const byCat={}, matchByCat={}; CATLIST.forEach(c=>{ byCat[c.key]=[]; matchByCat[c.key]=[]; });
  teams.forEach(t=>{ const k=TID2KEY[t.tournament_id]; if(k) byCat[k].push(t); });
  matches.forEach(m=>{ const k=TID2KEY[m.tournament_id]; if(k) matchByCat[k].push(m); });
  CATLIST.forEach(c=>byCat[c.key].sort(cmpTeam));
  return {byCat,matchByCat};
}

function cardHTML(cat,arr,matches){
  const played=arr.reduce((s,t)=>s+(t.played||0),0);
  const meta=arr.length?`${arr.length} teams · ${played} played`:"";
  const head=`<div class="thead"><div>#</div><div class="l">Club</div><div>P</div><div>W</div><div>Pts</div><div class="chance">1st</div></div>`;
  if(!arr.length) return `<div class="card"><div class="ch"><span class="ctitle">${esc(cat.name)}</span><span class="cmeta">${meta}</span></div>${head}<div class="empty">No teams yet</div></div>`;
  const proj=projectionFor(cat.key,arr,matches);
  const top=arr[0].league_points||0;
  const rows=arr.map((t,i)=>{
    const lead=(i===0&&top>0)?"lead":"";
    const players=teamPlayers(t);
    const pc=proj[t.id]; const pct=(pc==null)?null:Math.round(pc*100);
    const pctTxt=(pct==null)?"—":(pct<1&&pc>0?"<1%":pct+"%");
    const bar=(pct==null)?"":`<span class="chbar"><b style="width:${Math.max(0,Math.min(100,pc*100))}%"></b></span>`;
    return `<div class="row ${lead}">
      <div class="rk">${i+1}</div>
      <div class="club">${logo(t.team_name)}<div class="nm"><div class="bignm">${esc(t.team_name)}</div>${players?`<div class="subnm">${esc(players)}</div>`:""}</div></div>
      <div class="val mut">${t.played||0}</div>
      <div class="val">${t.won||0}</div>
      <div class="val pts">${t.league_points||0}</div>
      <div class="val chance">${pctTxt}${bar}</div>
    </div>`;
  }).join("");
  return `<div class="card"><div class="ch"><span class="ctitle">${esc(cat.name)}</span><span class="cmeta">${meta}</span></div>${head}<div class="rows">${rows}</div></div>`;
}
async function refresh(){
  const {byCat,matchByCat}=await loadAll();
  $("grid").innerHTML=CATLIST.map(c=>cardHTML(c,byCat[c.key]||[],matchByCat[c.key]||[])).join("");
}
function tickClock(){ const d=new Date(); $("clock").textContent=d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}); }
tickClock(); setInterval(tickClock,10000);
refresh(); setInterval(refresh,15000);
</script>
</body>
